      何が起きたか——PwnEscape は KVM ではなくホストの IPv4 処理の欠陥
      GUEST TO HOST
      壊れる経路

      ゲストが書いたチェックサムの位置を、ホストが検証せずに使う

      frame
      1
      ゲスト（microVM）

      virtio-net のヘッダに開始位置を細工

      2
      VMM

      フレームをホストの TAP に書く

      3
      tun_get_user()

      skb としてホストの IPv4 へ

      4
      ip_do_fragment()

      skb_checksum_help() がヘッダに書き込む

      5
      断片の送出

      ホストのメモリが IP オプションに乗る

      出典: CVE-2026-99999 の CVE レコード（CVSS の根拠欄）と修正コミット 6785011f8b16（2026-10-16 確認）
      ゲストは送るフレームに「この位置からチェックサムを計算して書け」という情報（virtio-net のヘッダ）を添えられます。ホストの VMM はそれを TAP に書き、ホストのカーネルが IPv4 として処理します。断片化する ip_do_fragment() が skb_checksum_help() でチェックサムを埋めるとき、開始位置が IP ヘッダの内側でも止めませんでした。そのためヘッダ長（IHL）が書き換わり、バッファの外のホストメモリが IP オプションとしてゲストに返ります（CVE レコードの CVSS の根拠欄）。

      修正コミット 6785011f8b16 は ip_check_csum_start() を足し、チェックサムを埋める前に開始位置が IP ヘッダより後ろかを確かめます。ブリッジの netfilter など4か所にも同じ確認を入れました。コミットは「入口でのもっと完全な検証は準備中」としています。

      Fixes: は tun（VMM が使う経路）と packet ソケットのオフロード対応（bfd5f4a3d605）の2本です。インターネットから届くパケットでは起きず、ゲストかローカルのプロセスが細工する必要があるので、CVSS の攻撃元は「ローカル」です。packet ソケット側からホストのメモリまで届くかは未検証です。

