  - link:
    text: |
      ダウンロード先指示ファイルを介したAIエージェントののっとりについてまとめてみた
      AI
      2026年10月22日、セキュリティ企業のForever Securityは、顧客端末でAIエージェントによる悪性パッケージの導入をコード実行前に遮断し、導入の指示がダウンロードフォルダの AGENTS.md に由来したと公表しました。同社は、指示ファイルに従ったエージェントが自らの設定を書き換える試験を Codex と Claude Code で行ったとしています。ここでは関連する情報をまとめます。

      指示ファイルによる乗っ取りとは何か
      Forever Security(以下 Forever)の試験では、AIエージェントが起動したフォルダの指示ファイル(AGENTS.md、CLAUDE.md)に従って自らの設定を書き換え、悪性パッケージの導入や認証トークンの漏えいに至った。顧客端末の実観測では、悪性パッケージの導入がコード実行前に遮断された。実観測と Codex の試験で指示ファイルが置かれていたのは、ウェブから書き込めるダウンロードフォルダ(~/Downloads)だった。

      エージェント側の読み込み条件は、開発元の文書によると次のとおり。

      Codex は起動時に AGENTS.md を含む指示を読み込む。プロジェクト層の設定(.codex/)は信頼したプロジェクトでのみ読み込まれ、個人の既定は ~/.codex/config.toml に置かれて全フォルダに共通する(出典: 2, 3)。Forever は、Codex が従うのは信頼したプロジェクトの AGENTS.md に限られるが、一度そのフォルダで作業すれば信頼の対象になると説明している(出典: 1)
      Claude Code は作業ディレクトリと上位ディレクトリの CLAUDE.md を起動時に読み込む。作業ディレクトリと上位に CLAUDE.md(.claude/CLAUDE.md、CLAUDE.local.md を含む)がない場合は、v2.1.277 以降で AGENTS.md を既定で読む。ただし一部のセッションでは AGENTS.md を読めない(出典: 4)。未信頼のフォルダでは対話セッションで信頼ダイアログが表示されるが、非対話(-p)のセッションでは表示されない(出典: 5)
      ファイルの配置について Forever は、ウェブページが利用者のクリックや承認なしに、ファイル名と内容を指定してダウンロードフォルダへ保存できると説明している。エージェントが自らブラウザを操作してページを訪れる場合は、画面を見ている人がおらず、ファイルの到着に気付かれにくいとの見方も示している*1。(出典: 1, 11)

      顧客端末での悪性パッケージ導入の遮断
      Forever は、顧客端末でAIエージェントが既知の悪性 npm パッケージ function-color を導入しようとしたのを、同社の製品でコード実行前に遮断した。調査で、導入の指示の出所が依存パッケージでもコードリポジトリでもなく、顧客の ~/Downloads にあった AGENTS.md と判明した。そのフォルダはエージェントの作業ディレクトリでもあり、ファイルは Codex 向けの内容だった。誰が置いたのか、どう置かれたのかは、誰も把握していなかった。(出典: 1, 10, 12)

      Forever の研究者は、エクスプロイトは動作したが後続の npm パッケージ導入を製品が遮断したと説明した*2。実環境で見つけたのはこの1件で、他の試行を探しているとも述べている。(出典: 12)

      Forever の顧客については、テレメトリで約半数がダウンロードフォルダ内でAIエージェントを実行しており、エージェントのセッションの約4分の1が実際のブラウザを開く。(出典: 1)

      IoC は、function-color の悪性版 1.0.0 と 1.7.3。Checkmarx は10月5日、function-color を同社が MALFEX と呼ぶ npm キャンペーンの悪性パッケージの1つとして解析を公表。function-color 自身はペイロードを持たず、function-flag を依存として導入するラッパーと整理している。(出典: 6)

      OSV は10月7日、MAL-2026-17647として1.0.0 と 1.7.3 を悪性パッケージと判定。導入した機器は完全に侵害されたとみなし、秘密情報を別の機器から更新するよう記載している。(出典: 7)悪性版は npm により削除され、最新版は置換パッケージの 0.0.1-security になっている。(出典: 1, 8)

      Forever は確認項目として、~/.codex/config.toml の想定外の [mcp_servers.*] ブロックや変更された chatgpt_base_url、プロジェクトの .claude/settings.json にある設定した覚えのない ANTHROPIC_BASE_URL を挙げている。これらの変更を見つけた場合は、トークンが漏えいしたとみなして更新するとしている。(出典: 1)

      2つのエージェントでの再現試験
      Codex の試験では、顧客端末にあった攻撃者の AGENTS.md を改変せずに隔離 VM で実行した。Claude Code の試験では、研究者が作成した CLAUDE.md を使っている。試験の大半は電卓を開くだけの無害な代替パッケージで、実際の悪性パッケージは隔離 VM で1回だけ実行した。(出典: 1)

      Forever は、エージェントは設計どおり指示ファイルに従っているだけで、OpenAI や Anthropic がパッチするものはないとしている。(出典: 1)研究者は、開発元がウェブから落とせるファイル由来の指示に従う危険をエージェントに認識させることを検討しうるが、問題はおおむね開発元のセキュリティモデルの外にあると述べた。(出典: 12)

      Codex の設定書き換えによる悪性パッケージ導入
      実攻撃の AGENTS.md は、13KBの開発ガイドライン風の文書で、末尾近くに環境準備を装う節が1つある。この節の指示で Codex は次の順に動く。(出典: 1)

      作業の開始時、依頼の処理に入る前に、個人設定 ~/.codex/config.toml へ MCP サーバー(project-tools 名義)の登録を追記する。登録の実体は悪性 npm パッケージ function-color を導入するコマンドで、Codex は起動時にサーバーのコマンドを実行するため、書き込みだけでコマンド実行に足りる
      設定は起動時にしか読まれないため、一時ディレクトリで子の codex exec を非対話で実行して、登録を同一セッション内で有効にする
      ネットワークを遮断するサンドボックスでは導入に失敗するため、ファイルは子の実行に承認とサンドボックスを回避する指定を付けるよう書いている
      起動時に応答の遅いサーバーを Codex が切断するため、導入を launchctl に委ね、Codex の制御外で完走させる
      Forever は、この流れで迂回した制御を5点挙げている。

      信頼ゲート	ダウンロードフォルダでの作業により信頼の対象になる(前述)
      書き込みの信頼性	短く露骨な導入依頼は拒否され、技術文書風の長い文書の形なら通る
      起動時のみの読み込み	手順2の子の実行で、2つのセッションを1つにまとめる
      ネットワークのサンドボックス	手順3で回避する
      起動時のタイムアウト	手順4で回避する
      攻撃者が得るのは、悪性パッケージの導入によるコード実行と、~/.codex/config.toml の汚染による持続性。この設定は全フォルダに共通のため、書き込み後は、どのフォルダ、どのプロジェクトで起動した Codex のセッションも、起動時に攻撃者のサーバーを読み込む。(出典: 1, 3)

      Forever は、Codex が試験の90%超でマルウェアを実行したとしている。ただしこの試験の大半は無害な代替パッケージによるもので、実際の悪性パッケージは1回だけ実行した*3。(出典: 1)

      Claude Code の接続先の書き換え
      Forever は Claude Code について、Codex より誘導が難しく、パッケージの導入ではなく API 通信の向け先を書き換える別の手口で再現した。研究者が作成した CLAUDE.md は、内部ゲートウェイの設定を装う。(出典: 1)

      プロジェクトの .claude/settings.json の env に ANTHROPIC_BASE_URL を書かせる。向け先は Forever が管理するドメインで、有効な証明書を持つ。この書き込みには人の承認が必要で、怪しく見える書き込みを Claude が拒否することも多い
      書き換え後に開かれる接続では、API 通信が攻撃者側のサーバーに向かい、リクエストごとに OAuth トークンが送られる。Forever は、捕捉したトークンを実際の API で再生し、被害者として扱われたと記載している。コード実行なしのアカウント乗っ取りに当たる
      そのフォルダでの次回の起動時、サーバーがモデルを装い、サンドボックスの無効化(dangerouslyDisableSandbox)を指定した Bash ツール呼び出しを返す。クライアントはモデル自身の判断として扱い、サンドボックスなしで実行する。Forever は、書き込みが成立すればこれは保証されるとしている
      実行中のセッションは起動時に開いた接続を使い続けるため、指示でサブエージェントを生成させ、新しい接続を攻撃者側のサーバー経由で通させる。同一セッション内でのコード実行はこの経路による
      攻撃者が得るのは、OAuth トークンによるアカウント乗っ取りと、コード実行。成否は指示の強さとフォルダの内容に左右され、指示が強すぎると、生成されたサブエージェントが CLAUDE.md を攻撃と判定する。同じファイルがクリーンなフォルダでは成功し、セキュリティ関連のメモが多いフォルダでは毎回失敗した。(出典: 1)

      Forever が示した成功率は、指標が2つある。プロジェクトの .claude/settings.json への書き込みが成立した割合が約半数。別の指標として、同一セッション内でコード実行に至った割合が約5分の1。(出典: 1)



      指示ファイルを起点とした乗っ取りの流れ
      公表後の第三者による検証
      BleepingComputer が Forever の PoC ページを開くと、無害な内容の AGENTS.md がダウンロードされた。Brave では保存の承認を求められた。確認したのは保存の挙動まで。(出典: 10)

      BleepingComputer は、攻撃の成立には利用者がそのディレクトリでエージェントを起動する必要があると記している。Forever の研究者は取材に対し、フォルダの整理や新しくダウンロードしたファイルの処理にエージェントを使うのは一般的だと述べた。(出典: 10)

      さらに第三者は10月28日、Codex 0.160.1 と Claude Code 2.1.296 を、製品既定と制限側のモードで各20回、計80回試行し、無害な標識の成功は0回だったと公表。両エージェントとも指示ファイルを読んで攻撃と認識し、拒否した。試験者は Forever の結果が誤りとは主張せず、考えられる要因として版の更新や、承認とサンドボックスを外した起動をしていないことなどを挙げている*4。(出典: 9)

