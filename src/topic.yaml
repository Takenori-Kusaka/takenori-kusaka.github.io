      IDCFクラウドへのランサムウェア攻撃についてまとめてみた
      Ransomware クラウド システム障害
      2026年10月7日、IDCフロンティアは、同社が提供するクラウドサービス「IDCFクラウド」の一部のシステムが第三者からのランサムウェア攻撃を受け、障害が発生していると公表しました。ここでは関連する情報をまとめます。

      東日本リージョン1の4ゾーンで仮想サーバーが停止
      IDCフロンティアは10月7日の第1報と第2報に続き、10月8日21時2分の第3報で、障害の発生は10月7日午前3時40分頃で継続中と公表した(出典: 1, 2, 3, 4)。対象はIDCFクラウドの東日本リージョン1のうち、tesla、henry、pascal、jouleの4ゾーンで、クラウドサービス上の仮想サーバーの停止と再起動不可が発生している。原因は第三者からの不正アクセス(ランサムウェア攻撃)で、詳細な影響範囲や侵入経路は調査中としている(出典: 3)。

      IDCフロンティアは影響範囲を「IDCFクラウドをご契約いただきご利用中の495の企業や自治体」としており、対象の顧客には個別に連絡している*1。IDCFクラウド TypeS(旧:ホワイトクラウド ASPIRE)とIDCF プライベートクラウドは対象外。(出典: 3)

      10月7日の時点で、SNSではデータを暗号化したなどと主張する犯行声明のような画像が拡散しており、IDCフロンティアは「声明が出ていることは把握しているが、真偽を含めて調査中だ」と説明していた(出典: 59)。個人情報が流出したかは「確認中」、保存している情報が流出したかどうかなどは調査中としていた(出典: 59, 60)。



      IDCフロンティアが示した影響範囲
      4ゾーンの顧客データは復元が困難な見通し
      IDCフロンティアは第3報で、4ゾーンに保管されている顧客データについて「取り出しや復元が困難な見通し」とした。「現時点での当社の見解では、データの復元はお客さま自身が保持しているバックアップデータからのみ可能」としている(出典: 3)。

      顧客への案内は、利用しているゾーンやリージョンによって異なる。(出典: 3)

      4ゾーンの顧客: 現在の被害状況とセキュリティの観点から、別環境を準備しての再構築を案内。データの復元は顧客自身のバックアップから
      東日本リージョン1のその他のゾーン(radian、newton)と、東日本リージョン2、東日本リージョン3、西日本リージョン1の顧客: 「現時点で不正アクセスは確認されていません」とし、顧客自身によるデータのバックアップを案内。バックアップの取得手法は順次案内している
      管理コンソールの停止中は、仮想サーバーの起動や停止などの作業を、顧客の要望に従ってIDCフロンティアが代行している(出典: 3)。

      第3報が示した対応状況は次の3項目。(出典: 3)

      ネットワークの遮断とシステムの停止(10月7日に完了): 二次被害やデータ漏えいを防ぐため、東日本リージョン1をネットワークから遮断し、管理コンソールを停止
      侵入経路の特定と遮断(対応中): 外部のセキュリティ専門企業と連携し、東日本リージョンと西日本リージョンを構成するネットワーク、サーバー、ストレージなどの調査を継続
      その他リージョンの被害拡大の防止(対応中): 東日本リージョン1以外で、顧客が外部からアクセスできる管理コンソールを停止中。安全性が確認でき次第、再開予定*2
      IDCフロンティアは、監督省庁と警視庁への報告を行うとともに、影響範囲の調査を継続し、再発防止策を検討しているとしている(出典: 3)。

      10月9日の第4報では、10月7日午前9時に緊急対策本部を設置したと公表した。親会社のソフトバンクの法人部門を窓口として、バックアップ手順の案内と移行環境の提案を行っている。調査と復旧はIDCフロンティアの技術部門が中心で、ソフトバンクの技術部門が支援している。監督省庁や警察などの各機関への報告と相談も進めている(出典: 89)。

      情報漏えいの可能性の公表
      JR東日本は10月9日、IDCフロンティア社で発生した不正アクセスに伴い、えきねっと会員と大人の休日倶楽部会員へのメール配信用外部サービス*3 が一部使用できなくなるとともに、電子メールアドレス等の個人情報が漏えいした可能性があることが判明したと公表した。「現時点では、一部のお客さまのメールアドレスを含む電子メールログデータ等が閲覧または取得された可能性を否定できない状況」としている(出典: 104)。

      えきねっと会員: 対象件数(最大)は約167万件。漏えいした可能性がある情報は電子メールアドレス(ビジネスえきねっと会員は除く)
      大人の休日倶楽部会員: 対象件数(最大)は約39万件。漏えいした可能性がある情報は電子メールアドレス、会員番号、クレジットカード有効期限、生年月日
      氏名、住所、電話番号、クレジットカード番号等は、漏えいの可能性はないとしている(出典: 104)。2サービスでは会員向けのメール配信が一部できなくなっているが、列車の切符などは通常通り予約できる(出典: 117)。

      ビューカードも同日、会員サイト「VIEW's NET」の登録者向けメール配信が一部できなくなっているとして、IDCフロンティアで発生した不正アクセスに伴いメールアドレスが漏えいした可能性があると公表した。可能性は2026年10月7日に判明したとしている。メールアドレスの対象件数は約403万件で、対象者の特定は調査中。iiマークのあるカードとビュー法人カードは対象外となる。「現時点では、一部のお客さまのメールアドレスが閲覧または取得された可能性を否定できない状況」とし、氏名、住所、電話番号、クレジットカード番号等は漏えいの可能性はないとする。漏えいしていた場合は、メールアドレス宛に不審なメールが送信される可能性があるとしている。両社とも、漏えいした可能性のある顧客には準備でき次第、個別に電子メールで知らせるとしている(出典: 104, 105)。

      自治体では、小平市が問合せフォーム等を利用した際の住民情報に漏えいのおそれがあると公表し、焼津市は問い合わせフォームの約50件の個人情報が漏れた恐れがあるとしている。いずれも漏えいは確認されていないとしている(出典: 55, 85)。湖西市は10月9日の第3報で「個人情報などの保存はされておらず、流失はありません」とした(出典: 109)。

      IDCFクラウドを名指しした事例
      10月7日は、IDCフロンティアの第1報(13時52分)より前の朝から、各組織が公式サイトやXでサービスの停止や閲覧不能を案内し始めた(出典: 1, 4, 30)。同日9時32分にはUDトークがIDCFクラウドを名指しして公表している(出典: 6)。

