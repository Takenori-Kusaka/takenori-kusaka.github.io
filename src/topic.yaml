      CVE-2026-99999（PwnEscape）とは｜さくらが新規受付を止めたLinuxカーネル脆弱性と確認手順
      WHY READ
      今回の本命の経路はホスト側のカーネルにある。利用者が直せるのはゲストまでで、ホストの修正は事業者の告知を待つしかない。自分が直す範囲の見分け方と、版番号の読み方・確認手順を実測で示す。

