      Anthropic⁠⁠、AIエージェントによる物理デバイス操作の共通規格「Model Hardware Standard」を発表
      2026-08-28

      105
      シェア




      Anthropicは2026年8月27日、AIエージェントが物理デバイスを安全に操作するための共通仕様「Model Hardware Standard」（⁠MHS）のリサーチプレビューを、先進的な科学研究機関および製造業者向けに公開した。

      Previewing the Model Hardware Standard | Anthropic

      AIをハードウェアに接続する際には標準化された方法がなく、エージェントが機器を安全に操作する手段も確立されていない。現状ではこうしたハードウェアのセットアップと統合に数週間、場合によっては数ヵ月を要する。MHSはこうした統合作業に要する時間を数時間から数分に短縮する。

      さらに、デバイス操作ツールにAIを組み込む際に、MHSは自律的な24時間体制の実験やワークフローをより容易にオーケストレーションできるよう支援する。MHSによりエージェントは実験の各ステップを推論し、パラメータをリアルタイムで更新し、場合によっては人の介入なしにハードウェアエラーから復旧することができるようになる。

      MHSは、コンピュータのOSとデバイス間のやりとりに標準化された「MHSドライバ」を導入することで、各デバイスのプログラミングインターフェースを統合するための標準的な方法と、デバイスがAIエージェントとデータを共有したり安全に操作するための共通の方法を提供する。MHSドライバは「読み取り」「⁠書き込み」といったあらゆるハードウェアデバイスが理解、実行できるシンプルな基本コマンドを使用する。また、各デバイスを標準フォーマットで検出可能にすることで、専用の「変換」プログラムを介さずデバイスとエージェントが互いを検出し、ネットワークを介して通信できるようにする。

      MHSのしくみ
      MHSのしくみ
      また、MHSドライバにはコードだけでは判別できないハードウェア特性に関する情報を自然言語で直接記述できるタグが含まれており、タグの情報に基づいてデバイスの一般的な特性に関する情報を含む参照ファイルを自動的に生成する。このファイルを参照することで、AIエージェントはこれまで見たことがないデバイスを操作するための情報を得る。

      さらにMHSはMCP、コマンドラインインターフェース、コードファイル（API）の3つの機能をもつため、エージェントがデバイスに接続されたらすぐにデバイスを操作できるようになるだけでなく、これらの機能を連携させることで、1行のコードを書くだけで複数のデバイスにわたるオーケストレーションが可能となる。

      同社のAIエージェントであるClaudeはテキストや画像を介して物理世界を学習しているため、空間的・物理的推論にはまだ限界があり、現状では専門家による監視（expert oversight）が依然として必要であるとしている。またMHSはプログラミングインターフェースを持たないハードウェアにはまだ対応していない。このため、現在こうしたデバイスのメーカーと協力してMHSドライバの導入を進めている。多くの開発者はすでにClaude Codeを使用して物理デバイスを操作しているが、MHSの次の段階では、これらを含めより多くのデバイスをカバーできるようにしたいという。さらに将来、MHSはオープンソース化される予定だが、そのためにはさらなる安全性が確保される必要がある。同社では初期パートナーと共に物理世界でのAI利用に関する安全評価やガイドラインの策定を進めていくとのこと。

      同社ではMHSの開発にあたり、バイオテクノロジー、ロボット工学、量子コンピューティングなどの分野で選ばれた研究機関やメーと初期実験を行ってきた。すでにAmazon Web Services（AWS）やUniversal Robots、Raspberry Pi、Hugging Faceといった企業が、自社製品やプラットフォームでのMHSサポートを表明している。今回の発表により、より多くのデバイスをカバーできるように科学、ロボティクス、エレクトロニクス、製造業のステークホルダーをリサーチプレビューに招待したいとのこと。参加希望者は、MHS公式サイトにあるフォームからリサーチプレビューのウェイティングリストに登録できる。

      Model Hardware Standard
      https://www.modelhardwarestandard.com/

