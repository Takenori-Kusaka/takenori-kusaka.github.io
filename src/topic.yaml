      By Jessica Winter
      長征10号Bは、低軌道への衛星インターネット網の展開や大型商業衛星の打ち上げにも対応するとされ、再使用によるコスト低減は中国の商業打ち上げ需要の獲得にもつながる可能性がある。

      さらに、この打ち上げは中国の有人月面探査計画とも結びついている。今回の打ち上げは、新型有人宇宙船「夢舟」に使われる「長征10号A」の1段目の実証飛行という位置づけでもあった。中央の本体の両側に同じ太さのブースターを2本取り付けた大型仕様の長征10号は、2030年までに宇宙飛行士を月面に立たせるという中国の計画において、有人宇宙船と着陸船を月へと運ぶ役割を担う予定だ。

      日本も大きな一歩を踏み出した
      再使用ロケットの実現に向けて動きだしたのは中国だけではない。日本のJAXAも7月11日に、秋田県能代市の施設で再使用ロケットの開発に向けた小型実験機「RV-X」の飛行試験を実施し、着陸に成功したのだ。実験機は、白い煙を上げながら地上11mの高度まで垂直に上昇してから空中で静止。水平移動してから降下し、着陸するという一連の動作を披露した。

      Play/Pause Button
      JAXAによる小型実験機「RV-X」の飛行試験の様子。実験機は地上11mの高度まで垂直に上昇してから空中で静止し、水平移動してから降下、着陸に成功した。 Video: JAXA
      RV-Xは上部が鉛筆のようにとがった円筒形の機体で、直径約1.8m、全長約7.3m。着陸用の脚を4本備えている。今回得られたデータは、ドイツとフランスと共同開発中でRV-Xと同型のエンジンを搭載する実験機「CALLISTO」や将来の基幹ロケット再使用化に活用される予定だ。CALLISTOは2026年度中の飛行試験を予定しており、今回よりも高い位置からの着陸に挑む計画だという。

      日本の主力ロケット「H3」はコスト半減を目指して開発されたものの、飛ばすたびに機体を廃棄する“使い捨て”であり、再使用機が台頭する市場で価格競争力をどう保つかが課題となっている。機体を再使用できれば、打ち上げ頻度の増加とコストの大幅な抑制につながり、海外の人工衛星の打ち上げ需要を獲得するうえでも強みになるとされる。

      今回は再使用ロケットの分野における垂直着陸というひとつの“答え”に対して、網による捕獲という別解が示されたかたちだ。米国が切り拓いた技術に中国が異なるアプローチで追随し、日本も独自に一歩を踏み出した。ロケットを使い捨てにせず何度も飛ばすという発想は、もはや一部の企業だけのものではなくなりつつある。

      （Edited by Daisuke Takimoto)

