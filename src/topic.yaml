      2026年ノーベル物理学賞について分かりやすく解説！『IceCubeニュートリノ観測所への決定的な貢献、および天体起源の高エネルギーニュートリノの発見』
      2026.10.07





      #物理学 #論文・論文解説 #宇宙 #ノーベル賞 #彩恵りりの科学ニュース解説！
      2026年ノーベル物理学賞サムネ
      (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 画像引用元)

      

      みなさんこんにちは！サイエンス妖精の彩恵りりだよ！

      今回はみんな大注目！2026年ノーベル物理学賞の解説だよ！

      まず、今回の受賞者と授賞理由は以下の通りだよ！

      

      2026年10月6日

      スウェーデン王立科学アカデミーは、2026年のノーベル物理学賞を以下の者に授与することを決定した。

      

      フランシス・ルイ・ハルツェン (Francis Halzen)
      ウィスコンシン大学マディソン校、アメリカ合衆国

      「IceCubeアイスキューブニュートリノ観測所への決定的な貢献、および天体起源の高エネルギーニュートリノの発見」に対して。

      

      宇宙からの捉えどころのない粒子が南極で捉えた
      フランシス・ハルツェンは、南極の氷がニュートリノと呼ばれる粒子の追跡に利用できることに気付いた。彼のビジョンと科学的リーダーシップは、IceCubeニュートリノ観測所の根幹をなすものであった ―― それは光センサーを備え付けた1立方kmの氷である。IceCubeを使うことで、研究者たちは遠い宇宙における極めて高エネルギーな現象で放出されるニュートリノを捉えることができる。

      

      

      Francis Halzen
      (Illustration: Niklas Elmehed / Credit: Nobel Prize Outreach / 画像引用元)

      Francis Louis Halzen (フランシス・ルイ・ハルツェン)
      ベルギー王国、ティーネン出身
      1944年3月23日生まれ (82歳)
      ウィスコンシン大学マディソン校 (アメリカ合衆国) 所属
      賞への貢献度: 1/1

      

      

      CONTENTS

      「ニュートリノ」の研究はノーベル賞の宝庫
      天然にある大量の水を使った観測
      苦労しながらニュートリノを観測する理由は？
      氷は高エネルギーニュートリノの観測に最適！
      巨大な観測装置「IceCube」の成果
      世界中の天文学者の共同受賞と言える成果ではないか？
      「ニュートリノ」の研究はノーベル賞の宝庫
      ひっぐすたんイラスト1
      「ニュートリノ」とは素粒子の1グループのことで、全部で3種類が見つかっているのよ。 (Credit: ひっぐすたん / 画像引用元)

      

      みんなは「ニュートリノ」という言葉を知っているかな？　ニュートリノとは、この宇宙の基本要素、素粒子の1グループのことで、電子ニュートリノ・ミューニュートリノ・タウニュートリノの3種類があることが知られているのよ。お互いの性質はスゴく似ているので、まとめてニュートリノと呼ばれることも多いけどね。

      

      このニュートリノ、実はニュートリノが直接関わっている研究だけでも、これまでに4回もノーベル物理学賞がある、スゴいテーマなのよね！　なので今回は通算5回目の受賞になるのよ！

      

      ニュートリノが直接関わっている研究に関連したノーベル物理学賞
      年代	受賞者	授賞理由
      1988年	レオン・レーダーマン
      メルヴィン・シュワーツ
      ジャック・シュタインバーガー	ニュートリノビーム法と、ミューニュートリノの発見によるレプトンの二重項構造の実証
      1995年	フレデリック・ライネス	ニュートリノの検出
      2002年	レイモンド・デイビス・ジュニア
      小柴昌俊
      リカルド・ジャコーニ	天体物理学への先駆的な貢献、特に宇宙ニュートリノの検出への貢献
      2015年	梶田隆章
      アーサー・B・マクドナルド	ニュートリノが質量を持つことを示す、ニュートリノ振動の発見
      2026年	フランシス・ハルツェン	IceCubeニュートリノ観測所への決定的な貢献、および天体起源の高エネルギーニュートリノの発見
      

      なぜこれほどまでにニュートリノ絡みのノーベル賞が多いのか？　それは、1995年にフレデリック・ライネスさんがニュートリノを検出した功績でノーベル物理学賞を受賞したように、メチャクチャ観測が難しいことが理由の1つとして挙げられるのよね。よく使われるあだ名が“幽霊粒子”と呼ばれるくらいなレベルなのよ。

      

      例えば、今この瞬間も、小指の爪ほどの面積を、1秒間に650億個ものニュートリノが通過しているのよ！　でも、私たちは感じることは無い。なぜなら人体どころか地球すらも貫通するほど当たらないのがニュートリノ。地球の裏側から貫通してきたものすら見つけることが可能！　人体なら一生かけて1個当たるかどうかレベルなのよね。

      

      チェレンコフ光
      氷の中で発生したチェレンコフ光と、それを捉える検出器の想像図。ニュートリノそのものを検知することはできないんだけど、ニュートリノが原子核と衝突することで発生する光を捉えるのが、ニュートリノ観測所の仕組みなのよね。 (Graphic: Evelyn Malkus / 画像引用元)

      

      しかし、もしも本当に全く当たらないなら、そもそもニュートリノは検出不可能なはずだよね？　実際にはごくわずかながら、物質を構成する原子核に当たる可能性があるのよね。この衝突が起こると、何段階かのプロセスを経て特殊な光「チェレンコフ光」を出す性質があるのよ。これが、ニュートリノを検出するカギになるのよ。

      

      ニュートリノそのものと比べれば、原子核との衝突によって生じる光は見やすい。といってもその光はとても弱いので、「光電子増倍管」と呼ばれる装置を使って検出するのよね。この光電子増倍管は、光から電気信号を得るという意味で、電気から光を作る電球の逆の装置だと言えるのよ。

      

      チェレンコフ光を使ったニュートリノ検出装置は、世界中のあちこちに存在するのよね。おそらく最もなじみ深いのは、岐阜県飛騨市神岡町にある「カミオカンデ」のシリーズ。あれは5万トンもの超純水を溜めた巨大水槽で、水に衝突するニュートリノを検出する装置になるのよ。

      

      水が使われるのは、値段が安くて化学的に安定しているのもそうだけど、何より透明だという点が重要。ニュートリノを検出するには光を捉えなければならないわけなので、途中で吸収されたら意味がないからね。普段あまり意識しないけど、光に対して透明であるという水の性質自体が重要になってくるのよ。

      

      ただ、水槽でニュートリノを捉えるというのは、水槽自体を作るのが大変だという、単純ながらも大きな問題を抱えているのよね。初代カミオカンデは直径19m×高さ16m、スーパーカミオカンデは直径も高さもほぼ40mの円筒形の水槽であり、これを作ること自体が大変だよね。

      

      これに加えてニュートリノ検出装置は、主に宇宙からやってくる高エネルギーの粒子を遮断するため、地下深くに置くことが一般的。ってなると、水槽を収めるための巨大空洞を作る必要もあるので、技術的にもとんでもないことをやるしかないのよね。

      

      ひっぐすたんイラスト2
      ニュートリノは人工的に生み出せる他、自然界の発生源からもやってきているのが分かっているのよ。今までは地球、太陽、超新星爆発を起源としたニュートリノが観測されていたんだけど、後に述べるようにIceCubeでは重いブラックホールを起源とするニュートリノが見つかったのよ。 (Credit: ひっぐすたん / 画像引用元)

      

      そしてこれだけ苦労しても、性能としてはどうしても限界がある、というのが悩ましいのよ。ニュートリノは原子炉のような人工の発生源に加え、地球や太陽など自然界からやってくることも知られているけど、太陽系を飛び越え、はるか遠くの宇宙からもやってきているというのが、長年ずっと言われていたことなのよね。

      

      特に興味深いのは、とても高いエネルギーを持ったニュートリノ。これは人工的に作り出すことはムリであり、天然環境でも簡単には生成しないのよね。最もエネルギーが高い、ペタ電子ボルト (PeV=1015eV) と言われる高エネルギーニュートリノは、超新星爆発ですら簡単には作れないほどエネルギーが高いと考えられているのよ。

      

      その代わり、このような高エネルギーニュートリノは数自体が少ないと考えられているのよね。ただでさえ数が少ないのに、ニュートリノが原子核と滅多に当たらないことを考えれば、検出ははるかに困難になるよね。そこから計算すると、高エネルギーニュートリノを検出するには立方kmスケールの検出器が必要なのよ！

      

      これはあまりにも大きい！　スーパーカミオカンデは5万トンの超純水タンクだけど、これは立方kmに直すと、たったの0.00005km3にしかならない！　現在建設が進んでいるハイパーカミオカンデでさえ0.00026km3なのだから、1km3はそれのほぼ4000倍も大きいモノになってしまうのよ！ (※有効体積で比較すればもっとデカい！)

      

      ハイパーカミオカンデを収める空洞が世界最大級の人工空洞と言われていることを考えると、人工水槽でやることは限界があるよね？　しかし、大きな体積の水を使うという点だけに注目するならば、この地球は水の惑星。大量の水がある場所があちこちにあることを利用しない手はないと思わない？

      

      天然にある大量の水を使った観測
      そもそも、大量の水を使ってニュートリノを観測しようというアイデアは、1960年にフレデリック・ライネスさん、ケネス・グライゼンさん、モイセイ・マルコフさんが独立してアイデアを提唱したのよ。具体的に動いたのは1975年、ライネスさん達が開いたワークショップにより、具体的な動きがあったのよ。

      

      ライネスさん達による構想では、海底に光電子増倍管を数珠つなぎにした紐状の検出器を設置することで、海水自体を立方kmスケールのニュートリノ検出装置にしようというものだよ。この動きは1993年に具体化され、ハワイ沖の水深4800mに検出器を設置する「DUMANDデュマンド」というプロジェクトとしてスタートしたのよ。

      

      ところが、このDUMANDは1995年と、すぐに終わっちゃったのよね。1本目を設置した段階で技術的な問題で故障してしまったのよ。また、深海ゆえに深海生物がいて、それによる光が邪魔をした他、天然にある放射性物質 (カリウム40) の影響により、測定結果がノイズだらけになってしまったのも、中止になる遠因となったのよ。

      

      最も、DUMAND自体は失敗とは言えても、この経験がムダになったということは全然ないのよ。DUMANDで得られた技術的な知見は、その後の自然の水を使った、似たようなニュートリノ観測プロジェクトの建築に生かされたのよね。

      

      例えば、ロシアのバイカル湖には「バイカル深層ニュートリノ望遠鏡」が、フランス、トゥーロン沖の地中海には「ANTARESアンタレス」がそれぞれ設置されているんだけど、この設置に当たってはDUMANDで得られた知見が行かされているのよ。それぞれは現在「Baikalバイカル-GVD」と「KM3NeTネット」へと発展しているのよ。

      

      苦労しながらニュートリノを観測する理由は？
      こうした背景がある中で、今回のノーベル物理学賞のフランシス・ハルツェンさんはいったいどういったことをして受賞したのだろう？　ハルツェンさんは1960年代に素粒子物理学の進歩に心ひかれた人なんだけど、当時は原子核を作っている素粒子であるクォークが提唱・実証されたばかりで、そちらの方に興味があったのよね。

      

      博士号を取得したハルツェンさんは、出身地のベルギーからアメリカのウィスコンシン大学マディソン校へと席を移したのよ。この頃には、宇宙からやってくる高エネルギーの粒子線である「宇宙線」を対象に、天体物理学と素粒子物理学が相互に連携し知識を深める方法があるのかを探索し始めたのよ。

      

      ハルツェンさんは、宇宙線の中でも最もエネルギーの高い部類のものに興味を持ち、やがて高エネルギーのニュートリノを観測するというプロジェクトに行きついたのよ。ただ、どうしてその発想に至ったのかを理解するには、少し回り道をしないといけないわね。

      

      宇宙線とは、宇宙空間を高速で駆け巡っていて、高いエネルギーを持っている粒子線のこと。大抵は陽子 (電子を失って裸になった水素) なのよね。ちなみに、この宇宙線そのものも、1912年にヴィクトール・フランツ・ヘスが初めて観測した功績に1936年にノーベル物理学賞を受賞した対象であるのよ。

      

      この宇宙線のエネルギーは実にさまざまで、中には現代の加速器の1000万倍も強力なエネルギーを持つモノすらあるのよ！　観測史上最大のエネルギーを持つ宇宙線は、もしも陽子であると仮定した場合、光の速さの99.99999999999999999999957%で運動しているという、意味の分からない速度になっているのよね！

      

      こんなメチャクチャな速度を与える天然の加速器は何なのか？　天体物理学者は、活動がとても活発な銀河である「活動銀河核」であると考えているのよ。大抵の銀河の中心には重いブラックホールがあると言われているけど、活動銀河核はその中でも、ブラックホールが積極的に周りの物質を飲み込んでいる、活発なタイプになるのよ。

      

      ブラックホールは大量の物質を引き寄せる割には小さいサイズなので、ブラックホールの周りは物質の大渋滞が起こるのよね。このギュウギュウな状態のせいで、落下していた物質の一部は運動エネルギーを貰って、光の速さに近い速さの「相対論的ジェット」として外に飛び出すのよね。

      

      フェルミ1次加速
      フェルミ1次加速によって陽子が加速される原理の模式図。これは超新星爆発の画像を使って説明していることに注意だけど、原理はほぼ一緒だよ。 (Credit: ISAS / 画像引用元)

      

      この相対論的ジェットは、最大で数十万光年も外側に向かって飛び出しながら、周りにある薄い銀河間ガスとぶつかるのよね。このジェットと銀河間ガスとのぶつかった境界面 (衝撃波面) を進む陽子は、磁場の影響で軌道を曲げられるため、境界面を行ったり来たり往復するうちに、段々と加速されるのよ (フェルミ1次加速) 。

      

      高エネルギーな宇宙線は、このような天然の加速器によって信じられないほどの速度を得て外へと飛び出すと考えられているのよ。だから理論的には、高エネルギーな陽子を観測すれば、宇宙で最も高エネルギーな現場の様子を見られるはずなんだけど、ところがそう簡単な話じゃないのよね。

      

      陽子は磁場の影響で軌道を曲げられることから、宇宙空間を移動するうちに、周りにある銀河などの磁場で軌道を曲げられちゃうのよね。なので地球に到達した宇宙線がやってくる方向を見ても、そこに活動銀河核のような候補天体がないなんてことが日常茶飯事。なので宇宙線の本当の起源を知ることができないのよ。

      

      しかし、これがニュートリノなら話は別。先ほどの陽子を加速した境界面では、加速した陽子とその場にある陽子とが衝突し、高エネルギーなニュートリノが生まれることがあるのよ。ニュートリノは陽子と違って磁場の影響で軌道を曲げられることがないので、飛来方向が高エネルギー宇宙線の発生場所だと見なすことができるのよ！

      

      また、ニュートリノが観測しにくい幽霊粒子であることは、何も悪いことばかりじゃないのよね。ニュートリノがやってくる活動銀河核は、物質が大量にあるために光を通さないことがしばしばあるのよ。ニュートリノはそんなのは関係なく貫通するので、光では見通せない場所の、生の情報をそのまま持ってくることが期待できるのよね！

      

      特に、このような高エネルギーの現場で発生する光であるγ線は、宇宙をまんべんなく満たすわずかな光 (銀河系外背景光や宇宙μ波背景放射) の影響を受けやすく、地球に届くころには情報が変化していると考えられているのよね。この点からも、生の情報を持つニュートリノの観測はとても貴重というわけ。

      

      ニュートリノは検出するだけでノーベル物理学賞となるほど捉えるのが困難なのに、なぜこれほど苦労して観測しようとするのか。それは、ニュートリノが遠い宇宙の高エネルギー現象という、最も観測が困難な天文現象の生の情報を持ってくるメッセンジャーであることが大きな理由の1つになっているのよ。

      

      氷は高エネルギーニュートリノの観測に最適！
      1987年の秋、宇宙線の研究をしていたハルツェンさんがカンザス大学で講演し、聴衆の1人である雪氷学者のエドワード・ゼラーさんから面白い話を聞いたんだよね。その内容は、ソビエト連邦の科学者が、南極の氷を使ったニュートリノ観測の試みを考えているというものなのよ。

      

      このソ連のアイデアでは、ニュートリノと氷との衝突で生じた電波を捉えるという内容だったのよ。ハルツェンさんは同僚とこのアイデアについて検討したんだけど、これには問題ありだと分かったのよ。特にエネルギーの高いニュートリノの観測では、とんでもない数の無関係な信号と戦わないといけないといけないからね。

      

      ただ、自然にある大量の水を使うというアイデア自体は悪くなくて、電波ではなくチェレンコフ光を捉える方式ならうまくいくのではないかと考えたのよ。そこでハルツェンさんは、DUMANDに取り組んでいたジョン・G・ラーネッドさんに連絡を取り、アイデアをぶつけてみたのよね。

      

      ラーネッドさんはこのアイデアの優れた面を見抜き、1988年6月には南極の氷をニュートリノ検出器に使うことへの具体的な内容を発表したのよ。ただハルツェンさんは「当時の私が天然の氷の光学的特性について無知でなかったら (他の人と同じように) 恐らく諦めていただろう」と振り返るくらい、難題にぶち当たることとなったのよ。

      南極にニュートリノ観測所を設置するにあたっての最初の重要なステップは、1991年に上がったのよ。グリーンランドの氷床には、氷床を掘り出した跡のボーリング孔があったので、ここに光電子増倍管を挿入し、本当に氷がニュートリノ検出器に使えるかどうかをテストしてみたのよね。

      

      すると、宇宙線と地球大気との衝突で生じた粒子 (宇宙線μ粒子) によって生じたチェレンコフ光を捉えることに成功したのよね。これ自体はニュートリノじゃないものの、天然の氷はチェレンコフ光を捉えるのに十分透明であることがこれで実証されたのよ。

      

      この成果からハルツェンさんは、ニュートリノ観測所を南極点に設置するために本格的に動き出したのよね。なぜ南極点なのか？　第1の理由として、南極点には既にアムンゼン・スコット基地があり、定期的な輸送体制も整っていることから、研究チームが活動するために必要なインフラが既に揃っているというのが挙げられるのよ。

      

      加えて、南極点には十分に分厚い氷があり、氷自体が地盤として強固、かつ岩盤層も地震がほとんどない安定した地域なので、研究施設を作るのに適しているのよね。何より深い氷の中は深海のように暗い上に、放射性物質の濃度は低く、そこを泳ぐ生物もいないので、DUMANDで得られた反省点を活かせるということも大きいのよ！

      

      ただもちろん、南極だからこそ起きる難点もあるのよね。最も大きなものの1つは、南極が寒すぎること。南極点は沿岸から遠すぎるため、1年の大半が行き来不可能だという問題があるのよね。なので建設のような実質的な動きは、南極の短い夏の期間、11月から2月の間に行わないといけなかったのよ。

      

      当時、ハルツェンさんは理論研究に専念していた一方、ラーネッドさんはプロジェクトに忙しく、南極でのニュートリノ観測の理論研究に戻ることは無かったのよ。なのでここで物語は終わってもおかしくなかったんだけど、このアイデアに関心を持った様々な研究者がハルツェンさんの元に集まり、具体的な動きとなっていったのよ。

      

      まずはこのアイデアの実現可能性を探るため、後のIceCubeの前身となる計画「AMANDAアマンダ (南極μ粒子・ニュートリノ検出器アレイ)」が1993年から始まったのよ。この計画では、南極氷床に深さ800mから1000mの穴を開け、DUMANDのような数珠つなぎの光電子増倍管を挿入する計画で、2000年まで段階的に建設が進められたのよ。

      

      ハルツェンさんは、このAMANDA計画を推進した立場だったのよね。雪氷学者から、元々は雪氷学向けに開発された技術である、高圧熱水による採掘で、速やかに穴を作ることができたのよ。1993年のクリスマスイブ、ハルツェンさんは最初のデータを受け取ったんだけど、ところが、その結果はガッカリするものだったのよね。

      

      ニュートリノがどこからやってきたのかを復元するためには、チェレンコフ光がどの方向へと進んだのかを知ることが必要で、そのためには離れた距離に設置された複数の検出器が光を捉えることが必要なのよ。ところがチェレンコフ光は氷の中で50cm未満しか進まないため、方向を推定するのに失敗したのよね。

      

      原因は、氷の中に閉じ込められた気泡。直径はわずか50µm (0.05mm) しかないけど、それが光を散乱するため、このようなことが起きちゃったのよね。人間の目では十分透明な氷でも、チェレンコフ光から見れば家庭用冷凍庫でできた白く濁った氷のように、向こう側が見えないくらいの不透明なものとなってしまっていたのよ。

      

      しかしここでハルツェンさんはあきらめなかった。南極氷床は下へ行くほど気泡の数も大きさも少なくなることから、もっと深く掘れば良いのではないかと考え、最終的に1500mから2000mまで掘り進めたのよね。その結果、1400mより深いところでは、チェレンコフ光は300mも進むほど十分透明であり、観測に使えることが分かったのよ！

      

      2000年まで建設され、2009年まで稼働したAMANDAは、宇宙線と地球大気とが衝突して生じたニュートリノを検出することに成功し、氷はニュートリノ検出器に使えることが証明されたのよね。しかし、本当に検出を目指していた高エネルギーなニュートリノの検出には、AMANDAでは規模が小さすぎるという問題があったのよ。

      

      巨大な観測装置「IceCube」の成果
      2026年ノーベル物理学賞1
      IceCubeの施設の概要。1km3にも及ぶ氷の中には光センサーが張り巡らされていて、ニュートリノと原子核との衝突で生じる光を捉えることで、どんなエネルギーを持つどんな種類のニュートリノがやってきたのかを検知するのよ。 (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 日本語訳は筆者 (彩恵りり) による / 画像引用元)

      

      AMANDAでの成功から、ハルツェンさん達は次世代のニュートリノ観測所である「IceCubeニュートリノ観測所」の建設にいよいよ動き出したのよ。ハルツェンさんを主任研究員としたチームは、NSF (アメリカ国立科学財団) に提案を提出した結果、2002年3月に資金提供の承認を受け、2004年から建設を開始したのよ。

      

      その建設計画は壮大な物。光電子増倍管と電子機器を内蔵した直径約30cmの観測器を数珠つなぎにし、光ファイバーケーブルを通して地上へと信号を送信するのよね。展開された深さは最深部で1450mから2450mにも及び、検出器は125mの三角形グリッド間隔を持つ六角形配置で配置されたのよ。

      

      2011年に完成したIceCubeニュートリノ観測所は、86本のケーブルに、1本当たり17m間隔で60個、合計で5160個もの検出器を分散配置した巨大な観測装置となったのよ。体積にして1km3、重さにして10億トンにも及ぶIceCubeニュートリノ観測所は、このような形で誕生したのよね。

      

      もっとも、IceCubeはあまりにも巨大な装置であるため、そのまま漫然と観測していると、色んな信号を拾い過ぎてしまうのよね。これは、別の発生原因のニュートリノによるものもあれば、全く違う粒子によるものもあるのよ。狙いの高エネルギーニュートリノに由来する信号は少ないので、大量のノイズを取り除く必要があるのよ。

      

      これらのノイズは、高エネルギーニュートリノとはエネルギーややってくる方向が違うという特性があるのよね。ということで検出する方向を工夫したり、エネルギーの性質を見分けることでノイズとして処理することで、1年間に約100個ほどの高エネルギーニュートリノが検出できるように調整できたのよね。

      

      IceCubeで重要なデータが発表されたのは2013年のこと。2010年5月から2012年5月までの2年間のデータ収集と分析により、2つのペタ電子ボルト級のニュートリノ (1.04PeVと1.14PeV) が検出されたことが分かったのよね！　これは世界で初めてとなる、高エネルギー天体物理ニュートリノの検出に当たるのよ！

      

      この最初の2回のデータを取得するための解析戦略は、その後の観測データの分析にも生かされたのよ。2014年に公表された論文では、最初の2回を含む、全部で28個の高エネルギーなニュートリノを検出したこと、それらのニュートリノは間違いなく遠い宇宙からやってきたこと (大気現象由来を5.7σで否定) が報告されたのよ！

      

      その後のデータの積み重ねでは、さらに重要なことも明らかにされたのよね。例えば2024年には、宇宙からやってきたタウニュートリノの検出が報告されたのよ。ニュートリノは3種類あると冒頭で説明したけど、これらの種類は入れ替わることが知られていて、これを「ニュートリノ振動」と呼ぶのよね。

      

      ニュートリノ振動自体は2015年に梶田隆章さんとアーサー・B・マクドナルドさんがノーベル物理学賞を受賞しており、確立した物理現象ではあるんだけど、とはいえこれまでは誰も、遠い宇宙からやってくる高エネルギーニュートリノの中で、タウニュートリノを直接見つける形でニュートリノ振動を検証したことがないのよね。

      

      IceCubeはその性質上、タウニュートリノを他の2種類のニュートリノと区別することができるという強みがあるのよ。ほぼ10年分のデータの分析の結果、全部で7個の高エネルギーなタウニュートリノが見つかり、これまでの天体物理学の知見やニュートリノ振動で種類が変化することを考慮した検出数と矛盾しないことを明らかにしたのよ。

      

      また、2026年6月28日に公開されたプレプリントでは、興味深い報告が上がっているのよ。高エネルギーなニュートリノがどこからやってくるのかについて検証したところ、その多くは天の川の方向からやってくる、つまり天の川銀河に発生源がありそうだ、という分布の偏りを見つけたのよね。

      

      ということは、IceCubeが検出している高エネルギーなニュートリノの、少なくともある程度の割合は、天の川銀河の中で起きている現象に由来するらしいことが予想されるのよね。これは、銀河内で加速された陽子と星間ガスがぶつかり合うことで生じたニュートリノであることが予想されるのよ。

      

      とはいえ、ニュートリノが何でも貫通する性質を持つことを考えると、天の川の後ろ側に隠れている活動銀河核からやってきている可能性もゼロではないのよ。まだ発見とは言い切れないものの、実際にそのような候補も見つかっていることが、その考えを後押しするのよね。

      

      例えば2017年9月には、「TXS 0506+056」という非常に活動が活発な活動銀河核からやってきたとみられる高エネルギーニュートリノを検出したのよ。これはまだ確定したものではないものの、本当ならば1987年の超新星爆発 (SN 1987A) 以来、史上2番目となる、太陽系の外の特定の天体からやってきたニュートリノの検出になるのよね！

      

      また、蓄積したデータを分析した2022年の研究では、「M77 (NGC 1068)」という別の活動銀河核に由来するとみられる79個のニュートリノを検出したのよ。こちらも特定の天体からやってきたニュートリノの検出であり、しかも特別に活発ではない活動で発生したニュートリノである可能性があるなど、こちらも注目されているのよ。

      

      IceCube-Gen2
      現在IceCubeは拡張工事が計画されているのよ。予定通り工事されれば、その規模は体積にして8倍に拡大する、とんでもないサイズになるのよ！　右側にある赤いエリアが従来のIceCubeであり、これも十分巨大な構造物だけど、それでも水色で塗られた拡張後と比べると小さく見えるね。 (Credit: IceCube Collaboration / 画像引用元)

      

      現在、IceCubeは「IceCube-Gen2ジェンツー」という拡張工事が計画されているのよ。計画では、検出器の間隔を広げて埋めることで、体積は8倍、検出感度5倍を目指しているのよ！　IceCube単独で挙げた成果の多さを考えれば、IceCube-Gen2ではさらに多くのことが分かることが期待されるのよ！

      

      世界中の天文学者の共同受賞と言える成果ではないか？
      IceCube Collaboration
      IceCubeニュートリノ観測所で観測と研究を行う国際研究チーム「IceCubeコラボレーション」は、14の国と地域の58機関から450人以上が参加する巨大な組織になるのよ。 (Credit: IceCube Collaboration / 画像引用元)

      

      さてこんな感じで話を進めてみると、途中から「IceCubeの設置を主導したハルツェンさんは確かにスゴいけど、成果そのもののスゴさはIceCubeそのものじゃないのか？」って思った人がいるかもしれないわね。確かにハルツェンさんがいなければIceCubeは無かったかもしれないけど、成果はハルツェンさん1人のものじゃないからね。

      

      IceCubeで研究を行っている国際研究チーム「IceCubeコラボレーション」は、14の国と地域の58機関から450人以上が参加する巨大な組織。一方でノーベル賞は、平和賞以外は団体による受賞を認めておらず、1回の賞で最大3人しか受賞できないという縛りがあるのよね。

      

      なので、これは私個人の考えだけど、今回のハルツェンさんの受賞の背後には、450人以上の共同研究者いると思っているのよね。公式記録としては単独受賞かもしれないけど、実際にはIceCubeコラボレーションに所属する全ての研究者が共同で受賞したものであり、ハルツェンさんは代表として受賞した、という感じだと思うのよ。

      

      また、IceCubeは確かにスゴい施設ではあるものの、IceCube単独では分からないこともたくさんあるのよね。ニュートリノだけで見ても、検出可能なニュートリノのエネルギー値や種類には限界があるのよ。IceCubeが苦手とする領域は、Baikal-GVDやKM3NeTのような別の大規模な観測所が相互的に補完し合う関係になっているのよ。

      

      また、稼働を開始したばかりの中国のJUNO (江門地下ニュートリノ観測所) や、2028年の実験開始を目指すハイパーカミオカンデのような施設は、IceCubeなどと比べるとはるかに小さいけど、やはりIceCubeなどが苦手とするニュートリノの観測や実験を行えるのよね。こちらもこちらでとても補完的な立ち位置にあるのよ。

      

      2026年ノーベル物理学賞2
      そもそもなんで苦労してニュートリノを観測しようとするのか？　その大きな理由の1つは、ニュートリノが他の方法では決して検出することのできない情報を運んでくれるからなんだよね！　そしてこれはニュートリノ自身にも当てはまり、宇宙線やγ線といったほかの情報を組み合わせることで、高エネルギーな天文現象を深く知る「マルチメッセンジャー天文学」へとつながるのよ。 (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 日本語訳は筆者 (彩恵りり) による / 画像引用元)

      

      そして、ニュートリノ以外に幅を広げれば、話はもっと広くなってくるよ。例えば先ほど話したTXS 0506+056については、ニュートリノ検出から1分以内に世界中に情報が送信され、電波からγ線までのあらゆる波長の電磁波の望遠鏡がTXS 0506+056に目を向けたのよ。結果として、関連すると思われる天文現象の詳細観測ができたのよね。

      

      この例のように、ニュートリノと電磁波という、全く別の現象で同じ天体を同時に観測することを「マルチメッセンジャー天文学」と呼ぶのよね。ニュートリノと電磁波は、それぞれ観測のしやすさや持っている情報が全然違うので、どれがスゴいという話ではなく、全部合わせて初めてスゴい結果であることがわかるという感じなのよ。

      

      ちょうど2017年には、重力波と電磁波という別の組み合わせのマルチメッセンジャー天文学の例もあったんだよね。このように2017年はマルチメッセンジャー天文学における非常に重要なマイルストーンが2つもあった、スゴい年になっていて、IceCubeはちょうどその一翼を担っていたわけ。

      

      今後ますます、マルチメッセンジャー天文学は天文学研究の重要な立ち位置になるはずよ。高エネルギーニュートリノ・超高エネルギー宇宙線・γ線・重力波は、高エネルギーな天文現象を理解するための4つの重要な柱として、今後ますます重要度が高まるだろうとは、ノーベル財団の公式資料にも書かれているからね。

      

      私が思うに、今回のノーベル物理学賞は、マルチメッセンジャー天文学の今後の発展を期待して贈ったと思えるのよね。ということは今回のハルツェンさんの受賞、あるいはIceCubeコラボレーションの共同受賞の背後には、世界中の天文学者がいると考えてもいいんじゃないかなと思うのよ。

      

      100年以上前に始まったノーベル賞だけど、この100年でスゴい個人がブレイクスルーをすることよりも、世界中の多くの人々が連携して1つの成果を上げることが増えているのよね。今後その傾向はますます強まっていくと思うのよ。これはアルフレッド・ノーベルが遺言を書いた当時には予想外のことだったかもね。

      

      私はこう思うのよ。現在は平和賞以外に許されていない団体受賞を、自然科学関連の3賞にも広めるべきじゃないかって。せめて最初の内は、これが代表者に対する授与であることが、私が推定するような示唆レベルではなく、明記されるように変えるべきじゃないかと提言するのよ。

