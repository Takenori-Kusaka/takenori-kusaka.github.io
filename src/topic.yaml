      ベン・バーナンキ氏がアントロピックの長期利益信託に任命される
      2026年7月9日
      アントロピックの長期利益信託（LTBT）は、ブルッキングス研究所の特別研究員であり、元連邦準備制度理事会議長であるベン・バーナンキ博士を新たなメンバーに任命しました。バーナンキ博士は、アントロピックが「人類の長期的な利益のために高度なAIを責任ある形で開発する」という使命を遵守するよう監視する独立機関に加わります。

      バーナンキ氏は2006年から2014年まで連邦準備制度理事会（FRB）議長を務め、2008年の世界金融危機とその後の景気回復期において中央銀行を牽引した。政界入りする前は、20年以上にわたり経済学者として活躍し、その大半をプリンストン大学で過ごした。プリンストン大学では経済学部長を務め、世界恐慌と金融危機における銀行の役割に関する研究を数多く行った。その功績により、2022年にノーベル経済学賞を受賞した。

      「人工知能の可能性は計り知れず、その成果の幅も非常に広い。その可能性がどのように実現するかは、私たちが人工知能を取り巻く制度をどのように構築していくかに大きく左右されるだろう」とバーナンキ博士は述べた。「アントロピックは、人類にとってのAIの長期的な利益がリスクをはるかに上回るよう、独自のガバナンス構造を構築してきた。この機会をいただき光栄に思うとともに、この重要な使命にできる限り貢献していきたい。」

      「AIは現代史において、あらゆる技術の中で最も大きな経済的影響を及ぼす可能性があり、Anthropicにはその影響を理解し、それに対応するという二重の責任があります」と、Anthropicの共同創設者兼社長であるダニエラ・アモデイは述べています。「ベンは、経済が破壊的な変化にどのように反応するかを研究することから、世界最大の経済をそのような時期を乗り越えさせる手助けをすることまで、幅広いキャリアを積んできました。彼の判断力は、高度なAIが世界中の労働力と経済にどのような影響を与えるかを予測し、それに対応する上で、私たちをより優れた存在にしてくれるでしょう。」

      Anthropicは公益法人であり、商業的成功と社会的・公共的利益の創出とのバランスを取ることを目的として設立されました。LTBTは、Anthropicが長期にわたり責任を持ってそのバランスを維持できるよう支援し、AIの開発と展開方法をチェックする役割を担っています。理事は幅広い分野における専門知識に基づいて選出され、経営陣や投資家から独立しています。理事はAnthropicの株式を保有せず、利益分配も受けず、報酬は時間とサービスに対してのみ支払われます。新たな理事は、既存の理事が会社と協議の上選出します。

      「この技術を中心に構築される組織は、技術そのものと同じくらい重要になるでしょう」と、LTBT議長のニール・バディ・シャー氏は付け加えた。「ベンは8年間連邦準備制度理事会を率い、専門知識、独立性、そして的確な判断力をもって、ほぼ1世紀ぶりの最悪の金融危機を国を導きました。AIの影響力が拡大する中で、私たちが理事に求める基準はまさにそれであり、ベンがこの取り組みに加わることを選んでくれたのは幸運です。」

      LTBTは、Anthropicの理事会メンバーを任命する権限を有しています。理事は、特にAIの潜在的なリスクや社会への影響に関する重要な決定事項について、理事会およびAnthropicの経営陣に助言を行います。バーナンキ氏の任命により、Anthropicが最も注力している課題の一つである、AIが経済をどのように変えているかという問題に専門知識がもたらされます。彼は、Anthropicの他の活動分野に加え、経済研究にもその見識を提供してくれるでしょう。

      バーナンキ氏は、ニール・バディ・シャー氏、リチャード・フォンテーヌ氏、マリアノ・フロレンティーノ・クエジャール氏とともにLTBT（長期予算タスクフォース）に加わる。彼らの経験は、グローバルヘルス、国家安全保障、法律、政策、経済など多岐にわたる。



