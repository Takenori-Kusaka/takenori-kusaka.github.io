        k4sen主催『LoL』大会「LTK（League The k4sen）シーズン フィナーレ」の全4チーム・メンバーが発表。3階級制で、総勢60名が激突します。

        FISTBUMP編集部
        FISTBUMP編集部

        「LTK（League The k4sen） シーズン: フィナーレ」全4チーム・全出場メンバーまとめ…60名の『LoL』プレイヤーが集結、10月15日より開幕
        「LTK（League The k4sen） シーズン: フィナーレ」全4チーム・全出場メンバーまとめ…60名の『LoL』プレイヤーが集結、10月15日より開幕
        ZETA DIVISIONのk4senさんが主催する『リーグ・オブ・レジェンド』のコミュニティ大会『League The k4sen: League of Legends Streamer's Championship Supported by Riot Games』（以下、LTK）。10月15日から開幕する「Season: Finale（フィナーレ）」の全出場チームおよびメンバーが発表されました。

        「LTK（League The k4sen）」シーズン フィナーレ…スケジュール・フォーマットが公開、10月15日開幕【リーグ・オブ・レジェンド】 | FISTBUMP（フィストバンプ）
        画像
        LTKSeasonFinaleは10/15-11/22開催。NEXT/CORE/MASTERSの3階級制で4チームが総力戦。Regular24試合、MASTERS Cup、Playoffsを実施。

        前シーズンに続き「NEXT」「CORE」「MASTERS」の3階級制で、各チーム15名・総勢60名による総力戦。会期は10月15日（木）から11月22日（日）までの計11日間で、Regular Stage、MASTERS CUP、Playoffsが行われます。

