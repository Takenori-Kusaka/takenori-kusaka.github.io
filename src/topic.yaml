      やることは立場で分かれます。

      立場	やること
      信頼できないゲストを動かすホスト（クラウド・VPS 事業者、KVM や Firecracker を自前で運用）	ホストのカーネルを修正版に上げて再起動。最優先
      クラウド・VPS のゲスト	配布元の修正版に上げる。ホストの修正は事業者の告知を待つ
      信頼できないローカル利用者やコンテナを抱えるサーバ	修正版に上げる（packet ソケット側の経路への備え）
      仮想化もしない単体のサーバ	通常の更新の順番で上げる
      配布元のカーネル（Ubuntu の 6.8.0 系、RHEL 系の 5.14.0 系など）は上流の版番号を使わないので、配布元のセキュリティ情報で修正パッケージを確かめます。Ubuntu は10月18日、ほかは10月17日未明の状況です。

      配布元	状況	確認の方法
      Ubuntu	16.04 以降の LTS が needed（修正待ち）。USN は無い	直接（CVE の JSON）
      Debian	sid だけ 7.2.11-1 で修正。bookworm（6.1.187-1）・trixie（6.12.111-1）・forky は vulnerable	Debian Security Tracker
      RHEL	修正の RHSA は見つからない	Red Hat の CVE ページ
      AlmaLinux 系	CloudLinux が「AlmaLinux の修正待ち」と記載	CloudLinux のブログ
      Amazon Linux	ALAS は見つからない	未確認
      緩和策として、CloudLinux は信頼できないゲストのチェックサムオフロードを切ることと非特権ユーザー名前空間を止めることを「部分的」と挙げ、Red Hat は基準を満たす緩和策は無いとしています（未検証）。オフロードを切ると性能に響きます。

      自システム確認コマンド——CVE-2026-99999 の版と、関連する構成を見る
      調べる対象はリポジトリの依存ではなく動いているカーネルなので、git fetch --all --prune は付けず、版と /sys の中身を読みます。

      このコマンドは脆弱性の判定ではありません。 影響を受けるかの最終判断は、動いているカーネルが修正済みか（上流の修正版か、配布元の修正パッケージか）で決まります。3つ目は、今回の本命の経路の入口（vnet_hdr つきの TAP）を持つかを見る構成の確認です。「あり」でも修正済みのカーネルなら影響しません。「なし」でも packet ソケット側の経路と macvtap は見ていないので、安全とは言えません。

      THREE CHECKS
      確かめる3点

      版番号で判断できるのは上流の番号を使う系列だけ

      1.動いているカーネルの版

      uname -r。入れ替えたら再起動するまで古いまま

      2.系列ごとの修正版と比べる

      Debian 12 は uname -v の版。Ubuntu・RHEL 系は配布元の告知で

      3.ゲストを動かすホストか

      TAP の tun_flags に vnet_hdr があるか

      当サイトで関数と TAP の判定を陽性・陰性対照つきで実行（2026-10-16）
      # 1. 動いているカーネル・配布元・仮想化の種類（none なら物理、kvm などならゲスト）
      uname -r
      uname -v
      systemd-detect-virt
      # 入っているカーネル（新しいものが入っていても、再起動するまで uname -r は古いまま）
      ls -1 /boot/vmlinuz-*
      dpkg -l 'linux-image*' | grep '^ii'   # Debian / Ubuntu
      rpm -q kernel                         # RHEL / Alma / Rocky / Amazon Linux
      COPY
      # 2. 上流の版番号を使うカーネルを、系列ごとの修正版と比べる
      pwnescape_check() {
        v=${1:-$(uname -r)}; base=${v%%[-+_]*}
        br=${base%.*}; p=${base##*.}
        case $br in
          7.2) fix=11;; 6.18) fix=57;; 6.12) fix=113;; 6.6) fix=159;;
          6.1) fix=190;; 5.15) fix=223;; 5.10) fix=272;;
          *) echo "$v: 上流に修正版が無い系列（7.0・7.1・5.4 など）か配布元の番号。配布元の告知で判断"; return 2;;
        esac
        if [ "$p" = 0 ]; then echo "$v: x.y.0 は配布元の番号。uname -v の版で判断"; return 2; fi
        if [ "$p" -ge "$fix" ]; then echo "$v: 上流の修正版 $br.$fix 以上"
        else echo "$v: 上流の修正版 $br.$fix 未満"; return 1; fi
      }
      pwnescape_check
      # Debian 12 だけ：uname -v に出る上流の版で比べる（版が出ない環境では何もしない）
      dv=$(uname -v | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
      [ -n "$dv" ] && pwnescape_check "$dv"
      COPY
      # 3. 関連する構成：ゲストのフレームを受け取る TAP があるか（判定ではない）
      for f in /sys/class/net/*/tun_flags; do
        [ -e "$f" ] || { echo "TAP/TUN デバイスなし（packet ソケットの経路は別。カーネルの修正状況で判断）"; break; }
        n=$(basename "$(dirname "$f")"); fl=$(cat "$f")
        # 16384 = 0x4000 = IFF_VNET_HDR
        if [ $(( fl & 16384 )) -ne 0 ]; then echo "$n: vnet_hdr あり"; else echo "$n: vnet_hdr なし"; fi
      done
      COPY
      4つ目は脆弱性の確認ではなく、ホストメンテナンスでゲストが再起動されたときの備えです。

      # 4. 再起動のあと、サービスが自動で上がる設定か（起動時に有効か）を見る
      systemctl list-unit-files --type=service --state=enabled --no-legend
      # 自分のサービス名に置き換える。disabled は、ほかのユニットから呼ばれない限り自動では上がらない
      systemctl is-enabled nginx.service postgresql.service
      COPY
      1〜3つ目のブロックは、10月17日に GNU bash 5.2.21 のコンテナ（カーネル 6.18.44-fc-v139、docker）で、掲載したとおりに走らせ直しました。

      ・2つ目の関数は偽の版番号19通りで、修正が無い最後の版は「未満」、修正版ちょうどは「以上」、Debian 12 の 6.1.0-28-amd64 は「uname -v で判断」、Ubuntu の 6.8.0-87-generic・RHEL 系・7.0.14 は「配布元の告知で判断」と出た
      ・3つ目は、IFF_VNET_HDR を付けた TAP（tun_flags は 0x5002）だけが「vnet_hdr あり」、付けない TAP（0x1002）は「なし」、TAP を閉じた後は「デバイスなし」と出た（陽性・陰性の対照）
      ・このコンテナでは関数が「6.18.57 未満」と返した。これはゲスト側の版で、ホストの状態は分からない
      ・4つ目は10月18日に systemd 255 の同じ環境で、有効な postgresql.service が enabled、無効な console-getty.service が disabled、無い nginx.service が not-found と出た。見るのは unit ファイルの設定で、動いているかではない

      配布元が修正だけを先に取り込むこともあるので、「未満」は「修正前の可能性がある」と読んでください。rpm -q kernel は RPM 系の環境が無く未実行、macvtap は tun_flags を持たないとみられこの方法では拾えません（未検証）。

      影響範囲——CVE-2026-99999 で危ないのは誰か、版だけでは言えないもの
      影響を受ける条件は、修正前のカーネルが、信頼できない側から来たチェックサム情報つきのパケットを IPv4 として断片化・処理することです。

      環境	影響	判断の材料
      他人のゲストを動かすホスト（マルチテナントのクラウド・VPS・Sandbox）	最も重い。ゲストからホストのメモリ漏えい、クラッシュ、コード実行の報告	カーネルが修正済みか。3つ目のコマンドは経路の入口があるかの目安
      自分のゲストだけを動かすホスト	ゲストが乗っ取られたときの次の一手になる	同上
      クラウド・VPS のゲスト	ゲスト自身のカーネルは、ゲスト内のローカルの経路について影響を受けうる。ホストの修正は事業者次第	1つ目・2つ目のコマンドと事業者の告知
      仮想化も信頼できない利用者も無い単体サーバ	インターネットから届くパケットだけでは起きない（CVSS の攻撃元はローカル）	通常の更新で足りる
      ホストの状態は利用者の手元からは測れません。クラウドの利用者が「ホストが直った」と言えるのは、事業者が修正の完了を告知したときです。メンテナンスで再起動されただけでは言えません。AWS の EC2 のように事業者が対象外と告知したサービスは、ゲストの更新だけで足ります。

      参照ソース
      ・CVE-2026-99999 の CVE レコード（CVEProject/cvelistV5）（直接取得。修正版・CVSS と根拠欄、CISA の SSVC）
      ・torvalds/linux の修正コミット 6785011f8b16・gregkh/linux（安定版ツリーのミラー）（git log で各タグへの取り込みを確認）
      ・Ubuntu Security: CVE-2026-99999（直接取得。10月17日・18日）・CISA KEV（cisagov/kev-data）
      ・Debian Security Tracker: CVE-2026-99999・Red Hat: CVE-2026-99999・CloudLinux のブログ
      ・さくらインターネット：会社の告知・クラウド・VPS・レンタルサーバ・マネージドサーバ
      ・エックスサーバー VPS のメンテナンス情報（10月17日掲載・18日追記）
      ・AWS Security Bulletins（2026-137-AWS）・Linode Status・Hostinger Status
      ・ConoHa VPS・ABLENET VPS のお知らせ（10月16日）
      ・Vercel の Sandbox チャレンジの報告・PwnEscape（pwn.ai）（CVE レコードが参照）
      ・報道：The Hacker News・Cyber Security News
      

  - link:
    text: |
      Tesla、新型「Roadster」発表　SpaceX技術で“飛べる”モデルも　日本でも予約受付中
      公開
      2026年10月16日 11時46分
      [ITmedia]

      印刷する
      Googleで優先するソースとして追加
      　米Teslaは10月15日（現地時間）、次世代EVスポーツカー「Roadster」を発表した。米テキサス州マクレガーにある米SpaceXの試験施設からイベントをライブ配信した。イーロン・マスクCEOは2028年の生産開始を目指すと説明した。価格は明らかにしていないが、日本でも公式サイトで予約を受け付けており、予約金合計は682万円となっている。


      日本での予約ページ
      　マスク氏はイベントで、Roadsterを「世界最高の自動車会社と世界最高のロケット会社が協力した成果」と紹介した。将来は自動運転が主流になるとした上で、Roadsterは「Teslaが作る唯一の手動運転車になる」と語った。投資家ピーター・ティール氏がかつて「空飛ぶ車を望んだのに、手に入ったのは140文字だった」と語った言葉を引き合いに、空飛ぶ車を実現したともアピールした。


      イベントでのイーロン・マスクCEO（画像：Teslaの動画より）
      　新型Roadsterは、状況に応じて形状を変えるアクティブエアロダイナミクス、車体を路面に引き付ける“マルチモード吸引システム”、“冷ガススラスター”を搭載する。冷ガススラスターは、SpaceXが宇宙機の姿勢制御に長年使ってきた技術で、Teslaによると、車両で動かすために新たなハードウェアと制御系を開発した。スラスターはタイヤのグリップ限界の4～5倍の力を生み出せるという。車内の使える空間には、ガスを貯める炭素繊維強化圧力容器（COPV）を詰め込んだ。トラックモードで展開するウイングは、人型ロボット「Optimus」のアクチュエーターシステムで駆動する。

      　モデル構成は3種類。公道走行向けの2人乗り「Performance」は、アクティブエアロと吸引システムを備える。レース向けの2人乗り「Thrust」は、吸引システムに加えて車体後部に冷ガススラスターを搭載する。1人乗りの「Rocket」はスラスターを車体の周囲に配置し、前方・上方への加速や横方向の回転が可能で、Teslaは「飛ぶこともできる」としている。0-60mph（約97km/h）加速はPerformanceが1.6秒未満、Thrustが0.9秒未満、Rocketが0.59秒未満。航続距離は300マイル（約480km）以上、最高速度はRocketで時速230マイル（約370km）以上としている。

      　内装は手動の操作系と固定式のシートを採用し、マグネシウムやチタン、カーボンファイバーなどの軽量素材を多用して車重を抑えた。外装デザインは米Lockheed（現Lockheed Martin）が開発した高高度偵察機「SR-71」と、ステルス戦闘機「F-35」から着想を得たという。


      （画像：Tesla）
      　イベントでは、スロープ（ジャンプ台）などの傾斜を使わずに、平地から直接宙へと浮上し、空中でロール回転を成功させる様子を披露した。0-60mph加速で1秒を切る走行も実演した。マスク氏は「安全性を最優先した車ではないが、楽しさは10点満点中11点だ」と語った。


      ジャンプ台なしで浮上し、ロール回転するRoadster（画像：Teslaの動画より）
      　新型Roadsterは2017年11月にコンセプトが発表され、予約金の受け付けも始まっていたが、これまで納車予定を何度も延期してきた。


