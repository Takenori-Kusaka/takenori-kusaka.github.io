    text: |

      2026年ノーベル生理学医学賞について分かりやすく解説！『光駆動型イオンチャネルおよび光遺伝学 (オプトジェネティクス) に関する発見』
      2026.10.06





      #論文・論文解説 #生化学 #ノーベル賞 #彩恵りりの科学ニュース解説！ #健康
      2026年ノーベル生理学医学賞サムネ
      ((Credit: The Nobel Committe for Physiology or Medicine / Illustration: Mattias Karlén / 画像引用元 ① )

      

      みなさんこんにちは！サイエンス妖精の彩恵りりだよ！

      今回はみんな大注目！2026年ノーベル生理学医学賞の解説だよ！

      まず、今回の受賞者と授賞理由は以下の通りだよ！

      

      2026年10月5日

      カロリンスカ研究所ノーベル賞会議は、2026年のノーベル生理学医学賞を、以下の者に授与することを決定した。

      

      カール・ダイセロス (Karl Deisseroth)
      ハワード・ヒューズ医学研究所およびスタンフォード大学、アメリカ合衆国

      ペーター・ヘーゲマン (Peter Hegemann)
      フンボルト大学ベルリン、ドイツ連邦共和国

      ゲオルク・ナーゲル (Georg Nagel)
      ユリウス・マクシミリアン大学ヴュルツブルク、ドイツ連邦共和国

      「光駆動型イオンチャネルおよび光遺伝学 (オプトジェネティクス) に関する発見」に対して。

      

      光を求める藻類が私たちに神経細胞のスイッチを与えてくれた

      2026年のノーベル生理学医学賞は光遺伝学に与えられた ―― それは生きた脳内で、神経細胞が記憶・感情・行動をどのように形作っているのかを解明することを可能にした手法である。ペーター・ヘーゲマンとゲオルク・ナーゲルは、単細胞性の藻類からチャネルロドプシンという驚くべきタンパク質を発見した。カール・ダイセロスはこのタンパク質を、神経細胞用の光制御スイッチへと変換させた。受賞者たちは、神経科学における新時代の礎を築いた。

      

      

      Karl Deisseroth
      (Illustration: Niklas Elmehed / Credit: Nobel Prize Outreach / 画像引用元)

      Karl Alexander Deisseroth (カール・アレキサンダー・ダイセロス)
      アメリカ合衆国、マサチューセッツ州、ボストン出身
      1971年11月18日生まれ (54歳)
      ハワード・ヒューズ医学研究所 (アメリカ合衆国) & スタンフォード大学 (アメリカ合衆国) 所属
      賞への貢献度: 1/3

      

      Peter Hegemann
      (Illustration: Niklas Elmehed / Credit: Nobel Prize Outreach / 画像引用元)

      Peter Hegemann (ペーター・ヘーゲマン)
      ドイツ連邦共和国、ミュンスター出身
      1954年12月11日生まれ (71歳)
      フンボルト大学ベルリン (ドイツ連邦共和国) 所属
      賞への貢献度: 1/3

      

      Georg Nagel
      (Illustration: Niklas Elmehed / Credit: Nobel Prize Outreach / 画像引用元)

      Georg Nagel (ゲオルク・ナーゲル)
      ドイツ連邦共和国、ヴァインガルテン出身
      1953年8月24日生まれ (73歳)
      フンボルト大学ベルリン (ドイツ連邦共和国) 所属
      賞への貢献度: 1/3

      

      

      

      CONTENTS

      脳の仕組みを理解する「突飛な方法」は実現可能か？
      藻類は光を素早く感じる！　ではその仕組みは？
      光を感じて動作する「光駆動型イオンチャネル」を新たに発見
      光で細胞の働きを理解・制御する「光遺伝学」を開拓
      光遺伝学は不治の病を解明・治療する強力なツール
      脳の仕組みを理解する「突飛な方法」は実現可能か？
      私たちヒトは色んなことを記憶・想像したり、感情を抱いたり、呼吸から1歩足を踏み出すまで、様々なことを行っているよね。これらの行動制御は、1.3kgほどの臓器である脳が制御することが分かっており、20世紀には脳の様々な部位が、実に色んな役割を果たすことが理解されたのよ。

      

      ただ、脳というのが900億個の神経細胞からなる複雑なネットワークであると理解されるに従い、それまで使われていた手法は大雑把なことしか理解できないと分かってきたのよ。たとえるなら、今までの脳の仕組みの理解はピンボケした風景写真のようなものであり、建物の輪郭は分かっても、外壁や窓の様子は分からないようなものよ。

      

      この問題について問題提起を行ったのが、あのフランシス・クリックさんよ。DNAの二重構造を発見したことで1962年にノーベル生理学医学賞を受賞したことで知られているけど、クリックさんはその後行った研究の1つとして、ヒトの意識はどのように現れるのかという、脳神経科学における重大な疑問に取り組んでいたのよね。

      

      クリックさんは、この研究の仮定である1つの理想を抱いていたのよ。脳というのは無数の神経細胞が複雑に絡み合ったネットワークでできており、脳はその部位によって役割が分かれているのは分かっている。そして脳の働きというのは、神経細胞ネットワークを流れる電気信号によって制御されているのよ。

      

      ということは、脳の機能を細かく知ろうとすると「どの神経細胞に電気信号が流れているのか？」という点を特定しないといけないのよね。神経細胞はとても小さい上に、電気信号は一瞬にして過ぎ去っちゃう。なので、そのまま細胞単位で観察するというのは、やっぱ難しいのよ。

      

      そこでクリックさんは、観察するのとは逆のアプローチ「生きた細胞の1個だけに電気信号を流せるような方法を作れば、細胞の反応を見ることで機能を知ることができるだろう」と考えたのよ。そしてこれほど細かく、かつ素早く信号入力を制御できるのは、実質的に光だけだろうとも考えたのよね。

      

      例えば、電気信号を流すんだから電気刺激を与えればいいんじゃない？　と考えるかもしれないわね。ところがこの方法だと、周りの無関係な細胞も刺激してしまうので、細かい制御が難しいのよ。また分子による刺激の場合、細胞に送り込むのが遅すぎるため、素早く制御できない課題を抱えてたのよ。だから光を提案したのよね。

      

      ただ、光を使う方法はクリックさん自身も「突飛な方法」だとも認めていたのよ。神経細胞は光に当てても反応しないから、反応できるように機能を持たせることが必要。ところがこの分野の研究の初期段階では、強力なレーザー光と細胞毒性のある色素を必要とする方法しかなく、生きたまま神経細胞を観察するには不向きだったのよ。

      

      そこまで強くない光を使う研究もあったけど、そちらも別の課題を抱えていたのよね。様々な分子を神経細胞にくっ付けないといけない上に、複数のタンパク質が絡み合った複雑なプロセスを踏むのよね。これによって起こる複数の問題の中で最も致命的なのは、複数のプロセスを踏むことによる反応の遅さにあるよ。

      

      神経細胞を流れる電気信号という状況を人工的に再現するには、神経細胞で電気信号を生成する時間をなるべく短くしないといけないのよね。理想的には0.001秒以内。しかし、光を普段から受信しているヒトの目の細胞ですら、光を浴びてから電気信号ができるまでその10倍以上かかっていることを考えれば、かなーりの難題になるよ。

      

      このような状況なので、クリックさんが「突飛な方法」と言ったのもうなづけるけど、でもクリックさんは決して不可能ではないと考えていたのよ。もしも複雑なプロセスを減らし、たった1個のタンパク質で電気信号の生成ができたらどうなのか？　そんな理想的な反応が自然界に眠っていたのよ。

      

      藻類は光を素早く感じる！　ではその仕組みは？
      2026年ノーベル生理学医学賞1
      図1: 単細胞性の藻類であるクラミドモナスは、眼点という光を感じる部位によって光の方向が分かり、そちらの方向に泳ぐ性質があるのよね。このクラミドモナスを調べてみると、光が当たってからわずか0.0005秒で電気信号が流れているのよね！　これはヒトの目の20倍以上も速いことから、仕組みが異なることが予想されるのよ。 (Credit: The Nobel Committe for Physiology or Medicine / Illustration: Mattias Karlén / 一部のトリミング、画像同士の組み合わせ、日本語訳と説明の追加は筆者 (彩恵りり) による / 画像引用元 ② ③ )

      

      生き物の中には、眼が見当たらないのに光の方向が分かるものがいくつもあるのよね。「クラミドモナス」と呼ばれる単細胞性の藻類はまさにそのような例の1つ。多数のクラミドモナスで緑色に染まった水をシャーレに入れ、片側から光を照らすと、光の方向に泳ぐので、片側だけ色が濃くなるような現象がみられるのよ！

      

      クラミドモナスを観察してみると、表面にオレンジ色の点があるのよね。これは「眼点」と呼ばれる、ある意味“眼”に近いもので、この器官が光を浴びることで、光の方向を察知するのよ。ただ注意しないといけないのは、細胞が光を浴びただけでは光を感じたとは言えず、光の刺激を電気信号へ変換する必要があるということ。

      

      ところで、細胞が電気信号を生み出すには、細胞の内側と外側のイオンの濃度の差が、電気的な差 (電位差) として電流を発生させる必要があるのよ。ところが細胞の壁は簡単にはイオンを通さないし、かといってタダの穴では出入り自由で電気信号を生み出す調整ができない。そのために「イオンチャネル」というものが必要になるよ。

      

      イオンチャネルを一瞬開けると、イオンの濃度差によって電流が発生し、これが電気信号となるわけ。なので光を感じるには、光を受け取った上で、イオンチャネルの開閉を制御しないといけないわけ。普通、これにはイオンチャネルそのものを作るたんぱく質を含む、複数のタンパク質などが関与する複雑な装置がスイッチとなるのよ。

      

      今回の受賞者の1人で、マックス・プランク生化学研究所に所属していたペーター・ヘーゲマンさんは、クラミドモナスの1種であるコナミドリムシ (Chlamydomonas reinhardtii) を使って、正確な光への反応を調べてみたのよ。そしたらビックリ！　コナミドリムシは光を浴びてからわずか0.0005秒後には電気信号が発生していたのよ！

      

      ヒトの目の場合、光を浴びてから電気信号の発生まで最低0.01秒かかっていたのを考えれば、なんと20倍以上も高速！　ではなんでこんなに速いんだろう？　ヘーゲマンさんは、イオンチャネルの開閉スイッチが、複数のタンパク質や反応に成立している場合、こんなに速いわけがないということで、かなり大胆な仮説を立てたのよね。

      

      ヘーゲマンさんは、光を感じることができる「ロドプシン」というタンパク質と、イオンチャネルのタンパク質は、おそらく密接に絡み合った複合体で、実質的に1つのタンパク質となっていると考えたのよ！　1つのタンパク質が光の受信とイオンチャネルそのものの両方を担当していれば、瞬時の電気信号の生成が説明できるからね。

      

      当時、イオンチャネルであるタンパク質はたくさん見つかっていたけど、光を感じて開閉スイッチが機能するイオンチャネルタンパク質は未発見だったので、まぁ大胆な仮説だったわけ。そんなタンパク質あるの？　と言われたら、実物を取り出して見せてみるしかないね。

      

      ところが、コナミドリムシの眼点を構成するタンパク質は、コナミドリムシから取り出すと不安定で、簡単に壊れてしまうのよね。これは結構悩ましい問題で、仮説の証明をすることができないだけでなく、詳しい機能を解析する研究が行えず、機能の理解が進まないということになりかねないからね。

      

      光を感じて動作する「光駆動型イオンチャネル」を新たに発見
      2026年ノーベル生理学医学賞2
      図2: ヘーゲマンさんとナーゲルさんの研究により、クラミドモナスの遺伝子をカエルの細胞に組み込むと、光が当たることで開閉が制御される、新しいタイプのイオンチャネル「光駆動型イオンチャネル」が見つかったのよ！　これは実質的に、光だけで電気信号が制御されているのを意味しているのよね。 (Credit: The Nobel Committe for Physiology or Medicine / Illustration: Mattias Karlén / 日本語訳と説明の追加は筆者 (彩恵りり) による / 画像引用元 ④ )

      

      何はさておき、狙いのタンパク質を見つけるには、まずはそのタンパク質を作るのに関わる遺伝子を見つけないといけないのよね。この遺伝子探しに重要な役割を果たしたのは、浅水恵理香さん達の研究チーム。コナミドリムシの遺伝子に関する情報リスト (発現配列タグのカタログ) を作ったので、大きな手掛かりとなったのよ。

      

      浅水さん達の研究を手掛かりに、コナミドリムシにおいて光を感じるタンパク質であるロドプシンが見つかったのは2000年代初頭のこと。これはヘーゲマンさん達の研究チームに加え、ジョン・L・スプディッチさん達の研究チームと、高橋哲男さん達の研究チームという、全く別の研究チームも独立して同じものを見つけたのよ。

      

      ヘーゲマンさんは、このタンパク質は光を感じるだけでなく、イオンチャネルとしても機能するという仮説を立てたんだけど、当時は光をスイッチにするイオンチャネルは未発見。大胆な仮説とも言えるので、ちゃんとした証拠を出す必要があるのよ。

      

      そこでヘーゲマンさんは、関連機関であるマックス・プランク生物物理学研究所に所属していた、今回の受賞者の1人であるゲオルク・ナーゲルさんに連絡を取ったのよね。ナーゲルさんは、この問題を解決するための重要な知識である、イオンチャネルとイオンの輸送に関する専門知識を持っていたのよ。

      

      生物が持っているタンパク質の機能を調べる時には、必ずしもその生き物自体を使わなくてもいい場合があるのよ。タンパク質の設計図である遺伝子さえ分かっていれば、他の生物にその遺伝子を組み込むことで、元の生物では研究が難しいタンパク質の機能を知ることができるのよね。

      

      ナーゲルさんは、1995年にはバクテリオロドプシンというタンパク質を、アフリカツメガエル (Xenopus laevis) の卵母細胞の表面に作ることに成功しているのよ。このバクテリオロドプシンは、ヘーゲマンさんがコナミドリムシで見つけていたタンパク質候補とスゴく似ている (相同) というので、ノウハウがあるということになるよ。

      

      ナーゲルさんはヘーゲマンさん達と共同で、2002年に、アフリカツメガエルの卵母細胞にコナミドリムシ由来の遺伝子を組み込むことで、目的のタンパク質を細胞表面に作ることに成功したのよ！　このタンパク質は、光によってスイッチが入り、イオンチャネルの開閉を行うという機能が確認されたのよね！

      

      ナーゲルさん達は、光に反応するイオンチャネルであることから、発見したタンパク質を「チャネルロドプシン1 (ChR1: Channelrhodopsin-1)」と名付けたのよ。これは世界初の、光によって開閉スイッチが入る「光駆動型イオンチャネル」の発見となったわけ！

      

      さらに翌2003年には、アフリカツメガエルの卵母細胞とヒト胎児腎細胞のそれぞれで、光駆動型イオンチャネルとしての機能は似ているけど、種類も機能も全く違う別のタンパク質を発見したのよ。その類似性から、このタンパク質は「チャネルロドプシン2 (ChR2: Channelrhodopsin-2)」と名付けたのよ。

      

      特にチャネルロドプシン2は、弱い光でも反応し、0.0002秒以内にイオンチャネルを開いて電気信号を作るなど、挙動が高速という特徴があるのよね。このため「光を当てるだけで、特定の細胞だけに電気信号を生み出すことができる、強力なツールになるのでは？」とヘーゲマンさんとナーゲルさんは考えたわけ。

      

      実際、チャネルロドプシン2を作るように遺伝子を組み替える初期の実験では、ヒト細胞とハムスター細胞の両方で、本来は光を感じない細胞が光を感じるように機能を持たせた上で、実際に電気信号を生み出すことに成功したのよね。

      

      光で細胞の働きを理解・制御する「光遺伝学」を開拓
      2026年ノーベル生理学医学賞3
      図3: 光駆動型イオンチャネルの1つであるチャネルロドプシン2を神経細胞に組み込むと、青色の光が電気信号を作る状況が生み出せたのよ。特定の神経細胞のみが反応するように細かく制御したり、1秒間に数十回のパルスでも電気信号が作られるのは光が当たっている時だけなど、その制御の細かさがウリになるのよね！ (Credit: The Nobel Committe for Physiology or Medicine / Illustration: Mattias Karlén / 一部のトリミング、画像の同士の組み合わせ、日本語訳と説明の追加は筆者 (彩恵りり) による / 画像引用元 ⑤ ⑥ )

      

      ここで話を、3人目の受賞者であるカール・アレキサンダー・ダイセロスさんに話を移すよ。1990年代に医学を学んでいた若き日のダイセロスさんは、脳神経外科の医師になることを志していたのよね。研修の一部は精神科クリニックで行われていたんだけど、その状況に心打たれるものがあったのよ。

      

      クリニックの患者は苦しみを訴え、助けを求めている。これに応えるのが医師というものだけど、同時にダイセロスさんは、ヒトの脳はなぜ、人によって働きが違うのかという疑問も考えたのよ。鬱病の人はなぜ喜びを感じにくいのか？　自閉症スペクトラム障害や統合失調症はなぜ妄想を生み出すのだろうか？　これは難しい課題だよね。

      

      ダイセロスさんは、神経科学の博士号を取得した後に、スタンフォード大学で自身の研究室を設立。この頃に、神経細胞に電気信号を生み出すことができるタンパク質の候補を探索した結果、ナーゲルさん達が発見したチャネルロドプシン2の存在を知ったのよね。

      

      ダイセロスさんはナーゲルさんに連絡を取り、チャネルロドプシン2を作ることができる遺伝子を提供してもらったのよ。2005年にダイセロスさん達は、この遺伝子をラットの神経細胞に入れることで、神経細胞に光駆動型イオンチャネルを生成することに成功し、青色の光を当てれば電気信号を生み出せる状態まで持ってったのよ！

      

      このチャネルロドプシン2を使った方法が優れているのは、弱い光に速やかに反応する以外にもあるのよ。本来は存在しない遺伝子を組み込んだのに、神経細胞には悪影響がなさそうなのよね。また、初期の研究で問題点とされた、光を受け取るための細胞毒性がある分子を入れることも不要だという利点もあるのよね！

      

      この2005年のブレイクスルーはとても大きなもので、その後の1年間は論文まつり！　ニワトリ、線虫、ショウジョウバエなどの実験成果が次々と上がったのよ！ さらに、ウイルスを遺伝子の運び屋にすることで、マウスなどの生きている動物の脳に光駆動型イオンチャネルを生成する方法も確立したわけ！

      

      生きた無傷の脳に光駆動型イオンチャネルを生成できるというのはとても重要。これは生きた脳に対し、光を当てるという最小限の介入だけで電気信号を生み出すことができるというのを意味しているからね。機能を知るだけでなく、機能に介入することすら可能なのを示唆しているのよ！

      

      ダイセロスさん達は、この新しい技術を「光遺伝学 (オプトジェネティクス / Optogenetics)」と名付けたのよ。この名付けた時の論文では、その後の発展や展望について予想が書かれているんだけど、既にそれらのいくつかについて、実現に向けた動きがあるのよ！

      

      2026年ノーベル生理学医学賞4
      図4: 光遺伝学的手法では、生きた動物の脳内に光駆動型イオンチャネルを生成することが可能なのよね。最も象徴的な実験では、生きたマウスの脳内にチャネルロドプシン2を生成し、光ファイバーで脳に光を当てると、他の機能に悪影響を及ぼさないまま、光だけでヒゲの動きを制御するのに成功したのよ！ (Credit: The Nobel Committe for Physiology or Medicine / Illustration: Mattias Karlén / 日本語訳と説明の追加は筆者 (彩恵りり) による / 画像引用元 ⑦ )

      

      この中でおそらく最も象徴的に知られているのは、2007年にダイセロスさん達の研究チームが成功した実験。チャネルロドプシン2を、生きたマウスの脳の特定の神経細胞に生成させた後、頭蓋骨に小さな穴を開けて、レーザーダイオード付きの光ファイバーを挿入し、マウスの脳に光を当てる実験を行ったのよね。

      

      実験では、マウスのヒゲの動きを制御する神経細胞に光を当てることで、神経細胞に電気信号を生成し、ヒゲの動きを操ることに成功したのよ。生きている上に起きているマウスに対して行った実験だけど、他の行動に悪影響が現れていないという利点も確認されたのよ！

      

      さらに研究を進めると、光を当てることで細胞を働かせるだけでなく、逆に細胞の働きを抑える方向の制御にも成功したのよね。細胞活動を活性化する方向と抑える方向の双方向制御ができたことにより、原理的にはもっと複雑な行動をさせたり、記憶を生成することができるということを意味するのよ！

      

      実際、2007年にダイセロスさん達は、覚醒を制御すると考えられていた神経細胞の集団にチャネルロドプシン2を生成し、光を当てるだけで寝ているマウスを起こすことに成功したのよ！　この実験は、覚醒しているから神経細胞が働いているのではなく、「その神経細胞が働いたから覚醒した」という因果関係を証明した点が重要なのよ！

      

      また、利根川進さん (免疫学に関する功績で1987年にノーベル生理学医学賞を受賞) 達の研究チームは、2012年に「記憶痕跡 (エングラム)」に関する重要な発見をしたんだけど、これにも光遺伝学の手法が役立っているのよ。この研究にはダイセロスさんも関わっているのよね。

      

      私たちが過去の記憶を思い出す時、単に出来事の内容だけでなく、楽しいとか怖いとかのような感覚も思い出すよね？　神経科学の専門家はこれを記憶痕跡と呼んでいたんだけど、それは果たして概念的なものなのか、それとも神経細胞ネットワークに物理的に存在するものなのか、長年の謎だったのよね。

      

      利根川さん達の研究チームは、光遺伝学の手法を施したマウスを使った実験を行ったのよ。まずは、ある環境を探索させ、その途中で足に軽い刺激を与えることで、ここはショックを受ける、いわば“怖い”環境だということを学習させたのよね。また、この時にどの神経細胞が働いたのかを特定したのよ。

      

      次に、この環境とは別の環境にマウスを起き、光を照射することで、先ほどの神経細胞の働きを再現したのよ。すると、マウスは環境が違うし、実際に刺激を受けていないにも関わらず、先ほどの環境と同じ“怖い”に相当する行動であるすくみの行動 (動かずにうずくまる行動) を示したのよね！

      

      このような行動や記憶を司る神経細胞ネットワークは、これまでは脳の大雑把な領域ごとにしか分からなかったのよね。光遺伝学は、神経細胞単位で機能を明らかにすることにより、脳の異なる領域にまたがって張り巡らされており、分割不能だった神経細胞ネットワークが、それぞれどのように機能しているのかを明らかにしたのよ！

      

      光遺伝学により、例えば痛覚、社会的行動、食物摂取やのどの渇きなどを司る神経細胞ネットワークが特定されたのよ。また、概日リズム (体内時計) や、免疫系が働くことによる発熱、ネズミの親が子供の毛繕いをするようなかなり複雑な働きについても、神経細胞の単位でメカニズムを正確に理解できるようになったのよね。

      

      さらに、この光遺伝学の手法は脳以外、あるいは神経細胞以外にも応用が効くのよね。例えばある研究では、心拍リズムが感情に与える影響を実証するのに使われたのよ。別のある研究では、腸の特定の細胞の機能から、一部の人が甘味料よりも砂糖を好む理由を明らかにしたのよ。

      

      光遺伝学は不治の病を解明・治療する強力なツール
      今回受賞した光遺伝学に関する研究は、クリックさんが構想した通り、あるいはダイセロスさんが願ったように、脳の複雑すぎる機能に対し、ピンポイントでその機能を明らかにし、調整できる可能性を秘めているのよね。これは、脳の機能に関連した、まだ未解明の謎や問題を解決するのに役立つ可能性があるのよ。

      

      例えば鬱病、不安症、統合失調症、パーキンソン病、アルツハイマー型認知症といった精神疾患・神経疾患に関する病気は、現在でもメカニズムがブラックボックス的で、はっきりとしたことが分かっていないのよね。光遺伝学的手法は、その正確なメカニズムを明らかにするだけでなく、治療法にも生かされる可能性すら秘めているのよ！

      

      そして光遺伝学的手法は、神経細胞以外にも応用が利くという器用さがウリ。既にこちらの分野では、かなり応用が進んでいる事例があるのよ。それは「網膜色素変性症」という、現段階では治療法が確立していない難病に対するアプローチなのよね。

      

      私たちの目が見えているのは、眼球の後ろ側の網膜にある2種類の視細胞 (桿体細胞と錐体細胞) が光を受け取り、これを電気信号に変えている。網膜色素変性症では、遺伝子の変異によって視細胞が破壊され、機能を失ってしまい、最悪の場合には失明に至ることもある難病なのよ。

      

      現在研究が進んでいるこの分野では、視細胞以外の細胞 (網膜神経節細胞や双極細胞など) に光駆動型イオンチャネルが生まれるようにすることによって、視細胞以外が光を感じるようにする方法が検討されているのよ。これは、網膜色素変性症では視細胞以外の機能は生きていることが多いことに着目したものなのよね。

      

      世界のいくつかの研究は、網膜色素変性症の患者に臨床試験を行う段階まで進んでいるのよ！　景色に対応した光を発する特殊なゴーグルをつけることで、色のコントラストが強い条件ならば、完全に視力を失った患者でも、テーブルの上に置かれたものを認識し、掴むことができるようになったのよ！

      

      他にも、光遺伝学的手法で光刺激にも反応できるようにした上で、従来の電気刺激や化学刺激も組み合わせるハイブリット型の研究も進んでいるのよね。これは人工内耳による聴力回復を強化したり、脳にまつわる疾患の治療法に繋がるかもしれないのよ。

      

      ヘーゲマンさんが発見した藻類の機能が、ナーゲルさんやダイセロスさん、そして多くの世界中の研究者を経て、脳の深淵さの謎や、治療不可能な難病を治療可能にするかもしれない。光遺伝学は従来とは全く異なる形で生物の謎に迫っており、自然科学の繋がりや応用可能性がどれだけ広いのかを示しているのかもしれないわね。

