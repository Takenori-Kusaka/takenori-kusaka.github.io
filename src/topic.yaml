          IPAは、今後不審なIPアドレスやログの痕跡等が公表される可能性があるとして、当面の情報収集の強化も求めている。(出典: 13)

          推奨策(2) 外部公開の入口を塞ぐ
          脆弱性への対応

          修正プログラムやアップデートを適用する(国家サイバー統括室、IPA、JPCERT/CC、個人情報保護委員会の別紙の手法の例示)(出典: 4, 7, 9, 13)
          修正プログラムの適用は、インターネットに公開されていない内部のサーバー等も対象に含める。サポートが終了した製品やバージョンは使わず、定期的に脆弱性診断を実施する(国家サイバー統括室)(出典: 9)
          管理対象のIT資産を洗い出し、脆弱性情報を収集、分析して、脆弱性へ速やかに対処する(個人情報保護委員会のWARNING、事例1、2の対策例)(出典: 5)
          ケースCのMetabaseは修正版を適用する(JPCERT/CCの8月の注意喚起)(出典: 1)
          外部への公開範囲を絞る対策

          利用していないシステムや機能を停止、削除し、不要なポート、プロトコル、サービス等を無効化する(国家サイバー統括室)(出典: 9)
          業務上必要のないサービスや機能(管理機能など)がインターネットに公開されている場合は公開を停止する。サービスの利用地域が限定される場合は、アクセス元の地域を制限する(JPCERT/CC、汎用的な対策)(出典: 7)
          アクセスを最小化する。例えば事前に許可した特定のIPアドレスからのみに限定する方法(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          API経由の不正アクセスについては、個人情報保護委員会が事例9の原因として次を挙げる。(出典: 5)

          管理対象から漏れているAPIが存在した
          URLや会員ID等のパラメータを書き換えることで、他ユーザーのデータにアクセス可能な状態だった
          レスポンスに不要な情報が含まれていたことや、会員ID等が連番となっていたことから、攻撃者によるAPIの仕様等の推測が容易だった
          大量アクセスを制御するためのアクセス回数制限(レートリミット)がなかった

          個人情報保護委員会が追加したAPI悪用事例（出典: 5）

          事例9の対策例、JPCERT/CCが「API経由のアクセスへの対策」として挙げる項目、IPAの記載は次のとおり。JPCERT/CCは、詳細についてOWASPのガイドライン等を参考にするとしている。

          管理対象のAPIを把握する。個人情報保護委員会は定期的なAPIの棚卸しを、IPAは点検後の対策として「API連携等アプリケーション構成要素単位での管理状況の見直し」を挙げる。(出典: 5, 13)
          認可とアクセス制御を行う。個人情報保護委員会は、認証(本人確認)に加え、認可(そのユーザーが当該データにアクセスする権限を有するかの確認)を都度行う仕組みの実装を挙げる。JPCERT/CCは、非公開APIを含む各エンドポイントでアクセス制御を実施し、許可された利用者やHTTPメソッドからのアクセスのみを受け付けるとしている。(出典: 5, 7)
          レート制限を設ける。個人情報保護委員会は、短時間での大量アクセスを検知、遮断するための「アクセス回数制限(レートリミット)」の実装を挙げる。JPCERT/CCは、単位時間あたりのリクエスト件数の制限に加え、ログイン、パスワードリセット、SMS送信、検索処理など負荷や悪用のリスクが高い機能には個別の制限を設定するとしている。(出典: 5, 7)
          レスポンスとIDの設計を見直す。個人情報保護委員会は、不要な情報をレスポンスに含めない設計と、会員IDや管理番号へのランダムな値(UUID等)の採用を挙げる。(出典: 5)
          APIトークンの有効期限を設定する。JPCERT/CCは、適切な有効期限を設定して長期間有効なトークンの使用を避け、不要または漏えいが疑われるトークンは速やかに無効化できるようにするとしている。(出典: 7)
          推奨策(3) アカウントの認証と権限を見直す
          認証の強化

          推測されやすいパスワードの使用を禁止し、多要素認証を導入する(国家サイバー統括室)(出典: 9)
          組織外ネットワークからのアクセス、管理者権限でのアクセス、重要な個人データへのアクセスで、フィッシングに耐性のあるものを含む多要素認証を導入する(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          パスワードの強度を確保する(警察庁、企業や団体向け)(出典: 8)
          権限の最小化とアカウントの棚卸し。国家サイバー統括室は「必要以上の権限が付与されている場合、不正アクセス時に大量の情報が一度に取得されるおそれがあります」としている。(出典: 9)

          管理者アカウントの利用者とアクセス権を必要最小限にし、閲覧権限と更新権限を分離する。退職者、異動者や利用されていないもの等の不要なアカウントは速やかに無効化し、アカウントや権限設定を定期的に確認する(国家サイバー統括室)(出典: 9)
          外部公開アプリケーションのアカウントへの権限付与を見直す。利用している外部サービスは、アカウント付与の範囲とアカウント棚卸の運用を見直す(IPA、点検後の対策)(出典: 13)
          ユーザーIDに付与するアクセス権限を最小化し、アクセス権限を棚卸しする(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          API利用者やAPIトークンに必要最小限の権限のみを付与する(JPCERT/CC、API経由のアクセスへの対策)(出典: 7)
          推奨策(4) 保有データを減らして保護する
          国家サイバー統括室は保有データについて、「万が一情報漏えいが発生した場合でも、保有する情報が少なければ被害の拡大を抑えることが可能」としている。(出典: 9)

          保管している個人データの必要性を法令等の根拠とともに確認する。個人情報保護法第22条は利用する必要がなくなった個人データを遅滞なく消去するよう努めることとしており、消去が徹底されず漏えい等事案がより深刻化する事例にも接しているという(個人情報保護委員会)(出典: 4)
          保有する情報資産を把握し、利用目的を終えた情報を速やかに削除し、法令上の保存期間を経過した情報を適切に廃棄する(国家サイバー統括室)(出典: 9)
          保有情報を再点検する。点検後の対策として、データ保有の是非とデータ保管場所を再検討する(IPA)(出典: 13)
          保存データと通信経路を暗号化し、パスワードや認証情報を平文で保存せず、バックアップデータを適切に保護する(国家サイバー統括室)(出典: 9)
          通信の経路又は内容を暗号化する。SSL/TLS、S/MIME等(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          推奨策(5) 侵入後の検知体制を点検する
          国家サイバー統括室は「侵入を完全に防ぐことは困難です。不審な挙動の早期発見と迅速な対応が被害発生及び拡大の防止につながります」としている。(出典: 9)

          ログの取得と保管、不正アクセスの検知

          個人情報や業務情報へのアクセス記録を取得し、ログを一定期間保管する(国家サイバー統括室)(出典: 9)
          外部公開アプリケーション、外部サービス、データアクセスそれぞれのログ取得内容と保持期間を見直す(IPA、点検後の対策)(出典: 13)
          認証ログ、アクセスログ、操作ログ、通信ログ等を一定の期間保管し、漏えい、滅失、毀損、改ざん、不正消去等から保護する(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          不審な通信や大量のアクセスを監視し、侵入検知と防御のシステムを活用し、パターンファイル等を定期的に更新し、外部からの異常な認証試行を把握する(国家サイバー統括室)(出典: 9)
          IDSやIPS、EDR等を導入する(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          不正アクセス検知体制を点検する(JPCERT/CC、汎用的な対策)(出典: 7)
          検知後の初動と被害拡大の防止

          インシデントが起きた場合の対応態勢を整備し、事業継続計画等にサイバーセキュリティを組み入れる(国家サイバー統括室)(出典: 9)
          検知時の初動対応と、Webサーバー等が侵害された後の横展開対策を見直す(JPCERT/CC、汎用的な対策)(出典: 7)
          侵害を受けた、またはそのおそれがある情報システムを停止、隔離し、アカウントを無効化するなどして被害拡大を防ぐ(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          インシデントが起きた場合の対応態勢も含めて、サイバーセキュリティ対策を点検する(金融庁、金融機関等向け)(出典: 14)
          点検で異常なログやアカウントが見つかった場合、速やかにセキュリティインシデントと判定してインシデント対応を進め、情報漏えいの可能性を考慮して専門のセキュリティベンダーに詳細調査を依頼する(IPA、強く推奨)(出典: 13)
          漏えいした情報の悪用防止

          脆弱性等によりID、パスワードが漏えいした可能性がある場合は、初期化するか利用者に変更を案内する(個人情報保護委員会のWARNING、事例3の対策例)(出典: 5)
          漏えい発生時を想定し、平時から顧客に二次被害防止等を呼びかける。例として多要素認証(JPCERT/CC、汎用的な対策)(出典: 7)
          本人確認を行う事業者は、犯罪収益移転防止法等に基づく本人確認を徹底する(警察庁)(出典: 8)
          本人確認書類の画像や顧客の容貌の画像に不自然な点がないかを改めて確認する(金融庁)(出典: 14)
          情報の提供と共有

          不審なアクセスや侵害が疑われる事象、攻撃手法、侵害原因などに関する具体的な情報があれば提供する(JPCERT/CC)(出典: 7)
          被害にあった組織は、技術的な情報を国家サイバー統括室、所管省庁、専門機関等に速やかに共有する(国家サイバー統括室)(出典: 9)
          被害発生時に担当課室へ速やかに一報し、時系列、被害状況、攻撃種別などを可能な範囲で提供する(経済産業省、所管業界の事業者向け)(出典: 12)
          推奨策(6) 対策を委託先と経営層まで広げる
          委託先を含む管理

          委託先のセキュリティ対策状況を把握し、委託契約でセキュリティ要件を明確化し、委託先への提供情報を必要最小限にする(国家サイバー統括室)(出典: 9)
          自社のみならずサプライチェーン全体でセキュリティを管理するという認識を持つ(経済産業省)(出典: 12)
          サードパーティリスク管理も含めて、サイバーセキュリティ対策を点検する(金融庁、金融機関等向け)(出典: 14)
          委託先がグループの親会社であっても通常の外部委託先と同じ基準で必要かつ適切な監督を行う(事例7)。クラウドサービスはセキュリティ対策を利用規約や安全性評価に関する資料等により確認して選定する(事例8)(個人情報保護委員会のWARNING、対策例)(出典: 5)
          経営層の関与

          経営層がリーダーシップを発揮して対策を進める(IPA、金融庁、総務省)(出典: 10, 13, 14)
          組織のトップが主導し、「ゼロトラスト」へ移行する(経済産業省)(出典: 12)
          経営層を交えて現状の組織体制の問題点や漏えい等が発生した場合に生じ得る損害等を評価し、組織的に対応する(個人情報保護委員会のWARNING)(出典: 5)
          利用者に求められた基本的な行動
          デジタル大臣は10月6日の記者会見で、流出した情報が氏名や住所、電話番号、メールアドレスだけでなく、ID、パスワード、クレジットカード情報、運転免許証等に及ぶ場合があり、なりすましや不正送金、詐欺等の二次被害につながるおそれがあると説明したうえで、国民に次の3つの対策を求めた。(出典: 3)

          パスワードの使い回しをやめ、サービスごとに異なるパスワードを設定する
          自ら設定が可能なサービスで、多要素認証(スマートフォン認証やワンタイムパスワード等)を積極的に利用する
          不審なメールやSMSに注意し、記載されたリンクを安易に開くことなく、公式ウェブサイトや公式アプリからアクセスする
          警察庁のサイバー警察局便りも個人向けに、情報流出元の企業をかたる偽メールの可能性があるとしてメール内のリンクを安易にクリックしないこと、安全なパスワードを設定して使いまわさないこと、警察庁推奨アプリのインストールを挙げる。(出典: 8)

          AIの関与を断定できる痕跡は未確認
          専門家の共同資料は、執筆者が推測を多分に交えると断った箇所で、「一連の事案でAIが使われたと断定できるログや痕跡は確認されていません」としている。同じ箇所で、サイトごとに機能や不備を調べる調査を広い範囲で繰り返すうえで人間が手作業で行うのは現実的ではなく、「AIの活用を否定する方が難しい状況であると考えています」とも記している。(出典: 15)

          観測レポートは、観測した攻撃について、人手とは考えにくいアクセス量でありながらツール特有の機械的な規則性がなく、応答を見ながら手を変えていたことから、AIエージェントまたはそれに近い仕組みによる攻撃である可能性があるとしている。そのうえで、「これは観測された振る舞いからの推測であり、AIの利用を直接示す痕跡を確認したものではありません」と記している。(出典: 16)

          共通ソフトウェアの未知の脆弱性(ゼロデイ)がAIによって発見され、悪用されているのではないかという懸念については、「現時点ではそのような状況は確認されていません」とする。(出典: 15)

          参考情報
