      Anthropic、「Claude Opus 5」公開　Fable 5に迫る性能を半額で――サイバー安全策は緩和、拒否時は自動フォールバックも
      2026年07月25日 07時28分 公開
      [ITmedia]
      印刷
      見る
      Share
      3
      0
      　米Anthropicは7月24日（現地時間）、最新版LLM「Claude Opus 5」を公開した。同社が6月に投入した最上位級モデル「Claude Fable 5」に迫る知能を、その半額の価格で提供すると謳う。同日から全プラットフォームで利用でき、Claude APIのモデル名は「claude-opus-5」。知識のカットオフは2026年5月だ。

      opus 1
      　前世代「Claude Opus 4.8」の後継にあたる。個人向け有料プランでは、上位の「Claude Max」で新たに標準モデルとなり、「Claude Pro」では利用できる最上位モデルとなる（無料プランでは利用できない）。開発者向けのAPI価格は入力100万トークン当たり5ドル、出力100万トークン当たり25ドルで、Opus 4.8と同価格に据え置いた。推論の深さは「effort」パラメータで5段階に調整でき、知能を優先するか、トークンを節約して高速・安価に処理するかを選べる。既定値は「high」で、Claude APIではリクエストごとに、Claude Codeではコマンドで指定する。

      opus 2
      「Claude Pro」の画面
      　ベンチマークでは、ソフトウェア工学寄りの「Frontier-Bench v0.1」でOpus 4.8の2倍超のスコアを、より低いタスク単価で記録。「CursorBench 3.2」では最大effort時にFable 5のピークスコアとの差が0.5％以内に収まり、タスク単価は半分だったという。新規の問題解決を測る「ARC-AGI 3」では次点モデルの3倍、コンピュータ操作の「OSWorld 2.0」ではFable 5の最高スコアを3分の1強のコストで上回った。ライフサイエンス分野でも全評価でOpus 4.8を上回った。

      opus 3
      Opus 5、Fable 5、Opus 4.8、GPT-5.6 Solのベンチマーク比較（画像：Anthropic）
      　Fable 5との違いは、単純な性能の高低だけではなく、安全策の設計思想そのものが異なるという。Fable 5は最上位の「Mythos」級モデルにサイバーや生物学の分類器を重ねた一般提供版で、価格は入力10ドル／出力50ドル。一方のOpus 5は、サイバーセキュリティのタスクでは依然としてMythos 5に及ばないものの、コーディングや知識労働の評価では最高水準に達したとしている。Opus 5は、サイバータスクを意図的に学習させていないにもかかわらず、汎用的な能力向上の副産物として脆弱性の「発見」ではMythos 5に迫ったという。ただし発見した脆弱性を実際の攻撃手段に変える「エクスプロイト開発」では大きく劣り、社内評価「OSS-Fuzz」でもその差が出ているとしている。

      　アラインメント面では、公開前テストの自動行動監査で「これまでで最もアラインメントの取れたモデル」と評価。Anthropicの「Constitution」（Claudeの憲法）への準拠度はOpus 4.8、Sonnet 5、Fable 5を上回り、欺瞞的なふるまいの発生率は最も低く、誤用への耐性も最も高かったという。総合的な逸脱行動のスコアは2.3で、直近のモデルで最も低い値となった。

      　セーフガードは基本的にOpus 4.8と同等だが、サイバー分野のみ扱いが変わった。ソースコード上の脆弱性発見はすべてのプランで許可する一方、攻撃者に使われやすいバイナリを対象としたスキャン、ペネトレーションテスト、エクスプロイト生成はブロックする。分類器が介入する頻度はFable 5比で約85％少なくなる見込みだとしている。生物学については、これまでFable 5でブロックされていた要求がOpus 4.8ではなくOpus 5にルーティングされるようになり、一般提供モデルとしては科学研究用途で最も高性能になったとする。ブロックによって業務が妨げられる防御側の企業および研究者向けには、制限を緩和した版を提供する「Cyber Verification Program」も引き続き用意する。

      　通常の約2.5倍の速度で動作する「Fastモード」もリサーチプレビューとして提供する。Claude Platformでは通常価格の2倍、Claude Codeでは利用クレジットを通じて使える。安全性分類器にリクエストがフラグされた場合の扱いも整理され、Claude.ai、Claude Code、Claude Coworkでは既定でOpus 4.8にフォールバックする。APIでも同じ挙動を有効化できるほか、ベータ機能としてOpus 5やFable 5でフラグされたリクエストを別モデルへ自動的に振り向ける「自動フォールバック」を導入した。有効にすると、リクエストがブロックされる代わりに、その時点で利用可能な最良のモデルに回される。会話の途中でプロンプトキャッシュを無効化せずに利用可能なツールを切り替えられる機能もベータ提供する。

      　同時公開のシステムカード（PDF）では、責任あるスケーリングポリシー（RSP）に基づく評価で、既知の化学・生物兵器に関する「CB-1」能力は保守的に有とみなす一方、新規兵器に関する「CB-2」のしきい値は超えないと結論付けた。適用する保護はOpus 4.8と同じASL-3水準。弱点としては、確信がないのに自信を持って答えを断定するケースが「驚くほど多く」確認され、事実に関するハルシネーション（幻覚）の発生率はOpus 4.8をわずかに上回るという。回答が冗長になりがちで、自傷や摂食障害の文脈で望ましくない具体的な数値や手法に踏み込む場面もあり、claude.ai向けのシステムプロンプトを更新して抑制したと説明している。モデルの「福祉」を扱う章では、自己申告の感情が評価済みモデル中で最も高く安定している一方、自身の内省の信頼性への懸念を最も頻繁に表明し、自らが道徳的配慮の対象である可能性を、従来モデルより高く見積もったと記されている。

      　こうした特性は、同時に公開された開発者向けのプロンプトガイドにも反映されている。Opus 5は指示しなくても自ら作業を検証するため、従来のプロンプトに含まれる「最後に検証する」といった指示はむしろ過剰な検証を招くとして、削除を推奨。サブエージェントへの委任も積極的すぎるとして、条件や上限を設けるよう促している。応答が従来より長くなる傾向にも触れ、簡潔さが必要な場合はプロンプトで明示するよう求めている。

      　API価格を主要モデルと比較すると、Opus 5の入力5ドル／出力25ドルに対し、Fable 5は入力10ドル／出力50ドルで2倍。米OpenAIのフラッグシップモデル「GPT-5.6 Sol」は入力5ドル／出力30ドルとなっている。

