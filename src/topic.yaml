        Project Glasswingと日本国内の状況についてまとめてみた
        AI 政府 重要インフラ
        Anthropicは2026年4月7日、Claude Mythos Previewを用いてソフトウェアの脆弱性を発見する取り組み「Project Glasswing」の発足を発表しました。脆弱性の発見と悪用に高い能力を持つとされるフロンティアAIを防御目的に用いる試みで、日本では自民党や金融庁、経済産業省などが相次いで対応を進め、政府の対策パッケージや金融機関向けの要請につながりました。国内でも複数の企業がGlasswingへの参画を公表しています。ここでは関連する情報をまとめます。

        Project Glasswing
        Anthropicは2026年4月7日、Project Glasswingの発足を発表した。発足時に名前が明らかにされた参加組織はAnthropic自身を含む12者(AWS、Apple、Broadcom、Cisco、CrowdStrike、Google、JPMorganChase、Linux Foundation、Microsoft、NVIDIA、Palo Alto Networks)で、重要なソフトウェア基盤を担う40超の追加組織にもClaude Mythos Previewへのアクセスを付与したと説明した(出典:1)。

        また、Anthropicは最大1億ドルの利用クレジットを提供するとし、Alpha-OmegaおよびOpen Source Security Foundation(OpenSSF)へ250万ドル、Apache Software Foundationへ150万ドルを寄付すると表明(出典:1)。Apache Software Foundationは同日、寄付を受領したと発表した(出典:11)。なお、3月17日にはLinux Foundationが、Anthropic、AWS、Google、Google DeepMind、GitHub、Microsoft、OpenAIなどを拠出元とする計1,250万ドルのAlpha-OmegaとOpenSSFへの投資を発表している(出典:9)。

        Anthropicは5月22日にProjectの初回アップデートを公開し、自社と約50のパートナーによる成果を報告した(出典:3)。5月19日には、Mythos利用企業との契約条件を緩和し、各社によるGlasswingへの参画公表やMythosで得られた知見の外部共有を認めていた(出典:49)。6月2日には対象をさらに拡大し、新たに約150組織(15カ国超)へアクセスを広げると発表した。各組織はアクセス前にAnthropicのセキュリティ要件を満たす必要がある。電力、水道、医療、通信、ハードウェアなどの分野の組織が新たに加わったとし、大半のパートナーについて、大規模な攻撃が起きれば1億人以上に影響しうると推定している(出典:4)。

        6月9日にはClaude Fable 5とClaude Mythos 5を発表した。Mythos 5はGlasswingパートナー向けにMythos Previewの後継として提供され、既存のアクセス保有者は移行できるとした。Fable 5はサイバー能力に安全策を加えた一般提供モデルとした(出典:5、57)。9月1日にはClaude Fable 5.1とMythos 5.1を発表している(出典:8)。


        Anthropicが公開したProject Glasswingのページ
        関連公表と集計された脆弱性件数
        公表、集計されている件数は次の通り。集計主体や母数によって次のように異なる。

        集計主体	数値	対象、母数	出典
        Anthropic(2026年4月7日)	数千件(高、重大深刻度として検出した候補。うち198件の人手レビューで89%が深刻度評価と一致)	Mythos Previewによる自社スキャン	出典:2
        Anthropicと約50パートナー(2026年5月22日)	1万件超(高、重大深刻度)	各社合計。パートナー別の内訳は非公表	出典:3
        Anthropic(2026年5月22日)	23,019件(うち高、重大6,202件)	自社が1,000超のOSSプロジェクトをスキャンした推定値	出典:3
        独立系セキュリティ調査会社6社のいずれか(少数はAnthropic自身)	1,752件中90.6%が真陽性、62.4%が高、重大	上記のうち高、重大と評価された6,202件の一部(1,752件)を精査(Anthropicの発表内で報告)	出典:3
        VulnCheck(2026年4月15日時点)	公開CVE 40件(うちGlasswingに明示的に帰属するのは1件)	「Anthropic」を含む公開CVEレコード75件のうち、AnthropicまたはAnthropic関係の研究者にクレジットされた40件	出典:20
        Anthropicの脆弱性開示ダッシュボード(2026年5月22日時点)	1,596件開示、281プロジェクト、97件修正、88件がCVE、GHSA付与	Anthropic自身の台帳上の件数(Bugflationが同時点の値として記録)	出典:23
        Mozilla(2026年5月7日)	Firefox 150で271件(sec-high 180、moderate 80、low 11)	自社リポジトリ。4月の修正計423件のうちの内訳	出典:13
        Palo Alto Networks(2026年5月13日)	26件のCVE(75件のissue)	月次アドバイザリ(通常は月5件未満)。大半がMythosを含む複数のフロンティアAIモデルによるスキャンの結果	出典:15
        curl(2026年5月11日)	確認済み5件のうち精査後1件(深刻度low)	178,000行の自社コードベースのスキャン	出典:14
        CVE-2026-4747(FreeBSDのRPCSEC_GSSにおけるスタックバッファオーバーフローの脆弱性)について、FreeBSD Projectのセキュリティ勧告(2026年3月26日公表、Glasswing発表の12日前)はクレジット欄をClaudeを用いたAnthropicの研究者(Nicholas Carlini using Claude)としている(出典:10)。Anthropicは4月7日の技術詳細ブログで、Mythos Previewが「完全に自律的に(fully autonomously)」同脆弱性を発見し悪用したと説明した*1 (出典:2)。独立系の研究者が本人に確認したところによれば、担当したAnthropicの研究者は、人間があらかじめ構築したFreeBSD向けの脆弱性探索用スキャフォールドの枠内での発見であり、その枠内での発見とエクスプロイト生成が自律的だったと説明したという(出典:18)。

        Palo Alto Networksは5月13日の月次アドバイザリで、AIによるスキャンの知見を反映した26件のCVE(75件のissue)を公表し、実際の悪用は確認されていないと説明した。同社はMythosのほかClaude Opus 4.7やGPT-5.5-Cyberなど複数のフロンティアAIモデルを検証しており、発見の大半がそれらのスキャンによるものとしている(出典:15)。独立系の研究者が同社の公表CSVを照合したところ、実際には23件のCVEと1件の情報通知しか含まれておらず、5月5日に開示され翌6日にCISAのKEV(既知の悪用された脆弱性カタログ)へ登録されたCVE-2026-0300(PAN-OS)は、このAIクレジットの26件には含まれていないという*2 (出典:22)。

        自民党の提唱と政府の対策パッケージ

        Project Glasswing（Anthropic）と日本側の関係
        自民党の平将明国家サイバーセキュリティ戦略本部長と小林鷹之政調会長は、2026年4月16日に国会内でAnthropic日本法人幹部と面会した。同月20日には同戦略本部と金融調査会が緊急合同会議を開き、AnthropicとOpenAIからヒアリングを行った(出典:28、36)。平将明本部長は米国の事例を挙げ日本版のサイバー防衛企業連合の創設を提唱している(出典:36)。

        平氏は4月21日、X投稿で「日本版Project Glasswing」の二段構えの提案を明らかにした。金融庁、AISI(AI Safety Institute)、国家サイバー統括室(NCO)を中心に金融システムを守る枠組みと、NCOを司令塔として基幹インフラを守る拡大版の2つを提案している(出典:29)。平氏は4月23日、翌日の衆議院内閣委員会でこの問題を取り上げ、内閣官房、NCO、金融庁、AISIと危機感や対応策を共有する予定を予告した(出典:30)。

        経済産業省の赤沢亮正経産相は5月1日、電力やガスなど重要インフラ企業の幹部と意見交換し、組織トップによる対策主導とゼロトラストへの早急な移行を求めた。大手電力事業者には、IT基盤や資産状況について1カ月後をめどとした経産省への報告を求めている(出典:38)。

        高市早苗首相は5月12日の閣僚懇談会で、AIを悪用したサイバー攻撃への対応を松本尚デジタル相(サイバー安全保障担当兼務)に指示した(出典:40、42)。同日朝には、日本政府がAnthropicにMythosのアクセス権提供を求めて交渉していることが報じられた(出典:39)。松本氏は同日の会見で、政府は現時点でMythosを利用できる状態ではないとし、「Mythosが無いという前提で対策を進めなくてはならない」と述べた(出典:42)。自民党の国家サイバーセキュリティ戦略本部も同日会合を開き、「ミュトス相当の品質のオープンモデル登場まで数カ月程度との予測」への危機感を示す提言をまとめている(出典:41)。

        同戦略本部は5月14日、首相官邸で高市首相に提言を渡し、重要インフラ事業者への迅速な対応やAISIによる技術支援(高性能AIモデルの評価、安全性確保の指針作成、米英等AISIとの連携)を求めた(出典:46、47)。来日したAnthropicの渉外責任者は5月15日、自民党が提唱する枠組みへの参画を検討していると述べ、党本部で平氏と面会した。「日本のセキュリティー確保のために技術を提供できることをうれしく思っている」とし、「グラスウイングを通じてミュトスへのアクセスを拡大できるように対話している」とも述べ、日本を含む米国外へのGlasswing対象拡大の検討を明らかにしている(出典:44、45)。

        政府がまとめる対応案の全容は5月17日に明らかにされており、①ソフトウェア提供企業へのAI活用脆弱性点検の要請、②AISIと連携した指針策定、③NCOへの情報集約が柱になるとした(出典:47)。さらに内閣官房国家安全保障局や国家サイバー統括室を含む14の政府機関は5月18日、連名で対策パッケージ「Project YATA-Shield」を公表した*3。4月7日のClaude Mythos Preview公表を名指しで背景に置き、重要インフラ事業者や政府機関等への注意喚起、外国政府機関やAI開発者との連携強化、AISIによる技術支援等を柱とする(出典:33)。対策は電力、水道、ガス、空港、鉄道に加え医療や行政サービスを含む重要インフラ15分野に重点を置く(出典:46)。同日、松本尚サイバー安全保障担当大臣らが出席する関係省庁会議も開かれている(出典:33、48)。

        松本デジタル相は6月15日、専門家会議で複数の高性能AIを活用して政府の重要システムの脆弱性を点検する方針を発表した。国家サイバー統括室を中心に官民の専門家を集め、各府省庁が選定した対象システムを順位付けして点検するとしている(出典:58)。

        金融庁と日本銀行による金融機関への要請
        金融庁は4月24日、「AI脅威に対する金融分野のサイバーセキュリティ対策強化に関する官民連携会議」を開催。三菱UFJ、三井住友、みずほの3メガバンクと日本取引所グループの首脳、日本銀行らが出席し(出典:37、66)、片山さつき金融相(財務相兼務)は実務者レベルの作業部会の設置を決め、同作業部会を米Project Glasswingの「日本版」と位置づけている(出典:37)。

        片山金融相は5月12日の閣議後会見で、来日中のベッセント米財務長官と会談したこと、5月14日に作業部会を立ち上げる予定であることを明らかにした(出典:31)。作業部会は5月14日に第1回会合を開いた(出典:32、43)。金融庁が公表する参加組織(2026年8月28日更新時点)は金融機関等6(セブン銀行、日本取引所グループ、みずほ銀行、三井住友銀行、三菱UFJ銀行、楽天銀行)、ITベンダー等13(AWS Japan、Anthropic Japan、OpenAI Japan、NTTデータ、Google、Cisco、日本IBM、NEC、日本マイクロソフト、野村総合研究所、日立製作所、BIPROGY、富士通)、金融ISACや全国銀行協会などの業界団体、政府機関等5(AISI、NCO、財務省、日本銀行、金融庁)。作業部会の詳細は非公表としている(出典:32)。3メガバンクでは専門チームの立ち上げ方針、タスクフォースの設置、社内ワーキンググループでの横断的検証といった動きが出ている。三井住友フィナンシャルグループの社長は「費用も人員も相当かかるが、優先的に経営資源を配分してでもしっかり対応する」と述べている(出典:43)。

        作業部会が示した短期的対応の素案として、金融システムの「能動的な停止」を選択肢とする方針が5月20日に明らかになった(出典:50)。金融庁と日本銀行は5月22日、「フロンティアAIによる脅威変化を踏まえた金融機関等の短期的な対応」を要請した。別添9項目の8番目「優先サービス/ITシステムの停止に備える」では、各種対策を尽くしても防御しきれない可能性を前提に、優先的に対応すべきサービス、ITシステムを能動的に停止せざるを得ない場合について経営トップがあらかじめ選択肢として検討しておくよう求めている。UK AISIの評価を引用し、「現時点ではフロンティアAIは、十分に防御されたITシステムに対しては、攻撃を達成できるとは言えない」との留保も記載している(出典:34)。

        同日、片山金融相は日本政府と一部金融機関にMythosへのアクセス権が付与されると明らかにした(出典:51)。3メガバンクは早ければ5月中にもMythosを利用できる見通しで、修正対応の急増やATM停止といった事態への懸念も出ていた(出典:52)。5月28日には、メガバンク各行がMythosと同水準とされるOpenAIの新型AIモデルのアクセス権も取得する見通しとなった(出典:53)。

        片山金融相は6月2日のぶら下がり会見で、日本政府と一部金融機関へのアクセス権付与をあらためて表明した。銀行名の明言は避けつつ「グラスウィングの参加者は、3メガだったんですけど主には」とも述べている(出典:35)。6月4日時点で3メガバンクなどが対象になったとみられ、OpenAIの「GPT-5.5-サイバー」のアクセス権も確保済みとされる(出典:55)。

        全国銀行協会の会長は6月18日の記者会見で、AIの悪用によるサイバー攻撃への備えとして「ATMやインターネットバンキングなど一部のサービスを能動的に停止する場合が想定される」と述べた(出典:62)。

        Glasswingへの参画を公表した組織
        Glasswingへの参画やアクセス権付与の公表が確認できる組織は次の通り(2026年9月8日時点)。

        組織名	関係	公表日	影響
        内閣官房国家サイバー統括室ほか関係省庁(日本政府)	Mythos Previewへのアクセス権付与	2026年6月2日	片山金融相、松本デジタル相が確認(出典:35、54、56)
        トレンドマイクロ株式会社(TrendAI)	参画	2026年6月4日	Mythos Previewをソフトウェアコードのレビュー、分析に活用(米国発表は6月3日)(出典:24)
        株式会社日立製作所	参画	2026年6月5日	Mythos Previewへのアクセス権取得。5月19日発表のAnthropicとの戦略的パートナーシップ(Lumada 3.0強化)とは別契約(出典:25)
        日本電気株式会社(NEC)	参画	2026年9月2日	Mythos Previewを自社の脆弱性管理プロセスに活用。4月に締結したAnthropicとのグローバルパートナーシップのもとで協業を深めるとしている(出典:27)
        日立製作所は2026年7月28日、実証結果としてグループ内100超のユースケースにMythos Previewを適用したこと、数百万行規模のソースコードに対する脅威モデル作成が従来の数週間から数時間に短縮されたことを公表している(出典:26)。
        三菱UFJ銀行、三井住友銀行、みずほ銀行のアクセス権取得は報道による*4 (出典:53、65)。
        米政府の輸出規制による提供停止と再開
        米政府は6月12日、国家安全保障を理由にFable 5とMythos 5を輸出管理対象に指定すると通知した。Anthropicの外国籍社員を含む全ての外国人への提供を止めるよう命じられたとし、両モデルの全顧客向け提供を停止している。Anthropicは対象を両モデルに限り、他のモデルへのアクセスは影響を受けないとしたうえで、同様の基準が業界全体に適用されれば全ての先端モデル提供者の新モデル公開が事実上停止すると反発したという(出典:6)。日本を含む海外への提供先には6月2日に約150組織を追加したばかりで、日本企業や政府によるMythos Previewの利用が停止するかは、6月13日時点の報道では明らかになっていないとされた(出典:4、57)。

        松本デジタル相は6月16日の閣議後会見で、提供停止について「米政府やアンソロピックと密に意見交換をしている」と述べた。「いま手元にある高性能AIを使いつつ、先般決めた対策パッケージにのっとって、粛々と脆弱性チェックやパッチを当てる作業を進めていく」とし、政府データがあるシステムや金融決済システム、通信、電気分野のシステムを優先度が高いと説明している(出典:59)。同日、片山金融相は先端AIを活用したサイバー攻撃対策を巡り米Googleからシステム提供の打診を受けていることを明らかにした(出典:60)。

        Anthropicのセキュリティ担当幹部は6月15日にワシントンで米商務省など政府関係者と面会した(出典:61)。片山金融相は6月16日、「当事国の米国から説明はあってしかるべきだ」と発言している(出典:61)。6月12日には米当局者がAnthropic幹部に90分以内の提供停止判断を求めたともされる(出典:61)。

        米商務省は6月26日、Mythos 5の提供を米企業や政府機関等100超の組織に限定して再開することを許可する書簡をAnthropicに送付した。日本など海外企業の利用には追加承認が必要とされ、Fable 5の一般提供再開は認められなかった(出典:63)。Anthropicは6月30日に「Redeploying Fable 5」を公開し、輸出管理指定の経緯として、Amazon所属の研究者がFable 5の安全策を回避する手法を発見したとする報告が契機だったと説明している(出典:7)。

        同日、高市首相は片山金融相、松本デジタル相と面会し取り組みの報告を受けた。松本氏はNCO幹部の米国派遣を表明し、片山氏はMythosについて近く再び利用できるようになる見通しだと説明した*5。政府はOpenAIの「GPT-5.5-サイバー」のアクセス権を得ており、3メガバンクはGoogleの「コードメンダー」をサイバー防衛目的で利用できるようになっている(出典:64)。7月1日、AnthropicはClaude Fable 5とMythos 5の提供を再開した。Mythos 5は米国内の一部組織に限定して再開している(出典:7)。

        8月27日、メガバンク各行が米政府による提供停止措置を経てMythosを利用できるようになったことが判明した(出典:65)。三菱UFJフィナンシャル・グループのMythos対応について、アクセス権は一部の国内金融機関に付与され、対象は非公表だが三菱UFJ銀行は確実視されている(出典:66)。

        海外の関連機関の反応
        UK AI Security Institute(AISI)は4月13日、Claude Mythos Previewのサイバー能力評価を公表した。専門家レベルのCTF(Capture The Flag)で73%が成功し、32手順の企業ネットワーク攻撃シミュレーション「The Last Ones」は10回中3回完遂(平均22/32手順)としている。同評価は「十分に防御されたシステムを攻撃できるかは断定できない」との留保を明記している*6 (出典:17)。

        オランダの国家サイバーセキュリティセンター(NCSC-NL)は4月15日、Mythosは即時の対応を要するとする注意喚起を公表した。反応時間の短縮やパッチ適用の迅速化、基礎的なセキュリティの徹底を求める一方、「完全な影響を検証するための技術的詳細が公開されていない」と明記している(出典:19)。CERT-EUは4月21日、「AIは脆弱性発見の経済性を変えつつある。防御側は今すぐ適応すべき」と題するブログを公開し、Googleの「M-Trends 2026」を引用し、新規開示脆弱性の平均悪用開始時期が推定でマイナス7日(パッチ公開前に悪用が始まる)に達したと指摘した。自ら構築、検証中のAI活用ペネトレーションテストパイプラインについても説明している(出典:21)。

        OSSメンテナへの負荷
        Linux Foundationは4月7日、オープンソースのメンテナがMythos Previewに無償でアクセスできる枠組みを説明した(出典:12)。提供はAlpha-Omega経由で行われている(出典:14)。LinuxプロジェクトのメンテナがAIツールの生成したパッチの一部を「pretty good」と評価し始めたことにも言及している(出典:12)。

        OSSメンテナの間では、AI生成の脆弱性報告の増加による負荷増大やロックインへの懸念が示されている(出典:16)。

        curlの開発者は5月11日、アクセス権を持つ第三者がMythos Previewで自社コードベースをスキャンした結果の報告を精査し、その結果を公表した。「確認済み脆弱性5件」との報告を受けたが、curlセキュリティチームの精査で3件が誤検知(APIドキュメントに記載済みの制約を指摘したもの)、1件が単なるバグと判定され、確定した脆弱性は1件(深刻度low)にとどまったという。メモリ安全性の指摘はゼロ件だったが、それでも約20件のバグ自体は有用だったと評価している(出典:14)。

