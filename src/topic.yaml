      国内の主なホスティング事業者の対応状況
      利用者に代わってサーバー側の PHP を管理している事業者では、サーバー側の PHP を修正版へ更新する対応と、予防的に一部のサービスを止める対応がとられ、両方を行った事業者も多い。告知で PHP の脆弱性への対応を挙げている国内の主な事業者について、10月23日から24日にかけて確認した各社の告知の最新の記載は次のとおり。

      事業者	対応
      さくらインターネット	レンタルサーバーで、サポート終了版を含む提供中の PHP に必要な修正を適用。本件に伴う緊急メンテナンスはすべて終了(10月23日17時30分の追記)
      エックスサーバー	サーバー側の PHP 5.6〜8.5 を全サーバーで修正適用済み(10月22日14時)、5.1〜5.5 は過半数のサーバーで適用を完了(10月23日)。予防的に止めていた管理画面などは22日9時30分から、サービスサイトは20時10分から順次再開(一部はメンテナンス中の機能あり)
      カゴヤ・ジャパン	レンタルサーバーの PHP 7.4、8.1〜8.5 を修正版へ更新し、22日24時までに完了。マネージド専用サーバーなどは恒久的な対応の方針を調整中で、暫定策として Web サイトの公開停止やアクセス制限を案内
      IDCフロンティア(Zenlogic)	PHP 7.4、8.1〜8.5 のサーバーの Web サーバーを22日8時に再開。PHP 5.3 は最新のバージョンへ切り替え(5.3 には戻せない)、緊急メンテナンスの作業完了を告知(10月23日の更新)
      ロリポップ!	修正を適用し、22日13時ごろに利用者のサイトの表示を再開。8.2〜8.5 は修正版、7.4〜8.1 は開発元が提供した修正、5.3〜7.3 は自社で作成した修正を適用し、全バージョンで session.upload_progress を無効化。停止はサーバー単位で、PHP を使わないサイトも表示できなかった
      heteml	修正を適用し、22日11時24分に利用者のサイトの表示を再開。8.2〜8.5 は修正版、7.4〜8.1 は開発元が提供した修正、5.6〜7.3 は自社で作成した修正を適用
      ムームードメイン	予防的にサービスサイトやコントロールパネルなどを止め、ムームーサーバーと WP ホスティングの利用者のサイトも一時停止。修正を適用し、22日14時23分に利用者のサイトの表示を再開、15時36分にメンテナンスを完了。ムームーサーバーは heteml と同じ環境で提供
      カラーミーショップ	予防的に一時停止し、22日8時49分にすべて復旧
      CPI	修正のある PHP のバージョンは対応を完了。修正のない古いバージョンは緩和策を案内(実施は利用者)。止めていたサービスサイトなどは順次再開し、一部は再開時期を検討中(10月30日以降の見込み)。利用者のサーバーは稼働を継続。PHP の脆弱性の対応のため、23日17時30分ごろの開始を予定して phpMyAdmin と phpPgAdmin を一時停止(G、G10、X、Z、Pro、Pro10、V は対象外。再開は未定)
      ConoHa WING	提供中の全ての PHP のバージョンに修正を適用し、22日20時45分に完了(表示されるバージョン番号は変わらない場合がある)。予防的に止めていた Web メールやファイルマネージャーなどは再開
      お名前.com レンタルサーバー	提供中の PHP に修正を適用し、22日20時45分に完了。止めていたファイルマネージャー、phpMyAdmin、Web メールを再開
      mixhost	全サーバーの PHP 5.2〜8.5 に修正パッケージを適用し、22日10時18分ごろに完了。バージョン番号は変わらず、利用者の作業は不要
      ColorfulBox	全サーバーで更新を完了(10月22日)。PHP 7.4、8.0、8.1 などの旧版にも修正や保護措置を適用
      バリュードメイン	One レンタルサーバー、CORESERVER、VALUESERVER、XREA で、提供中の全ての PHP のバージョンに修正を適用(10月22日)
      さくらのクラウド	データベースアプライアンスの WEB UI の機能(phpMyAdmin など)を停止
      InfiniCLOUD	新規の容量アップグレードとアカウント登録を停止
      Shifter	10月21日15時〜22日10時に、ダッシュボードの一部機能で緊急メンテナンス(公開中のサイトは影響なし)
      WAF や IPS などの対応状況
      WAF や CDN、UTM、IPS の各社は、修正版への更新までの暫定策として、既知の攻撃経路を遮断するルールやシグネチャ、仮想パッチを提供または案内した。いずれも完全な対策は更新で、これらは補完策としている。10月23日から24日にかけて確認した、告知に対応を挙げている主な製品、ベンダは次のとおり。

      製品、ベンダ	対応
      Cloudflare	既知の攻撃経路を遮断する WAF ルールを、WAF を使う全プラン(無料を含む)に展開(有料プランは block モードの確認を推奨)
      Akamai	App & API Protector にルールを追加(Adaptive Security Engine 3000991)、既存のコマンドインジェクションのルールでも遮断
      Imperva	Cloud WAF は標準で保護、Elastic WAF はソフトウェア更新、WAF Gateway はソフトウェア更新と ADC コンテンツ更新で保護
      Fastly	Next-Gen WAF に CVE 向けのテンプレートルール(仮想パッチ)を用意(利用者が有効化する方式)
      AWS WAF	PHP 用のマネージドルールグループに、CVE-2026-109619 向けのルール(version 2.3、10月21日)と CVE-2026-109618 向けのルール(version 2.4、10月22日)を追加し、version 2.5(10月22日)で検知のシグネチャを改良。既定のバージョンは 2.4(10月23日の更新)で、既定のバージョンを使う場合は自動で保護され、バージョンを固定している場合は更新が必要。CVE-2026-109619 向けのルール(version 2.4 以降)は、セッション ID とアップロード進捗のフィールドを持つ POST リクエストを遮断するため、PHP の修正までの CVE-2026-115560 の緩和にもなるとしている
      Sucuri	Website Firewall に仮想パッチのルールを展開
      攻撃遮断くん(サイバーセキュリティクラウド)	WAF シグネチャを緊急リリース(全プラン)
      WafCharm(サイバーセキュリティクラウド)	AWS WAF と Azure 向けの対策ルールをリリース
      Microsoft(Azure WAF)	・Front Door WAF は、リクエスト側をカスタムルールで、レスポンス側を新しいマネージドルールで緩和。マネージドルール(99006001、DRS 2.0〜2.2)は通信を遮断せず、応答から悪意のある要素を除く。既定は無効で、有効にしたうえでアクションを Block on anomaly にする必要がある。10月28日に展開完了の予定
      ・Application Gateway WAF は、カスタムルールとヘッダーの書き換え(v2 SKU)で緩和
      ・Application Gateway for Containers WAF は、カスタムルールで緩和
      Vercel	Vercel 上の PHP 関数と、Vercel が外部の PHP バックエンドへリライト、プロキシするリクエストを対象に、既知の攻撃パターンを遮断する WAF ルールを無償、設定不要で適用
      Imunify360	Imunify360 の WAF を有効にしている環境向けに、ルールを自動更新で配布。公開の悪用ツールと既知の攻撃リクエスト(CVE-2026-109619 のセッションのアップロード進捗の経路)を遮断する。10月23日の ruleset 8.88 で、アップロード進捗のフィールドにシリアライズされた PHP のオブジェクトを含むリクエストを、Referer によらず遮断するルールを追加。通常のアップロードに似せた変種は通りうるとし、CVE-2026-109618 のメモリ不足の経路を遮断するルールはまだないとしている
      このほか、Wordfence(WordPress 用)は調査中としている。

      IDS や IPS では、主なベンダが次のシグネチャなどを公表している。

      製品、ベンダ	対応
      Cisco Talos(Snort)	Snort のシグネチャ 67359、67360、67375(Community Ruleset にも収録)
      Proofpoint(Emerging Threats)	Suricata 向けの ET Open に10ルールを追加(php2shell の名を持つ悪用のルール9件と、探索用のルール1件。10月22日、協定世界時)
      Trend Micro	・Deep Security などの IPS ルール 1012749、1012754
      ・TippingPoint のフィルター 48514(Security Optimized で有効)、48534
      ・Vision One NDR のルール 6021、6023
      Check Point	Security Gateway の IPS 保護(CPAI-2026-15172。最新の IPS の更新が必要)
      Fortinet	IPS シグネチャ 62657(CVE-2026-109618)、62658(CVE-2026-109619)(IPS DB 37.317)、OT Virtual Patching のフィード経由の仮想パッチ(37.316。OT 以外の脆弱性も対象とするフィードで、FortiGuard OT Security Service の契約が前提)、FortiWeb のシグネチャ(0.00438)を提供
      Palo Alto Networks	Advanced Threat Prevention Plus(Frontier Virtual Patching)の契約者向けに Threat ID 543004 を提供(10月20日、太平洋時間)
      VMware(vDefend)	vDefend Gateway Firewall の IDPS に仮想パッチ用のシグネチャを提供(TLS の復号が前提)
      更新できない場合の回避策
      アドバイザリは、完全な解決策は更新だけで、次の措置は特定の攻撃経路への露出を減らすにとどまり、環境を安全にするものではないとしている。同じ php.net ニュースに掲載された各バージョンのリリース告知も、完全な回避策はなく、更新が唯一安全な選択としている(出典: 3)。

      CVE-2026-109618 向けに挙げられている措置
      memory_limit=-1 を、FPM のプールの php_admin_value や Apache の設定など、アプリケーションが上書きできない形で設定する(可能であれば)。PHP のメモリ上限による制御可能な失敗はなくなるが、下層のメモリ確保の失敗は脆弱な経路に達しうる。プール、ディレクトリ、アプリケーションの設定で有限の上限が戻っていないことの確認も求めている(出典: 3)。GitHub のアドバイザリは全ワーカーの再起動も求めている(出典: 4)
      post_max_size の引き下げ(ファイルアップロードが不要なアプリケーションでは 8M、必要な場合は 32M)
      Web サーバーやプロキシ側でのリクエストサイズなどの上限の設定(使える Content-Length のないリクエストにも上限が及ぶようにする)
      コンテナや cgroup の制限を可用性の境界として使う(影響を受けたワーカーだけを停止させる方針が望ましい)が、メモリ確保の失敗を防ぐ保証はなく、完全な緩和策ではない(出典: 4)。RLIMIT_AS と RLIMIT_DATA は、使うと脆弱なメモリ確保の失敗を引き起こしうるため、代わりに使わない
      CVE-2026-109619 向けに挙げられている措置
      session.upload_progress.enabled=0 を、リクエストの解析前に適用される php.ini、FPM のプール、サーバーの設定で行い、ini_set() や FPM の .user.ini には頼らない。設定後は全ワーカーを再起動し、確認されたセッションの経路だけを塞ぎ、他の変種は塞がない。PHP プロジェクトは、この設定で CVE-2026-115560 も防げるとして、次の定例のバグ修正リリースまで続けるよう案内している(出典: 56)
      PHP 8.5 での fatal_error_backtraces=0 の設定と全ワーカーの再起動(確認されたバックトレースの経路だけを塞ぐ)
      初期化前に診断メッセージを出す、リクエスト単位で適用される無効または非推奨の設定の除去(error_reporting、display_errors、@ で診断を隠しても効果がない)
      攻撃者が到達できる致命的エラーと実行時間超過を解消する(コールバック、アップロードやインポートの処理、クリーンアップでの失敗を含む)
      攻撃を受けたかを調べる観点
      JPCERT/CC は10月22日の注意喚起で、対策の適用とあわせて侵害の有無を調べるよう求めている(出典: 35)。JVN も同日、脆弱性情報(JVNVU#99905564)を公開した(出典: 36)。JPCERT/CC は、発見者らの公開情報をもとに、次の点の確認を挙げている(出典: 35)。

      過去の HTTP レスポンスで、不自然に長い、または異常な形式の値の PHPSESSID Cookie が設定されていないか
      不審な multipart/form-data 形式の HTTP リクエストがないか。その前後に PHP のメモリ上限に関するエラーや HTTP 500 エラーが起きていないか
      PHP のワーカープロセスが予期せず異常終了したり、頻繁に再起動したりした痕跡がないか
      悪用の経路は複数あり、単一の検知ルールですべての攻撃を検出できるとは限らず、痕跡が残らない場合もあるため、これらの痕跡がなくても攻撃を受けていないとは断定できないとしている(出典: 35)。

      悪用の状況は?
      CISA は10月26日(米国時間)、CVE-2026-109618 と CVE-2026-109619 を、悪用が確認された脆弱性のカタログ(KEV)に追加した(出典: 13)。

      修正版の公開(10月21日22時台、日本時間)より前から、複数のセキュリティ企業が悪用の試行を観測しており、Cloudflare は公開後に試行の件数が急増したとしている。悪用の試行を観測したとする主な主体と内容は次のとおり。

      日時(日本時間)	主体	観測の内容
      10月17日	Amazon	自社のハニーポット網で悪用の試行を観測(公表の4日前)。送信元は商用の匿名化ネットワーク(出典: 37)
      21日11時〜17時	Amazon	別の匿名化基盤からも試行があり、複数の主体とみている。実際のシステムで成功し得たかは分析中(出典: 37)
      21日16時34分	Patchstack	提携するホスティング事業者から悪用の事案が複数報告された(出典: 22)
      21日16時43分	Cloudflare の CTO	自社の観測として「早期の攻撃が出始めている」と X に投稿(出典: 18)
      21日20時35分	Hadrian	大規模な悪用の試行を観測。攻撃の多くはセッションのアップロード進捗の経路を悪用(出典: 39)
      21日(公開直後)	Patchstack	自社の観測は探索的な攻撃だけで、侵害の確かな証拠はまだない(出典: 22)
      21日(公開後)	Amazon	公開から数時間で追加の PoC が出回り、自社のセンサーにほぼ直後から使われた。広範な悪用の試行が見られるとする(出典: 37)
      21日(公開後)	watchTowr	自社のハニーポット網で両脆弱性の悪用の試行を観測(出典: 21, 23)
      22日0時1分	Vega	実際の攻撃で、公開された PoC を使った試行を観測(出典: 40)
      22日2時台	VulnCheck	中国の IP アドレスから、Web シェルの設置を試みて失敗した試行を観測(出典: 41)
      22日10時25分	Cloudflare の CEO	同社のネットワークでの悪用の試行は、公表前の10時間に数千件、公表後45分で数万件、2時間以内に数十万件、投稿の時点で数百万件(出典: 38)
      22日(更新)	Cisco Talos	公開から数時間で悪用の試行を観測。大半はスキャンで、ほかに組織立っていないさまざまなペイロード送信の試み(出典: 44)
      22日(報道)	Chainguard	試行は主にロシアと中国の IP アドレスから。悪用は難しく、標的の環境についての知識が要るが、高度な攻撃者なら可能とする(CEO の発言として報道)(出典: 45)
      22日	Hunt.io	自社の観測した試行は、少なくとも2026年5月から活動する Mirai 型の IoT ボットネットによるもので、同ボットネットが拡散の手段にこの脆弱性を加えたとみている。成功した侵害は確認していない(出典: 58)
      22日	Arctic Wolf	追加のファイルの取得を試みる、実際のペイロードを運ぶ可能性の高い悪用の試行を観測。ペイロードを置くサーバーに Mirai 派生のボットネット Potassium の検体2つを関連づけたが、観測した要求がそれらを取得または実行したことは確認できていない(出典: 59)
      23日(報道)	Sophos	Potassium の設置を狙った試行を分析し、試行は阻止され、マルウェアは標的に届かなかったとする。悪用の成功を伝えた以前の報告を訂正したとされる(出典: 61)
      成功した悪用については、NCSC-NL が23日22時45分(日本時間)の更新で、国外での悪用の可能性を伝える報告を1件把握しているが、攻撃が実際に成功したことは確認されていないとしている。さらに、悪用は複雑で、大規模な悪用の可能性は当初の見立てより小さいとし、最新の更新をできるだけ早く適用するよう求める助言は変えていない(出典: 42)。

      一方、悪用やその成功を観測していないとする機関や企業もある。

      日時(日本時間)	主体	内容
      22日5時30分	Huntress	自社のパートナー環境で悪用を観測していない(出典: 16)
      22日	Rapid7	実環境での悪用は観測していない。試行の報告は複数あるとする(出典: 43)
      公開された PoC(実証コード)の存在も報告されている。

      日時(日本時間)	主体	内容
      21日14時	GMO Flatt Security	悪用できると主張するコードがインターネット上に出回り始めた(出典: 17)
      21日18時台	NCSC-NL	公開された PoC があり、活発な悪用はまだ確認していない(出典: 12)
      21日以降	VulnCheck	GitHub に数百の PoC のリポジトリが現れているが、本物の悪用コードはごく少数で、x86-64 の環境で ASLR を単独で回避できるものはない(出典: 41)
      22日	Rapid7	公開された複数の PoC は、特定の OS、PHP のバージョン、Web サーバーの組み合わせでしか RCE を示せず、広く信頼できるものはないとみている(出典: 43)
      22日	Sansec	公開された悪用コードは既定の PHP では動かない。標的のサーバーについての知識と条件が要るため、大量の悪用は公開当日の想定より起きにくい(出典: 15)
      23日	SANS ISC	公開された PoC は前提条件が多く(小さなメモリ上限や単一ワーカーの構成を前提とするなど)、汎用で確実に動く攻撃コードを作るのは難しいとみている(出典: 60)
      26日	JPCERT/CC	悪用できると主張する実証コードが多数公開され、悪用を試みる通信を観測したとの報告も相次ぐ一方、実証コードを用いて実際に任意のコードを実行できるかは PHP のバージョンや実行環境、メモリ配置などの条件に依存し、環境に応じた調整が必要としている(出典: 35)
      発見から公表までの経緯は?
      The PHP Foundation によると、CVE-2026-109618 の OOM の問題は、2024年に PHP が数年ぶりに受けた外部監査(OSTIF を通じて Quarkslab が実施)の過程で、最初の兆候が見つかっていた。当時は具体的な攻撃経路が見つからず、修正方針も、互換性の破壊や新たなサービス拒否(DoS)の可能性、多数の拡張への変更の必要をめぐって合意が難しく、修正の作業が数か月にわたり停滞と再開を繰り返した。同 Foundation はこれを構造的な失敗だったとしている(出典: 9)。

      2026年に入り、Patch the Planet の一環でセキュリティ企業 Calif が7月30日に PHP の監査を開始し、8月11日に2024年の問題と同じ根本原因の RCE を報告した。OpenAI も同日に独立に同じ原因を報告し、追加の攻撃経路を OpenAI が9月18日、Wiz が8月24日に報告した(出典: 9)。

      The PHP Foundation によると、公表の直前には調整が乱れた。10月20日15時ごろ(協定世界時)、2件の CVE 番号が、誤った公開時刻と誤った CVSS 10.0(実際は 9.2)付きで出回った(技術的な詳細は漏れていない)。PHP プロジェクトは予告を前倒しして公開し、修正版の公開も10月22日から10月21日(いずれも協定世界時14時)に1日早めた。さらに公開の6時間以上前の10月21日7時41分(協定世界時)、Chainguard がエンバーゴを破って修正入りのビルド済みイメージを公開したとしている(出典: 9)。

      
