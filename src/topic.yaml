      JAXAが火星衛星探査機「MMX」の初期クリティカル運用フェーズ終了を発表
      2026-10-22
      2026-10-22
      ソラノサキソラノサキ
      Facebook
      post
      はてブ
      Feedly
      宇宙動画と広告
      Google優先表示
      Google News
      LINEで購読
      MSNニュース
      YouTube
      Xでフォロー
      JAXA（宇宙航空研究開発機構）は2026年10月21日付で、「H3」ロケット10号機で打ち上げられた火星衛星探査機「MMX」について、打ち上げ直後の重要な運用を正常に終え、探査機の健全性を確認したと発表しました。

      太陽電池パドルの展開などを正常に実施
      日本時間2026年10月20日4時41分03秒に種子島宇宙センターから打ち上げられたH3ロケット10号機は、リフトオフ1時間11分13秒後にMMXを分離しました。JAXAは分離後のMMXについて、ロケットから分離した探査機が一連の健全性を確立するまでの初期段階の運用にあたる「初期クリティカル運用フェーズ」を進めていました。

      JAXAによると、電力を生み出す太陽電池パドルの展開、探査機の向きを3つの軸で安定させる三軸姿勢の確立、通信用アンテナのひとつであるミドルゲインアンテナ（MGA）の保持解放などを含む重要なシーケンスが正常に実施されたことで、MMX探査機の健全性が確保されたことが打ち上げ翌日となる2026年10月21日に確認され、初期クリティカル運用フェーズは終了したということです。

      今後は搭載機器の初期機能確認を実施しつつ、火星圏へと飛行する期間の運用となる「往路巡行運用フェーズ」に向けた準備を進める予定だといいます。

      世界初の火星衛星サンプルリターンを目指して
      MMXは、火星の衛星「フォボス」に着陸して表面の物質を採取し、地球へ持ち帰ることを目指すミッションです。火星の衛星からのサンプルリターンが実現すれば世界初となります。

      フォボスは火星の表面から約6000kmを公転する直径約20～30kmの小さな天体で、本格的な探査がまだ行われていないことから、JAXAは「太陽系で最も重要な未踏峰」と呼ばれることもあると述べています。

      MMX探査機はフォボスへ2回着陸し、10g以上のサンプル採取を目指します。JAXAによると、火星圏への到着は2027年8月、地球への帰還は2031年7月の予定で、サンプルを収めたカプセルは小惑星探査機「はやぶさ」「はやぶさ2」と同様にオーストラリアで回収される計画です。

      初期クリティカル運用を終えたMMXは、これから10か月ほどをかけて火星圏へ向かいます。世界初となる火星の衛星からのサンプルリターンを成し遂げることができるのか、帰還まで約5年間にわたるMMXの旅の行方が大いに注目されます。

