      サイバー大学
      サイバー大学は10月7日、システムが稼働している委託先クラウドサービス事業者で第三者からの不正アクセスによるサービス障害が発生していると公表した(出典: 65)。

      10月8日の第2報でIDCFクラウドを名指しし、障害の発生日時を「2026年10月7日（水） 03:40 ～ 継続中」とした。「履修登録ページへのアクセス、授業料のお支払い手続き、シラバスの閲覧等に障害が発生」している一方、eラーニングプラットフォーム「Cloud Campus」は異なるクラウドサービスを利用しており、現時点で正常に稼働しているとした(出典: 66)。

      『「IDCFクラウド」上の弊社システム環境の復旧は極めて困難な状況との連絡』を受けており、退避済みのバックアップデータを利用して、安全が確認された新たなプラットフォームでシステムを再構築することを検討している。復旧時期は現時点では未定。保有する個人情報の漏洩等の事象は、現時点で確認されていないとしている(出典: 66)。

      ポピンズ
      ポピンズは10月7日、システム基盤として利用するIDCFクラウドが第三者から不正アクセスを受け、午前3時40分頃に大規模障害が確認されたと公表した。ポピンズエデュケアの一部システムと、ポピンズファミリーケアの予約情報等を管理する主要システムにアクセスできず、顧客の予約やキャンセルの確認、スタッフの手配業務に支障が出ている。ポピンズシッター、ポピンズプロフェッショナル、ハワイの2施設は別システムのため影響はない。復旧には、現時点では「短く見積もっても24時間程度」を要する見込みで、委託先の状況によってはそれ以上かかる場合もあるとした(出典: 67)。

      10月8日の第2報では、退避保管していたバックアップデータを基に別の安全なデータセンター環境上でのシステム再構築を進めており、既に社内で一部利用を開始したと公表した。サービスと利用ユーザーごとに段階的に利用を再開するとしている。電話、電子メール、施設現場での対面応対を組み合わせた運用のため、事業運用やサービス提供への大きな影響は生じていないとした(出典: 68)。

      日水物流の入出荷停止
      ニッスイは10月7日、グループ会社の日水物流でシステム障害が発生し、商品の入荷と出荷ができない状況になっていると発表した(出典: 37)。入出荷ができないのは日水物流の17拠点(出典: 63, 64)。日水物流がシステム障害を確認したのは7日午前4時50分ごろ(出典: 63)。

      10月7日の第1報では、原因を「日水物流が利用する委託先のデータセンターへの第三者による不正アクセスとみられています」とし、ニッスイグループが管理する個人情報や顧客データの外部への流出は「現在確認を進めております」、復旧の見通しは「改めてお知らせいたします」としていた(出典: 37)。

      10月9日の第2報は、委託先として株式会社IDCフロンティアを名指しし、同社が第三者による不正アクセスを受けたことに伴いシステム障害が続いているとした。同日から一部の入出荷業務を再開し、被害を受けたサーバーにニッスイグループが管理する個人情報や顧客情報は含まれないことを確認したとしている。全面的な復旧の見通しは「改めてお知らせ」するとした(出典: 106)。

      日水物流の低温物流の取引先は、小売りや卸、外食企業、食品メーカーの約1200社(出典: 87)。日水物流に商品を預ける大手冷凍食品メーカーの一部商品の配送にも影響が及び、日水物流以外の倉庫からの出荷に切り替えるなどの代替対応を進めるメーカーがある(出典: 87)。

