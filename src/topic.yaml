      対策——修正版カーネルの一覧と、ホストとゲストそれぞれがやること
      上流の修正版は次の7系列です。安定版ツリー（gregkh/linux）のタグを git で取り寄せ、各タグに修正コミットが入り、一つ前のタグに無いことを確かめました。

