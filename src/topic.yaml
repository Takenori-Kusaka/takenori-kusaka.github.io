    text: |
      Thoughtworks Technology Radar Vol. 35 が提唱する「エンタープライズハーネス」についてまとめてみた
      AI アーキテクチャ ガバナンス プラットフォームエンジニアリング
      2026年11月、グローバル技術コンサルティングのThoughtworksは、最新の技術動向レポート『Technology Radar Vol. 35』を公開しました。本号では「大規模なハーネスエンジニアリング（Harness engineering at scale）」が4大マクロテーマの筆頭に掲げられ、組織向け共通基盤「エンタープライズハーネス（Enterprise harness）」が技術項目（Blip #27）として提唱されました。個別のプロンプト設計から組織的な共通基盤へと焦点を移す背景と、アーキテクチャ体系についてまとめます。

      企業導入における「モデル中心主義」の限界とシャドーAIの顕在化
      大規模言語モデル（LLM）の発展に伴い、対話型AIやプログラミング支援ツールの導入が進みました。個人の作業効率化では一定の成果が得られている一方、基幹業務への組み込みや全社規模での自律型エージェント運用では共通の構造的課題が生じています。

      モデル単体では組織固有の業務手順や過去の経緯を解釈できず、各部門が独自にプロンプトやスクリプトを構築することで品質の属人化を招きます。また、権限管理や情報漏洩への懸念から本番環境への投入が進まない課題も指摘されています。

      IPA（情報処理推進機構）が公開した『情報セキュリティ10大脅威 2026［組織編］解説』においても、組織の許可を得ずに従業員や部門が独自に生成AIを利用する「シャドーAI」のリスクが挙げられています。機密情報や個人情報の入力、誤った出力に基づく意思決定、知的財産侵害といった脅威への対応として、利用の全面禁止ではなく、安全に活用できる社内環境とガバナンス体制の整備が急務とされています。

      こうした課題に対し、Thoughtworks は個別ツールのパッチワークではなく、エージェントを取り巻く環境全体を1つの専門規律として捉える「ハーネスエンジニアリング」の重要性を打ち出しました。

      ハーネス（Harness）の技術的定義と責務分離
      「ハーネス」とは本来、ワイヤーハーネス（配線束）や安全帯、手綱のように、「外部の大きな動力や入出力を安全に束ね、対象システムを制御下に置くための機構」を指します。

      ソフトウェア工学の観点において、LLM は基本的に「入力テキストに対して確率論的な出力を返す、ステートレスな推論器」です。しかし実業務のタスクは、状態の保持、社内データベースの読み書き、外部APIの呼び出し、アクセス制御といった副作用を伴います。

      ここで、推論エンジン（LLM）と実行環境（ハーネス）の責務分離が必要になります。

      ・基盤モデル（LLM）の責務: 自然言語の解釈、文脈に基づく推論、出力テキストや関数呼び出し要求の生成
      ・ハーネス（Harness）の責務:
        - 業務文脈の抽出と動的なプロンプト組み立て（コンテキスト注入）
        - 社内APIやデータベースへの安全な接続インターフェース（MCP: Model Context Protocol やツール群）
        - 権限境界の設定とプロセスの隔離（サンドボックス）
        - 意図しない操作やポリシー違反を遮断する検査（ガードレール）
        - セッション情報や実行履歴の永続化（ステート管理）
        - 実行結果の妥当性検証と監査証跡の収集（評価・テレメトリ）

      このように、「推論モデルの外部に存在し、実務で安全に動作させるために必要な周辺機構の総体」を設計・実装・保守する営みが「ハーネスエンジニアリング」であり、その成果物が「ハーネス」です。

      なぜ「エンタープライズ」ハーネスなのか（プラットフォームエンジニアリングとの相同性）
      初期のエージェント導入では、個々の開発者やチームがプロンプトや連携コードを手組みする個別アプローチが主流でした。しかし、この方法を組織全体に拡大すると、セキュリティ基準のばらつき、社内API連携コードの重複実装、認可ポリシーの形骸化が生じます。Thoughtworks もこれを「AIによって加速されるシャドーIT」と呼び、重大なリスク要因として警鐘を鳴らしています。

      この課題構造は、クラウド黎明期から発展してきた「プラットフォームエンジニアリング」の歴史的経緯と相同関係にあります。各開発チームが個別にインフラを立ち上げていた時代から、安全基準や可観測性を備えた「社内開発者プラットフォーム（Internal Developer Platform: IDP）」を提供する形態へと移行したのと同様に、エージェント環境にも標準化された共通プラットフォームが求められています。

      Thoughtworks はレポート内で「今後数か月のうちに、数年前にプラットフォームやプラットフォームエンジニアリングに起きたことと同様に、『エンタープライズハーネス（enterprise harness）』がひとつのプロダクトとして登場してくる可能性がある」と述べています。エンタープライズハーネスとは、各チームの場当たり的な実装を排し、「全社共通の資産として統制・配布・継続改善される、エージェントのための共通基盤プロダクト」です。従来の IDP が「開発者体験（DX）」を支えるものであったのに対し、エンタープライズハーネスは「エージェントの実行体験（AX）」を支える全社インフラと言えます。

      エンタープライズハーネスのアーキテクチャ体系（4つの主要コンポーネント）
      Thoughtworks の提言やオープンソースの動向を踏まえると、エンタープライズハーネスは次の4つの主要コンポーネントで構成されます。

      1. 部品流通網とパッケージ管理（Agent Plugin Marketplace / APM）
      エージェントのスキル、指示定義、MCP サーバ仕様を、個人の端末から切り離し、バージョン管理されたプラグインとして集約します。Agent Package Manager（Blip #72）などの仕組みを通じて、全社で承認済みのコンポーネントを宣言的に配布・導入します。

      2. 客観的評価と品質ゲート（Harness quality evaluation）
      ハーネスの更新やプロンプト変更の妥当性を、主観的な印象ではなく客観的なテストセットによって検証します（Blip #29）。消費トークン数や実行ステップ数といった活動量ではなく、過去の障害事例や実業務トランザクションに基づくテストセットを実行し、タスクの成否や意図しない副作用の有無を判定します。

      3. 実行隔離と影響範囲制御（Sandboxes & Blast radius）
      エージェントが自律的にツールを呼び出す環境をコンテナや一時VMなどのサンドボックス内に隔離します。エージェントが不適切なコマンドを生成した場合でも、影響の及ぶ範囲（Blast radius: 爆発半径）を限定し、本番インフラや外部サービスへの波及を物理的に防止します。

      4. 人間参加型の自己改善ループ（Feedback flywheel）
      業務での実行ログや失敗トレースを収集し、ハーネス自体の改善候補（指示の曖昧さ解消やツールの追加）を機械的に抽出します。反映には必ず人間の承認を介在させます（Automate the proposal, keep the approval：提案は自動化し、承認は人間が残す）。安全性と監査性を担保しながら、組織知をハーネスへ継続的に蓄積できます。

      組織の各ロールにおけるアーキテクチャ的価値
      エンタープライズハーネスの導入は、組織内の異なるステークホルダーに対して、それぞれ以下の技術的・運用的な価値をもたらします。

      セキュリティ・システム管理者の視点:
      各部門が無秩序に外部ツールを利用する状態を防ぎ、公認のサンドボックス環境へと誘導できます。どのエージェントがどのデータソースにアクセスしたかの監査ログ、トークン消費量、APIコストを一元的にモニタリングできます。

      業務部門・一般利用者の視点:
      個別に複雑なプロンプトを考案することなく、社内レジストリから承認済みのエージェントを選択するだけで、社内規定に準拠した支援を受けられます。バックエンドでサンドボックスやガードレールが機能しているため、データ破壊や誤送信を過度に恐れることなく実務へ適用できます。

      ソフトウェアエンジニア・開発者の視点:
      関心事の分離（Separation of Concerns）により、認証認可、ログ収集、サンドボックス基盤といった非機能要件を共通ハーネスに委譲できます。開発者は、自社固有の業務ルールやスキーマ設計といったコアな価値創出に注力できます。

      まとめ：差別化資産としてのハーネス設計
      基盤モデルの性能向上とオープンウェイトモデルの普及により、モデルそのものはクラウドインフラと同様に代替可能なコモディティとなりつつあります。要件や運用コストに応じて、異なるベンダーのモデルへ柔軟に切り替えるマルチモデル運用が一般的になりつつあります。

      このような環境において、他社と容易に代替できない企業の固有資産となるのは、「自社の業務文脈、安全基準、システム連携仕様、そして過去の失敗の知見を体系的に実装した『ハーネス』そのもの」です。モデルというエンジンを最新のものへと載せ替えても、堅牢に設計されたエンタープライズハーネスが共通基盤として機能していれば、企業は安全性を損なうことなく、AI技術の進化を迅速に事業価値へ転換できます。

