      2つの重要インフラ組織へ行われたレッドチーム評価についてまとめてみた
      重要インフラ 海外事例
      米国CISAは2026年8月25日、政府サービスおよび施設のセクターの組織(組織A)と上下水道セクターの組織(組織B)に対し類似の手口を用いて同時に実施したレッドチーム評価の結果を公表しました。ここでは関連する情報をまとめます。

      CISA自身のレッドチームによる評価
      CISAは組織A(政府サービスおよび施設のセクター)と組織B(上下水道セクター)に対し、類似の手口(similar tradecraft)を用いた同時のレッドチーム評価を実施し、評価対象組織と調整のうえ本アドバイザリを公表した*1 (出典: 1)。レッドチーム評価は、実際の攻撃者の手口を模して組織の検知、調査、対応の能力を評価するものであり、今回のアドバイザリが記録するのは実際の悪意ある侵害ではなく、シミュレーションの結果として記録されたもの。CISAは両組織の名称を公表していない(出典: 1, 4)。

      CyberScoopは、この評価が対象組織の求めに応じて行われるもので、CISAがレッドチーム活動の結果を公表するのはまれ(rare)であること、CISAが最初のレッドチームアドバイザリを公表したのは2023年で、それ以降このような公表は散発的だったことを報じている(出典: 4)。CISAが2023年に公表したアドバイザリ(AA23-059A)は、2022年に大規模重要インフラ組織を対象に実施した評価を扱ったもので、成熟したサイバー体制を持つ組織であったにもかかわらずレッドチームの活動を検知できなかったとしている(出典: 2)。

      組織Aのケース：ドメイン権限とられ、職員メールに到達
      組織Aでは偵察の過程で既定の資格情報が残る複数の組み込みアカウントを持つWebアプリケーションを発見し、これを悪用して内部メールアドレスから送信できる状態を得たうえでフィッシングメールを送信し、4台のワークステーションへの初期侵入に成功した。改造したBloodHoundでActive Directory情報を収集したところ、侵害した端末の1台でMachine Account Quota(MAQ)が既定値の10のままであることが判明し、この既定値を悪用してアカウントを作成した。あわせて、ADCS証明書テンプレートの一部にESC1と呼ばれる設定不備*2 を発見し、新規に作成したアカウント宛の証明書を要求することで任意のユーザーアカウントの証明書を取得できる状態を作り出し、横展開の手段を得た。その後、レッドチームはドメインに対する昇格権限を獲得し、重要業務システム(SBS)へのアクセスを試みた(出典: 1)。

      ドメイン権限を取得後、レッドチームはSCCMサーバーを照会してユーザーと端末の対応関係を洗い出し、対象利用者のワークステーションへ横展開した。3つのSBSでは探索と初期侵入の手法は同様だったが、資格情報の入手方法はそれぞれ異なっていた。① データベースの1つは管理者ワークステーション上に残っていた平文資格情報から、②データベースはSQL開発ツールの設定ファイルを復号して得た平文パスワードから、③ 自動処理システムは利用者のホームディレクトリに保存されていた、有効期限を設定していない長期有効なAWS IAMユーザー資格情報から、それぞれアクセスを得た。こうした長期有効な静的資格情報は取得されてしまった際、ユーザー全権限がとられ、クラウド環境への永続的無制限アクセスを許しかねないとCISAは指摘している。後者2つのSBSについては仮想デスクトップにも展開し、分散ファイルシステム(DFS)のルートドライブを侵害することで、セッションの有無にかかわらず全利用者の仮想デスクトップ上のローカルファイルにアクセスできる状態を作った。最終的に、侵害済みワークステーションを経由したツールのプロキシと収集済み資格情報の利用により、防御側の介入を受けることなく対象とした全SBSへの管理者アクセスを獲得したという(出典: 1)。

      レッドチームはさらにMicrosoft Entra IDのアプリケーション権限の悪用にも着手した。Mail.ReadWrite権限を持つアプリケーションの所有者を特定してその端末へ横展開し、所有者のプライマリリフレッシュトークン(PRT)からアクセストークンと更新トークンを取得、対象アプリケーションにクライアントシークレットを追加してこれになりすまし、対象者のメールを取得、閲覧した。この経路でSOC職員のメールを閲覧し侵害への気づきの有無を確認したほか、SOCのワークステーションにも横展開してスクリーンショットの取得、キーロガーの使用、Microsoft Teamsメッセージの取得を行ったとしている(出典: 1)。

      組織AのSOCは、レッドチーム活動に関連する中程度および低severityのEDRアラートを受信していたが対応しなかった。通常業務に対応する誤検知アラートが数千件あり、その多くがより高いseverityであったため、レッドチーム活動によるアラートは埋もれたという。組織には複数のSOCと複数のEDR製品が併存し、SOC間、SOC職員とシステム所有者の間で意思疎通がなく、例えばSCCMに関するアラートについて防御側は所有者や用途を特定できず、最終的に誤検知として処理していた。レッドチームは、この背景にSOC職員がアラートをエスカレーションする標準手順を持たず、権限も限られていたことがあると考察している(出典: 1)。

      組織Bのケース：侵入検知もクラウド環境への到達は止めれず
      組織Bでは公開Webサイトから収集したメールアドレス宛のスピアフィッシングにより最終的に3名の利用者が悪性リンクをクリックし、3台のワークステーションへのアクセスを得た。各ペイロードの実行は「実行ファイルが予期しないDLLファイルを読み込んだ」という中severityアラートを生成し、組織BのSOC職員はこれをトリアージして3台すべてを10分、2分、20分以内に手動で隔離し、レッドチームとの通信(C2)を事実上遮断した。ただし、SOCがワークステーションの1台を隔離する前に、レッドチームはLDAPクエリでActive Directoryの構造(全ユーザー、グループ、コンピューター、ドメイン、GPOおよびそれらの関係)をすでに列挙し終えていた(出典: 1)。

      防御側が初期の足場を排除したため、レッドチームは、未検知と同水準のアクセスを再現する「assume breach」モデルへ移行。連絡を取り合っていた組織側の担当者が、管理者権限のない標準ユーザーアカウントの端末でレッドチームの提供したペイロードを実行したことから、ドメインのMAQ属性を照会したところ、全ドメインユーザーに対し1,000という過大な値が設定されており、多数のアカウント作成ができる状態だった。レッドチームは正規ホストに似せた名前でアカウントを作成し、これによりレッドチームが制御可能なドメインアカウントとパスワードを取得。レッドチーム管理下のLinuxワークステーションから単体ツールを実行できるようにした。ツールの通信はassume breachホストを経由してプロキシされており、ホストベースEDRの制限を回避。さらにSCCM配布ポイントの列挙で、ドメインコントローラへのAllExtendedRights権限を含む1,000弱のアカウントへの権限を持つドメインサービスアカウントの平文資格情報を発見し、これを用いたリソースベース制約委任(RBCD)攻撃でDCSync権限を獲得、krbtgtアカウントを含む資格情報を取得した(出典: 1)。

      組織側の担当者から提示された2つのSBSのうち1つについては、事前に収集したBloodHoundデータからアクセス権を持つ利用者を特定し、DCSyncで取得したパスワードハッシュからKerberosチケットを要求してなりすまし、侵害に成功した。OTネットワークについては、リモートデスクトップの接続設定ファイルを持つIT端末を特定し、そのファイル名から利用者がOTネットワークへのリモートアクセスを持つとみて、当該端末がOT DMZの踏み台(bastion)ホストへのリモートアクセスを持つことを確認した。FTP資格情報でSSH経由のログインに成功したが、ペイロード投下時に生成されたアラートによりSOC職員がホストを隔離し、外向き通信も遮断されていたためC2は成立しなかった(出典: 1)。

      組織Bのハイブリッド環境ではオンプレADとクラウドのEntra IDが同期されており、レッドチームはオープンソースツールのADConnectDumpを用いて、オンプレのMSOL接頭辞アカウントとEntra IDの同期アカウントの平文資格情報を取得した。Entra ID側の同期アカウントは本来対話的ログインを想定しておらず、このケースではMFAも有効になっていなかった。レッドチームはこの資格情報でAzureポータルへログインした。この対話的ログインはMicrosoftの自動アラートを発報させ、組織BのSOC職員がこれを受けてアカウントをブロックした(出典: 1)。

      しかしレッドチームは、組織Bのオンプレ環境で名称にAZURESSOを含むアカウントを特定。（Seamless SSOの実装の一部）レッドチームはDCSyncで対象ユーザーの暗号化された資格情報を取得し、これを用いてSSO用のKerberosサービスチケットを要求することで、AD同期済みの任意のユーザーとしてEntra IDへアクセスした。ただしKerberosチケットが有効なのはサインインの第一段階のみで、MFAが設定されたアカウントでは第二要素が要求されたため、実際にログインできたのはMFA未設定のアカウントだけであり、CISAはこれがサービスアカウントに限られていたとみられるとしている(出典: 1)。

      さらにレッドチームは、テナント内全利用者のメールを読み書き送信できる権限を持つアプリケーションにも対象を拡大。侵害済みのオンプレ端末から、このアプリケーションを所有する無効化済みのAD同期アカウントを再有効化し、DCSyncでその資格情報を取得した。AES256ハッシュからKerberosチケットを要求してEntra IDへ認証し、当該アプリケーションにクライアントシークレットを追加した。これにより、公衆インターネットから組織B全利用者のメールを取得できる状態となった(出典: 1)。

      組織Bは、「不慣れなサインインプロパティ」や「不審なAPIトラフィック」を検知するカスタムアラート(Entra ID Risky User Alerts)も備えており、AzureHoundのユーザーエージェントやMicrosoft Graph APIへの閾値超過アカウントを検知する仕組みを持っていた。CISAは、組織Bについても、Seamless SSOの実装を通じてEntra IDへのアクセスを許したこと、ADやサービスアカウントに過大な権限や設定不備があり権限昇格に利用されたこと、OTシステムの資格情報が踏み台サーバー上に平文で保存されていたことなど、資格情報管理を含む改善点があったとしている。一方でセグメンテーションと出口制御は有効に機能していたと評価している(出典: 1)。

      両組織の経過の対比

      組織A、Bにおける攻撃経路の対比
      同種の手口に対して、両組織の経過は次のように分かれた(出典: 1)。

      組織A	組織B
      初期侵入	既定の資格情報が残るWebアプリケーションを悪用し、内部のメールアドレスから送信したフィッシングで4台	公開Webサイトから収集したアドレス宛のスピアフィッシングで3台
      検知と対応	レッドチーム活動に関連する中程度と低severityのEDRアラートを受信したが対応せず	ペイロード実行のアラートをトリアージし、3台すべてを10分、2分、20分以内に隔離
      ドメイン	既定値10のアカウント作成上限と、ESC1の設定不備がある証明書テンプレートを悪用して横展開の手段を獲得。その後、ドメインの昇格権限を得た	平文のサービスアカウント資格情報とAllExtendedRights権限を用いたRBCD攻撃でDCSync権限を獲得
      重要業務システム	対象の3件すべてに管理者アクセス	提示された2件のうち1件を侵害
      クラウド	アプリケーションの過大な権限を悪用し、SOC職員のメールを閲覧	同期アカウントでのログインは成立したが、Microsoftの自動アラートを受けたSOC職員がアカウントをブロック。Seamless SSOを悪用した別経路で全利用者のメールに到達
      CISAは今回の教訓として3点を挙げており、うち2点は組織Aと組織Bで対応が分かれた要因として位置づけ。(出典: 1)。

      (1) 検知ツールの調整状況
      組織Aはアラートのノイズを絞り込むチューニングをしておらず、組織Bで検知と迅速な対応につながったのと同種の活動が、組織Aでは膨大なアラート量に埋もれて反応されなかったとしている。

      (2) 組織体制
      組織Aでは複数のSOCとシステム所有者の間の意思疎通と可視性の欠如が重大な侵害の識別機会を逃す結果につながり、SOC職員は権限や責任の範囲を理解できずエスカレーション手順もないまま様子見の対応に終始したのに対し、組織Bは防御側に権限を与え、迅速なトリアージと原因調査、設定不備の特定、エンジニアリングとの是正調整を実現していた。

      (3) クラウド環境のリスク評価
      対応の速さにかかわらず両組織に共通して残っていた課題。CISAは両組織について、クラウド環境のリスクを過小評価し、侵害の検知や是正の体制も未成熟だったと指摘する。具体的には、ワークロードID向けの条件付きアクセス(Conditional Access)を欠き、大半のアプリケーションに広範な権限を与えていたため、レッドチームはこれを悪用して環境へアクセスし、両組織とも過大な権限を利用してメールを読み取ることができたという。加えて、侵害されたアクセストークンや更新トークンを失効させる明確な手順も欠いており、オンプレ環境から排除された攻撃者がクラウド側から再侵入しうる状態だったとCISAは述べている(出典: 1)。

      CISAの推奨対策
      CISAは今回の教訓と課題を踏まえた推奨行動として、次の4点を挙げている(出典: 1)。

      ベースラインを確立して継続的に維持し、チューニングによりアラートのノイズを削減する
      組織のサイロを解消し、防御側に権限を与える
      ワークロードID向けの条件付きアクセスを適用し、過大または未使用の権限を監視する
      クラウド侵害時にアクセストークンと更新トークンを検知、是正、失効するための包括的な手順を整備し、定期的に見直す
      参考情報
      CISA(観測主体)
