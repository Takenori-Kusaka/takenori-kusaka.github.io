        ニンテンドーミュージアムガイド
        「ニンテンドーミュージアム」には製品の展示や、あそびの体験のほかにも、
        花札をテーマにしたワークショップや、カフェ・ショップなどさまざまなスポットがあります。
        ここでは、ご家族や友人などでご来館いただいた際に参考となるコースの一例をご案内します。

        CASE01 #家族 #ワークショップ
        CASE02 #友人同士 #フォトスポット #ショップ
        14:00
        ニンテンドーミュージアムへ
        最寄り駅の近鉄京都線「小倉駅」から、ニンテンドーミュージアムへ。

        アクセスについて

        ※ご来館の際は公共交通機関（タクシーのぞく）をご利用いただきますよう、お願い申し上げます。また、タクシー・自家用車・バイク・自転車でのご来館は固くお断りいたします。

        ※ベビーカーをご利用の方は、最寄り駅からの階段の少ないルートをご案内しております。

        ニンテンドーミュージアムへ
        荷物はコインロッカーへ
        荷物はコインロッカーへ
        大きな荷物などはコインロッカー（無料※）をご利用いただけます。

        ※利用時に100円硬貨を入れていただく必要があります。100円硬貨は利用終了時に返却されます。

