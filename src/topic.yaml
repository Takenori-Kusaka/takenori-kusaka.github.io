        keyv 等 複数著名パッケージへのソフトウェアサプライチェーン攻撃の概要と対応指針


        2026年8月4日、npm ユーザー jaredwray が管理に関与する、複数の npm パッケージに悪性コードが注入されました。 一部は週間で一億回以上ダウンロードされている、広く利用されているパッケージです。

        注入された悪性コードは Infostealer 型マルウェアです。Lifecycle script 経由で開発者のもつ認証情報を盗み出し、C2 へ送出します。 また、環境に存在するトークンによっては、他 npm パッケージに悪性コードを植え付け侵害するワーム性も持ちます。

        本記事は、弊社が Takumi Guard の解析基盤をベースに観測＆分析した情報を踏まえ、 日本のコミュニティに向けて、影響と対策を中心に整理するものです。



        TL;DR — 対応指針
        はじめに
        侵害の仕組み
        Stage 0 — 悪性パッケージの発火
        Stage 1 — Bun ランタイムのダウンロードと実行（setup.mjs）
        Stage 2 — メインペイロード（Math_Symbol.js）
        起動制御
        シークレット・メタデータの窃取
        GitHub ワームの展開（横展開・永続化）
        npm ワームの展開（横展開）
        窃取データの持ち出し
        参考：窃取トークンの活性管理を行う永続化実装（の痕跡）
        対応指針
        影響確認
        除去
        クレデンシャルのローテーション
        推奨：自衛手段の整備
        Lifecycle script の無効化
        Dependency Cooldown の設定（min-release-age）
        Provenance attestation の検証
        悪意のある依存をブロック（Takumi Guard）
        IoCs
        ハッシュ（SHA-256）
        ネットワーク
        影響のあったパッケージ一覧
        TL;DR — 対応指針
        keyv@6.0.0や、その他ページ下部に示すパッケージを npm install した場合、マルウェア感染の可能性があります。
        弊社検査基盤のデータによると、並行して、さらなる他パッケージの侵害も進行しているように見えます。ご注意ください。
        本検体は多機能な infostealer で、端末内の全てのクレデンシャル・暗号通貨ウォレット・SSH 鍵・クラウド認証情報を窃取し、C2 および GitHub REST API 経由で送出します。
        影響を受けた可能性がある場合は、AWS, GitHub, npm, Kubernetes, Vault, SSH のクレデンシャルおよび暗号通貨ウォレットの秘密鍵を即座にローテーションしてください。
        はじめに
        本記事の目的は事態の把握と対応の促進であり、違法行為への加担・助長を意図するものではありません。

        ペイロードの動作は手法の理解に必要な範囲で要約して記載しています。 記述の一部には不正確な情報が含まれている可能性があります。 速報性を優先していますので、ご了承ください。

        侵害の仕組み
        今回侵害されたパッケージをインストールすると、preinstall フックにより多段の攻撃チェーンが発火します。 本解析は keyv@6.0.0 の検体に基づいたものです。

        Stage 0 — 悪性パッケージの発火
        正規の keyv パッケージには、dist/ 以下にライブラリ本体が含まれます。 一方、悪性バージョンでは files フィールドに setup.mjs と Math_Symbol.js が追加されており、preinstall フックが仕込まれています。

        "files": [
            "dist",
            "LICENSE",
            "setup.mjs",
            "Math_Symbol.js"
        ],
        "scripts": {
            "build": "tsdown",
            "preinstall": "node setup.mjs",
        npm install した時点で（--ignore-scripts を付けていない限り）、setup.mjs が自動実行されます。これら Lifecycle script の起動は、npm v12 以降はデフォルトで無効化されましたが、古いバージョンの npm を利用している場合や、あえて ignore-scripts 設定を無効化している場合は、起動してしまうことに注意してください。

        なお、dist/index.cjs / dist/index.mjs には悪性コードは注入されておらず、正規の機能（キーバリューストア）はそのまま残されています。 少しでも悪性判定されにくくするための工夫であるものと予想します。

        Stage 1 — Bun ランタイムのダウンロードと実行（setup.mjs）
        setup.mjs は RC4 + base64 による文字列難読化が施されています。 よくある難読化と言えます。

        難読化を解くと、以下の処理が出てきます:

        bun --version でホスト OS に Bun が存在するか確認
        存在しない場合、GitHub Releases から Bun バイナリの ZIP をダウンロード（プラットフォーム・アーキテクチャ・libc バリアントを自動検出）
        ZIP を展開し、Math_Symbol.js を Bun ランタイムで実行
        import{execFileSync}from'child_process';
        // ... (RC4-obfuscated string array)
        // → bun binary download → extract → execFileSync(bunPath, [Math_Symbol.js])
        トレースでは bun --version → bun Math_Symbol.js の実行シーケンスが確認されています。

        Stage 2 — メインペイロード（Math_Symbol.js）
        Math_Symbol.jsには置換暗号（PBKDF2、Fisher-Yates等）を用いた難読化、およびAES-256-GCMによるペイロードの暗号化が施されています。以下では、弊社でのリバーシング結果に基づき、同ペイロードの主要機能を解説します。

        起動制御
        実行時にまずプリフライトチェックが走ります。

        ロシア語ロケール検出：実行環境のロケールがロシア語の場合、プロセスを即座に終了
        CI 環境判定：CI, GITHUB_ACTIONS, GITLAB_CI等の30以上の環境変数を参照した情報をもとにCI/CD環境かどうかを判定し、そうではない場合バックグラウンドプロセスとして自身をdetach
        二重起動防止：tmp.dpkg_14527.lock を /tmp に作成し、既存のものが実行環境に発見された場合起動中止
        起動防止時のファイル名を除き、4〜6月にも猛威をふるった Mini Shai-Hulud 系検体の面影が見えます。

        シークレット・メタデータの窃取
        本マルウェアの主目的は認証情報の大規模窃取です。プラットフォーム別に合計200以上のファイルパスを走査し読み取ります。

        カテゴリ	主な対象
        クラウド認証情報	AWS (~/.aws/credentials), GCP (gcloud/credentials.db), Azure (msal_token_cache), Alibaba Cloud, Tencent Cloud, Hetzner
        CI/CD シークレット	GitHub (~/.config/gh/hosts.yml), npm (~/.npmrc), CircleCI, ArgoCD, Jenkins
        SSH / 暗号鍵	~/.ssh/id_*, /etc/ssh/ssh_host_*_key, Kubernetes SA トークン
        暗号通貨ウォレット	Bitcoin, Ethereum, Monero, Litecoin, Dash, Zcash, Dogecoin, Electrum, Exodus, Solana, Foundry keystores
        AI ツール認証情報	Claude (~/.claude/credentials.json), Cursor, OpenAI, Anthropic, Codex, Kiro, Hermes, Gemini
        メッセージング	Discord, Telegram, Signal, Slack, Element
        VPN	NordVPN, OpenVPN, ProtonVPN, CyberGhost, Windscribe, EarthVPN
        パスワードマネージャー	KWallet, GNOME Keyring, macOS Keychain
        シェル履歴	.bash_history, .zsh_history, .python_history, fish_history
        その他、下記の手法でシークレットが窃取されることが確認されています。

        対象	手法
        環境変数（process.env）	プロセスの環境変数を丸ごと収集
        GitHub CLI のアクティブトークン	gh auth token コマンドを実行して取得
        AWS のアカウント情報、Secrets Manager の全シークレット（複数リージョン）、SSM Parameter Store のパラメータ	STS GetCallerIdentity でアカウント情報を列挙、GetSecretValue で複数リージョンの全シークレットを取得、GetParametersByPath でパラメータを捜査・取得
        Kubernetes の /api/v1/namespaces/*/secrets の Secret、および内包するAWSキー・DB接続文字列・Stripeキー・秘密鍵等の認証情報	KUBERNETES_SERVICE_HOST環境変数でクラスタ内実行を判定し、ServiceAccount トークンで Secretを列挙・取得。取得した値を18種類の正規表現でスキャンして抽出
        HashiCorp Vault の Vault に保存されたシークレット	VAULT_ADDR / VAULT_TOKEN環境変数を使い、Vault API 経由で列挙・取得
        GitHub Actions Runner メモリ内の Actions シークレット	GitHub Actions Linuxランナーの場合、Runner.Worker プロセスのメモリを /proc/<pid>/mem からダンプし、"isSecret":trueパターンで抽出
        GitHub ワームの展開（横展開・永続化）
        本検体は窃取したGitHubトークンを利用し、横展開および永続化を試みることが確認されています。

        窃取した GitHub トークンに workflow スコープがある場合、該当リポジトリにGraphQL API経由でマルウェアローダーがコミットされます。 コミットメッセージに "chore: update config"、コミッター名は claude@users.noreply.github.comが指定されます。

        その後は、dependabot/github_actions/format/setup-formatter というブランチ名で PR が作成され、.github/workflows/codeql_analysis.yml を注入されます。ここでコミッター名は github-advanced-security[bot] に偽装されています。このワークフローにより toJSON(secrets) で全リポジトリシークレットをアーティファクトにダンプされるようになります。

        ⚠ 以下は攻撃者が注入する悪性ワークフローの内容（一部割愛）です。

        name: Run Copilot
        on:
          push:
        jobs:
          format:
            runs-on: ubuntu-latest
            env:
              # ↓ GitHub Actions テンプレート式で toJSON(secrets) を展開
              VARIABLE_STORE: <REDACTED: Actions template expression>
            steps:
              # ↓ 攻撃者管理の commit SHA — 正規の actions ではありません
              - uses: actions/checkout@<MALICIOUS-SHA:de0fac2e...>
              - name: Copilot Setup
                run: echo "$VARIABLE_STORE" > format-results.txt
              - uses: actions/upload-artifact@<MALICIOUS-SHA:bbbca2dd...>
                with:
                  name: format-results
                  path: format-results.txt
        npm ワームの展開（横展開）
        その後、npm トークン API（/-/npm/v1/tokens）から bypass_2fa: true のトークンレコードを選別し、2FA をバイパスして書込み可能なパッケージを列挙します。各パッケージの tarball を展開し、窃取したnpmトークンにより書き込みが可能なパッケージに新たにmath_init.jsという悪性ペイロード、並びにsetup.mjsをpreinstall hookに追加し、publishを行う挙動が確認されています。

        当マルウェアは、実行環境内にてGITHUB_WORKFLOW_REF変数が特定のワークフロー名を含み、GITHUB_REPOSITORY がopensearch-jsリポジトリ名である場合、データ摂取等の挙動は起こさずに、代わりにpackage.json に @opensearch/setup を optionalDependencies として注入したものをFulcio（fulcio.sigstore.dev）と Rekor（rekor.sigstore.dev）を使った Sigstore provenance attestation の偽造を試みながらnpm publishする挙動が見受けられます。

        窃取データの持ち出し
        窃取したデータの送出経路は 2 つ存在します。

        経路 1: DomainSender（HTTPS POST）

        Ethereum スマートコントラクト0xE1f2395ee43e45A1556EC6438a88c31B83493103に格納された C2 ドメインリストを公開RPCエンドポイント経由で取得し、取得したドメインに対して、窃取データを RSA-4096 エンベロープ暗号化（公開鍵でランダム AES-256-GCM 鍵を暗号化）して送出します。

        本検体でのデータ送出に用いられたnpm-cache[.]comドメイン以外に、コントラクトのトランザクション履歴から、以下のドメインが過去に登録されていたことが確認されています:

        ドメイン	状態
        pypi-get[.]com	DNS 応答あり、オリジン停止
        js-mirror[.]com	DNS 応答あり、オリジン停止
        npm-cache[.]com	DNS 応答なし、オリジン停止
        awqhnjewqjkl[.]icu	DNS 応答なし、オリジン停止
        コントラクトのドメインが全て到達不能な場合、フォールバックとして GitHub のコミットメッセージから署名付きドメインを探索します（キーワード "thebeautifulmarchoftime"）。

        補足：このfallback経路はマーカー不整合により壊れている可能性が高いです。GitHub commit search のクエリは "thebeautifulmarchoftime " ですが、ヒットした commit メッセージから署名を抽出するパーサーは"thebeautifulsnadsoftime "という異なる文字列を期待しています。同一 commit に両方の文字列が含まれない限り、署名検証には進めません。

        また、DomainSender の応答処理に、C2 からの任意コード実行チャネルが存在します。C2 が HTTP レスポンスボディに {"code": "..."} を返した場合、その内容が eval() で即座に実行されます。実際のコード配信は未確認ですが、C2 オペレーターは任意のタイミングでコード実行を開始できる状態です。

        経路 2: GitHubSender（REST API経由でのコミット）

        窃取した GitHub トークンを使い、api.github.com に公開リポジトリを作成し、窃取データを Base64 エンコードしてコミットとして push します。リポジトリ名は Dune シリーズの用語（sardaukar, mentat, fremen, sandworm, ornithopter 等）からランダムに生成され、description は "Shai-Hulud: Here We Go Again" です。

        参考：窃取トークンの活性管理を行う永続化実装（の痕跡）
        本検体の実装には、OSに応じた下記の通りの永続化の処理が搭載されていることが確認されています。

        macOS の場合は ~/Library/LaunchAgents/com.user.gh-token-monitor.plist に LaunchAgent を登録
        Linux の場合は ~/.config/systemd/user/gh-token-monitor.service に systemd ユーザーサービスを登録
        このスクリプトはバックグラウンドで定期的に GitHub トークンの有効性を確認し、C2 ハンドラーに報告します。

        ただし、当該永続化経路は本検体でのコードでの到達は確認されておらず、メイン実行フローを含むコードからの呼び出し元が存在しないようです。これらは攻撃者が実装したものの、現行バージョンの entry flow からは未接続のコードなようです。（TeamPCP らによりソースコードが公開された Shai-Hulud のバリアントのように見えるので、実装が残置されたものと思われます。）

        対応指針
        以下は公開情報を踏まえた参考情報であり、記録として示すものです。 正確性・網羅性を保証するものではなく、これを実行した結果に対して一切の責任を負いません。

        影響確認
        最低限、影響範囲を確認するためのコマンドを示します。

        # 例：lockfile に keyv@6.0.0 が含まれるか確認
        grep -r '"keyv".*"6.0.0"' package-lock.json pnpm-lock.yaml yarn.lock 2>/dev/null
        npm ls keyv 2>/dev/null | grep '6.0.0'

        # Bun ランタイムが残存していないか確認
        ls -la /usr/local/lib/node_modules/bun/ 2>/dev/null
        which bun 2>/dev/null
        除去
        npm uninstall keyv          # 依存から除去し、lockfile を更新
        クレデンシャルのローテーション
        ワーストケースを想定して、感染端末からアクセス可能だった全てのシークレットに関して、ローテーションを推奨します。

        対象	ローテーション手順
        AWS IAM キー	IAM コンソールでアクセスキーを無効化・再発行。CloudTrail で不正 API 呼び出しを監査してください
        AWS Secrets Manager / SSM	全リージョンの保存シークレット・パラメータを棚卸しし、漏洩前提で再生成してください
        GitHub PAT / GITHUB_TOKEN	Settings → Developer settings → Personal access tokens で失効させてください
        GitHub Actions シークレット	リポジトリ・Organization の全シークレットを再生成してください
        npm トークン	npm token revoke で全トークンを失効・再発行してください
        SSH 鍵	~/.ssh/ 以下の鍵ペアを再生成し、authorized_keys を更新してください
        Kubernetes SA トークン	ServiceAccount トークンをローテーションしてください
        Vault トークン	Vault トークンを revoke し、新規発行してください
        暗号通貨ウォレット	秘密鍵・シードフレーズが漏洩した前提で、資金を新しいウォレットに即座に移動してください
        Docker / GCP / Azure / Alibaba CLI	各クラウドの認証情報を再発行してください
        推奨：自衛手段の整備
        3月の axios 侵害、4〜5月の Mini Shai-Hulud、7月の AsyncAPI 侵害、そして今回の keyv 侵害と、npm エコシステムへのサプライチェーン攻撃が連続して発生しています。 以下の多層防御を整備してください。

        Lifecycle script の無効化
        CI/CD では以下を標準ポリシーにしてください。

        npm ci --ignore-scripts
        補足（npm v12）：npm v12 では lifecycle script がデフォルトで無視されるようになりました。v12 以降の環境であれば --ignore-scripts の明示は不要ですが、CI/CD の npm バージョンが混在している場合は引き続き明示指定を推奨します。

        Dependency Cooldown の設定（min-release-age）
        npm v11 以降では .npmrc に min-release-age を設定することで、公開から一定期間が経過していないバージョンのインストールを抑止できます。今回の悪性バージョンはいずれも短時間でテイクダウンされており、検疫期間を入れていた環境はインストールに至っていません。7 日推奨、急ぐ場合でも 3 日は確保してください。

        # .npmrc
        min-release-age=7
        Provenance attestation の検証
        今回の侵害では、keyv 等は正規の CI/CD パイプライン経由で publish されたため有効な npm OIDC provenance が付いています。攻撃者がパイプライン自体を侵害したケースでは、provenance の有無だけでは悪性版を見分けられません。

        provenance は依然として有効な防御レイヤーですが（直接トークンで publish するケースには有効）、CI/CD パイプラインの侵害に対しては十分ではありません。min-release-age や Takumi Guard 等の多層防御と組み合わせてください。

        悪意のある依存をブロック（Takumi Guard）
        弊社（GMO Flatt Security）は セキュアなレジストリプロキシ Takumi Guard の npm エンドポイント を提供しています。 今回の検体は、公開からおよそ 2 分でブロックまでが完了しており、被害がゼロに抑えられています。

        Takumi Guard は npm（レジストリ）との間に位置するセキュリティプロキシで、悪意あるパッケージがブロックされます。 弊社で全ての新規パッケージを検査し、ブロックリストを構築しています。 PyPI / RubyGems / Packagist / Go Modules にも対応済です。導入は registry URL の変更のみで完了し、無料で利用可能です。

        # npm
        npm config set registry https://npm.flatt.tech/

        # yarn v1
        yarn config set registry https://npm.flatt.tech

        # yarn v2+
        yarn config set npmRegistryServer https://npm.flatt.tech

        # pnpm
        pnpm config set registry https://npm.flatt.tech/
