      多賀城市は10月8日10時5分、市HPが通常どおり利用できる状況になったと公表した(出典: 56)。

      ルートインホテルズのホテル管理システム
      ルートインホテルズは10月8日、ホテル管理システムが利用している「外部データセンター」で障害が発生し、各ホテルのフロントでホテル管理システムを使えない状況だと公表した。発生日時は「2026年10月7日（水）3：40頃～」としている(出典: 77)。

      電話とフロントでの予約受付ができない場合があり、公式サイト等のインターネット予約の利用を案内した。Pontaポイントとdポイントは付与のタイミングが通常より遅れ、利用は一時停止している。「現時点で当社が管理するお客様情報の流出は確認されておりません」としている(出典: 77)。

      自治体が受けた説明
      茨城県
      茨城県のホームページは10月7日午前4時15分から閲覧できなくなった(出典: 87)。県によると、午前8時ごろ、ソフトバンクから「午前4時ごろ、東日本にあるデータセンター内のサーバーの電源が落ちた」と連絡があった(出典: 58)。県は公式Xで10時22分、「クラウドの障害により、茨城県ホームページが閲覧できない状態が続いております」と公表した(出典: 49)。

      県は記者会見で、詳しい原因は調査中としたうえで、委託しているソフトバンクの子会社「IDCフロンティア」が管理するデータセンターの電源が落ち、クラウドに障害が発生して閲覧できない状態になっていると明らかにした(出典: 61)。県情報システム課の担当者は「ランサムウエア攻撃による影響かどうかは説明を受けていない」と話している(出典: 60)。

      県情報システム課によると、閲覧できないHPのデータに個人情報は含まれていない(出典: 60)。県への補助金申請などの行政手続きそのものは県の別のサイト「いばらき電子申請・届け出サービス」で受け付けているという(出典: 60)。県は、届け出や申請に必要な書類などのダウンロードができないため、電話で個別に対応しているという(出典: 62)。書類のダウンロードや電子調達システムへのアクセスができなくなり、県には50件以上の苦情が寄せられた(出典: 87)。

      県は10月8日、暫定版のホームページを開設したと発表した(出典: 87)。暫定版から、県民向けの電子申請と届け出のサービスや、災害と防災の情報などにアクセスできるようになり、県は「緊急性の高い情報を中心に順次更新する」としている(出典: 87)。県のホームページのトップは10月8日16時現在のページとして、システム障害のため一時的に閲覧できないと案内し、電子申請などの手続きに関する案内を載せている(出典: 57)。

      栃木県
      栃木県は県ホームページ内の「イベントカレンダー」のシステム障害で、イベント一覧とイベントカレンダーが閲覧できない状況になっていると公表し、「原因を調査するとともに、復旧作業を進めています」とした(出典: 50)。県によると、HPの運営業者から「『IDCFクラウド』の障害に伴うトラブル」との説明を受けた(出典: 62)。

      小平市
      小平市は公式Xで、「システムトラブル」により市ホームページが閲覧できないと公表した(出典: 51)。市はIDCFクラウドの障害か明らかにしていないが、HPの運営業者から「HPの管理機能を置いているデータセンターで不具合が発生した」と連絡があったとしている(出典: 62)。市議会HPや粗大ごみの申し込みページも閲覧できず、粗大ごみは電話での申し込みを案内した(出典: 52, 53)。

      市は10月8日8時30分、市ホームページの保守管理を受託している事業者が使用するクラウド基盤サービスが第三者によるランサムウェア攻撃を受けたと公表した。事業者が直ちにネットワークを遮断したとしている。現時点で情報漏えいは確認されていないが、問合せフォーム等を利用した際の住民情報(氏名、住所、電話番号、メールアドレス等)に情報漏えいのおそれがあるとしている(出典: 55)。10月9日14時00分現在の臨時案内ページでも、市ホームページが閲覧できない状態が続いている(出典: 110)。

      焼津市
      焼津市は10月7日、市立図書館のホームページを収容するシステムの一部が第三者から不正アクセスを受け、ホームページが閲覧できない状態になっていると発表した。ホームページは10月7日午前3時40分頃から閲覧できず、復旧のめどは立っていない(7日午後9時現在)(出典: 85)。

      問い合わせフォームに過去に入力された約50件の個人情報が漏れた恐れがあり、氏名、住所、電話番号、メールアドレス、ファクス番号、問い合わせ内容が含まれる。年齢、生年月日、性別は含まれない(出典: 85, 86)。これまでのところ個人情報の漏えいは確認されておらず、市が詳しい被害状況を調べている(出典: 85)。

      蔵書検索と予約のシステムは別のシステムで利用できる(出典: 76, 84)。ホームページの閲覧障害は、IDCフロンティアのクラウドサービスの障害の影響とされる*5 (出典: 84, 86)。

      湖西市
      湖西市は10月7日の報道発表で、市立図書館ウェブサイトの接続障害を同日9時30分ごろに確認したと公表した。市立図書館のマイページと資料検索(Web-OPAC)には接続でき、こさい電子図書館は通常どおり利用できる。原因は「調査中」で、ウェブシステム事業者が原因究明と復旧対応をしているとした(出典: 74)。

      10月8日の第2報の経緯欄は、10月7日3時40分ごろに市立図書館ウェブサイトのサーバー保管先であるIDCフロンティアが、サービスの一部システムに対する第三者からの不正アクセスを覚知し、ネットワークから遮断した後にシステムを停止した、と記した。10月8日9時30分現在もウェブサイトは接続できない状態が続いており、「個人情報などの流失の有無は確認できていません」としている(出典: 75)。

      10月9日15時現在の第3報では、ウェブサイトは接続できない状態が続いており、暫定ページを作成したとした。個人情報については「個人情報などの保存はされておらず、流失はありません」とした(出典: 109)。



