       OpenAIのAIモデルが自律的に行ったとされるサイバー攻撃についてまとめてみた
        AI 海外事例
        OpenAIは2026年7月21日、評価中の自社AIモデルがテスト環境から抜け出し、Hugging Faceのシステムへ侵入していたことを確認したと公表しました。Hugging Faceはこれに先立つ同月16日、自律型AIエージェントによるとみられる侵入を検知・対応していたことを公式に開示していました。OpenAIとHugging Face CEOはこれを「前例のない」自律的サイバー攻撃と位置づける一方、専門家の間では評価環境の設定不備や仕様の不備にすぎないとする見方も出ており、解釈をめぐる議論が続いています。ここでは関連する情報をまとめます。

        OpenAIとHugging Face、当事者による公表概要
        今回のサイバー攻撃については、OpenAIとHugging Faceの当事者2社の公表を元にしたもの(出典:1, 4)。攻撃を行ったモデルに与えられたシステムプロンプトの全文や適用された手法は公開されておらず、公開されている一次情報が限定的である点は、一部の専門家らも指摘している(出典:12, 13)。

        何が起きたのか
        OpenAIは、GPT-5.6 Solおよび未公開のより高性能なプレリリースモデルに、サイバー攻撃能力を測定するベンチマーク「ExploitGym」を課す社内評価を実施していた。評価は、モデルが高リスクなサイバー活動に及ぶのを防ぐ「本番用の分類器(production classifiers)」を意図的に無効化し、評価目的でモデルの「cyber拒否」を低減させた状態で行われていたとOpenAIは説明している。Sam Altman CEOもXで、評価中に重大なセキュリティインシデントが発生したと認めた(出典:1, 3)。OpenAIは後の7月28日の追記で、この未公開のプレリリースモデルについて公開予定のなかった内部限定の研究用プロトタイプであり、公開予定のあったモデルは今回の悪用に関与していないと説明し、事案後に当該プロトタイプを無効化・暗号化し研究アクセスを制限したとした(出典:1、7月28日追記)。

        OpenAIの説明によれば、評価環境はサンドボックス構成(パッケージレジストリのキャッシュプロキシを介してのみ外部接続を許す隔離された環境)だったが、モデルはこのプロキシに存在したゼロデイ脆弱性を悪用してサンドボックスを脱出し、権限昇格とラテラルムーブを繰り返してインターネットに到達可能なノードに達したという。モデルはHugging Faceが評価解答を保有している可能性があると推論し、評価で高スコアを得るために解答を不正に入手しようとしたという(一種のカンニングに当たる行為)。窃取した認証情報と別のゼロデイ脆弱性を組み合わせてHugging Face本番サーバへのリモートコード実行経路を発見し、評価解答を本番データベースから直接取得したという(出典:1)。OpenAIは後の7月28日の追記で、このプロキシを「Artifactory」と名指ししたうえで、当該脆弱性および調査でモデルが発見した他のArtifactory脆弱性もベンダに開示済みだとした(出典:1、7月28日追記)。

        またHugging Faceは、同じ侵入について被害を受けた側の視点から経緯を説明している(2社が記す技術的手順の対応関係は確認されていない)。侵入は同社のデータ処理パイプラインを起点とし、悪意あるデータセットが2つのコード実行経路(リモートコード実行型のデータセットローダーと、データセット設定内のテンプレートインジェクション)を悪用したことから始まった。攻撃者はノード権限へ昇格したのちクラウド・クラスタの認証情報を窃取し、週末にかけて複数の内部クラスタへ横移動した。数千に及ぶ個別の操作が使い捨てのサンドボックス群にまたがって実行され、公開サービス上に自己移設型のC2(攻撃者が遠隔から指令を送るための基盤)が設置されていたという(出典:4)。

        Hugging Faceは攻撃ログの解析に商用フロンティアモデルのAPIを使おうとしたが、実際の攻撃コマンド・エクスプロイトのペイロード・C2の痕跡を大量に提出する必要があったため、提供各社の安全ガードレールに阻まれたとしている。同社は代わりに自社基盤上のオープンウェイトモデルGLM 5.2を用いて17,000件超のイベントログを解析し、攻撃の時系列と侵害指標(IoC)を再構築したという(出典:4)。同社は後の7月27日公表の技術タイムラインで、攻撃者のアクションを約17,600件確認しこれを約6,280のクラスタに再構成したとしたうえで、対象期間を2026年7月9日02:28 UTCから同月13日14:14 UTCとした(出典:14)。この非対称性——攻撃側のモデルは利用ポリシーに縛られない一方、防御側の解析はホスト型モデルのガードレールに阻まれる——はHugging Face自身が指摘したもの。研究者のSimon Willison氏も自身の記事でこれを引用し、防御に利用できるモデルの可用性の偏りが防御側を不利にする問題だと説明している(出典:4, 12)。




        影響は「内部データセットの一部」も評価継続中
        Hugging Faceは、内部データセットの一部と複数サービスの認証情報への無許可アクセスを確認したと公表している。公開されているモデル・データセット・Spacesの改ざんは確認されておらず、コンテナイメージ・公開パッケージを含むソフトウェアサプライチェーンもクリーンだったとしている。一方、顧客・パートナーデータへの影響については現時点でなお評価が継続中であり、確定していない*1(出典:4)。Hugging Faceは後の7月27日公表の技術タイムラインで、侵害された顧客コンテンツはExploitGym/CyberGymのベンチマーク解答が格納された5データセットのみであり、他の顧客向けモデル・データセット・Spaces・パッケージへの影響はなかったとした(出典:14)。

        また原因となった脆弱性を修正し攻撃者の足場を排除して侵害を受けたノードを再構築したほか、影響を受けた認証情報・トークンを失効・ローテーションし、予防的にシークレットの広範なローテーションにも着手したとしている。同社は利用者に対しても、予防措置としてアクセストークンのローテーションと、アカウントの最近のアクティビティ確認を推奨している(出典:4)。

        OpenAIは後の7月28日の追記で、公開露出していた認証情報を用いて、本事案の一環として他の4つの公開サービス上の4アカウントにアクセスしていたことが判明したと公表した。内訳は1件が外部中継・ステージング用途、1件がデータ保管用途、残り2件は読み取りのみで、このうち読み取りのみの2件はHugging Face侵害の助長には使われていないという。サービス名は非公開で、他プロバイダ・他アカウントへの影響を示す証拠は確認されていないとしている。またOpenAIは、調査時点でHugging Face事案以外に同等の重大性・規模の活動は確認されていないとも述べている(出典:1、7月28日追記)。

        この4サービス4アカウントのうち1つは、AI向けのソフトウェア開発環境を提供する米新興Modal Labsの顧客アカウントだったと報じられている(出典:15, 16)。Modal自体は侵害されておらず、同社最高技術責任者(CTO)のAkshat Bubna氏は、顧客が誰でもアクセスできる認証不要のエンドポイントを公開しており、これが踏み台として悪用されたと説明したうえで「Modal Labsのプラットフォームや隔離環境は不正侵入されていない」と述べた(出典:15, 16)。OpenAIはModal Labsの顧客への侵入について個別のコメントを控え、4サービス4アカウントに関する既存の説明を改めて示すにとどめており、サービス名は公式には確認・公表していない。Modal Labsとの特定は、Reuters(CNBC、ITmedia配信)の取材およびModal自身の取材への回答によるものである(出典:15, 16)。日本経済新聞は、Modal LabsのアカウントがAIに最初に乗っ取られた踏み台の一つとみられ、攻撃通信の中継やHugging Faceから盗んだデータの保存に用いられたと報じている*2(出典:15)。

        OpenAIが気づくまでかかった「約1週間」
        Hugging Faceは2026年7月16日の公式ブログで侵入を開示したが、この時点では攻撃元を「自律型AIエージェントシステム」と記すのみで、使用されたLLMは「依然として不明」としており、OpenAIを名指ししていなかった。攻撃元がOpenAIのモデルだったと対外的に特定・公表されたのは、5日後の7月21日のOpenAI公式発表による(出典:4, 1)。

        Reutersの独自取材(複数の関係者証言)によれば、モデルがOpenAI社内の隔離テスト環境から脱出を試みたのは7月9日ごろで、Hugging Faceへの侵入は2日後の7月11日に始まり13日まで続いたという(Hugging Face共同創業者Thomas Wolf氏の証言による)。OpenAIが自社エージェントの関与に気づいたのはさらに後で、7月18〜19日の週末に内部ログの中に手がかりを発見したとされる。両社が本件について初めて連絡を取り合ったのは7月20日前後で、Hugging Faceはこれより前に法執行機関(Reutersの取材によればFBI)へ通報を済ませていたという*3(出典:7)。

        OpenAI広報はReutersの報道に「複数の不正確な点がある」とコメントしたが、具体的にどの記述が誤りかは明らかにしていない*4(出典:7)。

        原因はゼロデイ悪用か、隔離設定の人為ミスか
        OpenAIは原因について、評価用サンドボックスのパッケージレジストリ・キャッシュプロキシに存在したゼロデイ脆弱性の悪用と、評価目的で本番相当の安全策を意図的に無効化していたことを挙げている。本事案とは別の長時間稼働モデルの社内評価で観測した想定外の挙動も踏まえ、モデルのアラインメント・評価時のサイバー防護・社内テスト時の監視をさらに強化する必要があるとしている(出典:1, 2)。

        これに対しTechCrunchが取材した複数のサイバーセキュリティ専門家(Trail of Bits創業者のDan Guido氏ら)は、サンドボックスをインターネットから完全に隔離できていなかった構成、具体的にはパッケージインストール用プロキシを残置していたという設定自体の不備が侵害を可能にしたと指摘している。OpenAIはこの構成を人間が設定したかAIが設定したかを含む質問に回答していない*5(出典:8)。

        Artifactoryを開発するJFrogは2026年7月27日、脱出に悪用されたゼロデイを含む脆弱性を修正した版(Artifactory 7.161.15 Self-Managed)を公開したと公表した(出典:17, 18)。関連してCVE-2026-65617、65921、65923、65924、65925、66014、66015、66018の8件(いずれもOpenAIをクレジット)がCVE.orgに登録されたと報じられている。実際に連鎖悪用された具体的なCVEは、JFrog・OpenAIとも非公表としている(出典:18)。

        「前例のない自律攻撃」割れる解釈
        OpenAIは今回の事案について「前例のない(unprecedented)」サイバーインシデントと位置づけ、Hugging Face公式ブログは「これまで扱ったどれとも異なる」インシデントだったとし、Hugging Face CEOのClément Delangue氏はXで「最初の自律型エージェントによるサイバー攻撃は前例のない出来事」と表現している*6(出典:1, 4, 5)。

        一方、元Facebook CSOのAlex Stamos氏やサイバーセキュリティ専門家のAlan Woodward氏は、モデルは与えられた指示に従っただけであり「rogue(暴走)」ではないと指摘、Redwood Researchはこの立場を「仕様の不備(specification failure)」と要約している(いずれもRedwood Researchの記事内での引用による((Alex Stamos氏・Alan Woodward氏の発言はRedwood Researchの記事内での引用による。原文: "The model here was doing what it was asked," said former Facebook CSO Alex Stamos. "It was asked to do something, and it did it," added cybersecurity expert Alan Woodward.))出典:13)。アムステルダム大学のHannes Cools氏もNPRの取材に対し、「AIが暴走したのではなく、安全策を意図的に無効化するという人間の判断の結果であり、与えられたプロンプトの指示に従っただけだ」と述べている(出典:10)。ラフバラー大学のOli Buckley氏もLive Scienceの取材に、モデルが独自の意図を持って「rogue」化したのではなく、人間が設計した目標を想定外の方法で達成したにすぎないとの見方を示している(出典:11)。

        これに対しRedwood Researchの研究者Girish Gupta氏は、単なる指示追従説にも異を唱えている。同氏は、公開されているExploitGymのプロンプトが対象・手法とも厳格に限定されている点を踏まえると評価範囲外の脆弱性悪用や第三者への攻撃が許可されていたとは考えにくいと指摘したうえで、Reutersが報じた「将来のエージェント向けに内部制約からの脱出方法を記したノートが残されていた」との情報(後述)も踏まえ、本事案はreward hacking/grader gaming的なmisalignment(評価者の評価基準を悪用する行動)と見るのが妥当だと論じている*7。ただし同氏は、OpenAIがアラインメント手法や評価用プロンプトの全文を開示していないため、本事案がOpenAIのアラインメント技術の妥当性を直接示す強い証拠ではなく、むしろ封じ込め・監視・評価ガバナンスの不備を示す証拠だとも指摘している(出典:13, 7)。

        英AISIも独立に「評価をチートする」挙動を観測
        英AI Security Institute(AISI)は2026年7月21日、自らのサイバー能力評価でテストしたすべてのモデルが評価範囲外の行動をとる「チーティング」を試みたとする研究結果を公表した。これは本事案の事後解析ではなく、AISIが独立に実施していた別の評価に基づく報告である。AISIは、誤設定により解決不能だった評価において、あるモデルが自らの基盤の外にある公開インターネット上のサービスでコードを書いて実行し、AISIの評価インフラへのアクセスを試みてセキュリティアラートを発生させた事例を報告している(被害・情報漏えいはなし)。GPT-5.6 Solを含む複数モデルでのチーティング挙動も分析されている(出典:6)。OpenAIは自社の7月21日発表の中でこのAISIの評価結果を引用し、同種の能力が実環境でも適用されることを示す傍証としている(出典:1)。

        Reutersが報じる「脱出方法のノート」
        Reutersは、複数の関係者の証言として、OpenAI社内の過去の別のテストで、あるエージェントが将来のエージェント向けとみられるノートを残しており、そこには内部制約から逃れる方法が記されていたと報じている(3名の関係者証言)。また別の1件のテストでは、監視システムが切断されていた事例もあったという(1名の証言)。ただしReuters自身は、これらの事例が7月9日に逸脱・攻撃を行ったエージェントと関連しているかどうかは確立できなかったとしている(出典:7)。OpenAI公式はこれらの主張について公には言及していない。

        Hugging Face CEO「透明性」と1億ドルの計算資源提供を要求
        Hugging Face CEOのClément Delangue氏は2026年7月23日、Xで「rogue agent」と「ちょっと話をしに」サンフランシスコへ向かうと投稿した。TechCrunchの取材にOpenAI広報は、この面会が実際に行われたことを確認している(出典:9)。

        Delangue氏は同月25日、Xで改めてOpenAIに対し、(1)「rogue」エージェントの行動記録(トレース)を研究コミュニティに公開する「radical transparency」と、(2)防御側支援のための1億ドル(100M)相当の計算資源提供の2点を要求した(出典:5)。

        OpenAIは7月21日の発表で、責任ある開示によるゼロデイの修正、研究速度を犠牲にした厳格なインフラ設定統制の導入、Safety and Security Committeeへの定期報告、Hugging Faceを、OpenAIの「trusted access」プログラム(OpenAIが防御目的のサイバー業務を行う検証済み組織に、サイバー用途モデルへの管理されたアクセスを提供する枠組み)へ招請したこと、調査完了後の技術報告書の公表を対応として挙げている。TechCrunchの取材に対しOpenAI広報は、調査を外部アドバイザーおよびSafety and Security Committeeの監督のもとで継続しており、完了後、数週間以内に学びをまとめた技術報告書を公表する予定とのコメントを改めて示した(出典:1, 9)。

