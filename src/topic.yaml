      Anthropic、「Claude Fable 5」を従量課金制に。“定額AIの終わり”が意味すること
      定額プランの加入者も、Anthropicの最高峰の消費者向けAIモデルを利用するには、まもなく利用量に応じた追加料金を支払わなければならなくなる。AIサブスクリプションの「黄金時代」は終焉を迎えているようだ。
      Collage of a paper airplane made of a dollar bill and the Anthropic logo
      Photo-illustration: WIRED Staff; Getty Images
      AIモデルの開発企業はこれまで、消費者にシンプルな選択肢を提示してきた。オンラインのチャットボットを無料で使うか、月額料金を支払って利用枠の拡大やプレミアム機能、高性能なモデルへのアクセスを得るか、というものだ。しかしAnthropicは、このシンプルな仕組みを大きく変えようとしている。

      太平洋時間（PT）の7月12日午後11時59分（日本時間7月13日午後3時59分）から、Anthropicの有料プランに加入しているユーザーは、同社の高性能AIモデル「Mythos 5」の一般向けモデルである「Claude Fable 5」を利用する際、従量課金による追加料金を支払う必要がある。最先端のAI企業が、消費者向けAIモデルを従量課金の対象として提供するのは、これが初めてとみられる。

      推論には大量のトークンが必要
      料金体系は、同社のAPIを利用する開発者向けと同じだ。Claudeに送信するインプット100万トークンにつき10ドル、ユーザーへの回答として生成するアウトプット100万トークンにつき50ドルが課される。例えば、月額20ドルプランの加入者が7月中にFable 5へ100万トークンを入力し、モデルが100万トークンを使って回答を生成した場合、追加で60ドル、合計80ドルを支払うことになる。

      100万トークンは膨大な量で、およそ75万語に相当する。これは『指輪物語』全編よりも長い。それでも、AIのヘビーユーザーが毎月数千ドル規模のAPI利用料を支払うことは珍しくない。その理由のひとつは、Fable 5のような最新モデルが、質問に答える際の内部の推論プロセス（Chain of Thought）で大量のトークンを消費する場合があるためだ。

      API経由でモデルを利用する開発者にとって、従量課金は以前から一般的だった。一方、AI企業はこれまで、消費者向けサービスでは収益を確保し、時には需要を抑制する目的から、定額制の月額サブスクリプションを採用してきた。

      それでも、AI業界が従量課金へ向かう流れは以前から見えていた。昨年にはCursorをはじめとするAIコーディング企業が無制限プランを廃止し、従量課金へ移行している。Anthropicも最近では、大企業向けに、あらかじめ決めた料金ではなく従業員の利用量に応じて課金する仕組みを導入した。こうした変更は、予定されている新規株式公開（IPO）を前に収益構造を見直すためである可能性もある。

      定額制は成り立たなくなっている
      AI企業の幹部のなかには、「Claude Code」や「Codex」のようなAIエージェントは従来のチャットボットよりはるかに多くの計算資源を消費するため、定額制そのものが成り立たなくなっていると考える人もいる。

      「いまの時代に無制限のAIプランを提供するのは、電気の使い放題プランを提供するようなものかもしれません。単純に現実的ではありません」そう語ったのは、ChatGPTの責任者を務めた後、現在はOpenAIのエンタープライズ製品を統括するニック・ターリーだ。

      Anthropicは、完全定額制のサブスクリプションを完全に諦めたわけではない。広報担当のリーム・アテイェは『WIRED』への声明で、十分な計算資源を確保できれば、Fable 5を再びClaudeのサブスクリプションに含めることを目指しており、「できる限り早く」実現したいと述べた。これは同社が抱える計算資源不足を示唆している。

      Anthropicはここ数年、SpaceX、Amazon、グーグルとデータセンター容量を確保するための数十億ドル規模の契約を結んできたが、それでも必要な規模には達していない。

