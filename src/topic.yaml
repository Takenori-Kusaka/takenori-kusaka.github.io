        QRチケットを用意する
        「チケットページ」にアクセスして、スマートフォンにQRチケットを表示します。QRチケットは来館の前日14時以降から表示できるようになります。

        2
        QRチケットをゲートにかざす
        QRチケットをゲートにかざす
        スタッフの誘導に従ってQRチケットをゲートにかざしてください。同行者のQRチケットも、チケットを購入した代表者がかざして入場できます（※1）。

        QRチケットの分配について

