  - link:
    text: |
      推定1兆円相当のBinanceの不正出金事案についてまとめてみた
      APT 不正送金 暗号資産
      2026年10月30日、Binanceは、不正な出金トランザクションが送信されたとして、原因の初期調査の結果と対応を公表しました。ここでは関連する情報をまとめます。

      資金流出の経緯
      Binanceは10月29日21時15分(UTC。以下、時刻は特記のない限りUTC)、公式Xで潜在的なセキュリティ問題の報告を把握して調査中と投稿した。初報は利用者の資金に触れず、非公式のリンクや連絡を信用しないよう案内していた(出典: 2)。同じ投稿は編集され、21時29分の最終版では利用者の資金は完全に安全と改められた(出典: 3)。

      22時15分には出金停止を告知し、セキュリティチェックの実施中で、問題が完全に解決し次第再開するとした(出典: 4)。23時06分にはBinance Alphaの取引も一時停止した。現物ウォレットの資金を使うトークン購入などの機能が対象(出典: 5)。

      23時22分には、「18億ドル」など異なる数字が出回っていると把握しているとして、確認済みの凍結総額25.4億ドルを投稿(出典: 6)。30日0時13分の公式Xでは、損失をすべて補填するとし、入金と出金を一時停止していると説明した(出典: 7)。0時52分には凍結総額を約30億ドルに更新している(出典: 8)。

      2時23分の公式アナウンス「Security Incident Update」では、影響額を推定約63億ドル（約1兆円相当）、オンチェーンで凍結した額を約30億ドルと公表。損失はSAFUファンド(Binanceの緊急用基金。出典: 23)と自社資金ですべて補填し、利用者の資金は安全とした。当面の措置として、入金と出金の一時停止、影響を受けたアドレスの認可の取り消し、法執行機関とブロックチェーン分析のパートナーへの協力要請を実施。更新版のProof of Reservesは対応完了後に、詳細な技術的ポストモーテムは調査完了と事実の確認後に公表するとし、更新は公式チャネルのみで確認するよう案内している(出典: 1)。

      共同CEOは4時17分、入金は影響を受けず通常どおり稼働していると投稿した。出金サービスと関連するアドレス管理の強化に取り組んでおり、今後48時間以内に出金サービスの再開を始める見込みとしている(出典: 9)。*1

      影響額の数字は出所ごとに異なる。Binanceの推定は約63億ドル。外部の推計では、TRM Labsが10チェーン計約63.6億ドル、Chainalysisが現時点の推計で約59.12億ドルとしている(いずれも窃取時点の価格。出典: 14, 18)。凍結額の約30億ドルは、このうちオンチェーンで止められた額にあたる。TRM Labsは0時30分時点で、発行体が凍結できない形の約24億ドル相当(42万 ETH超と18,270 BTC)を攻撃者が保有しているとしている(出典: 14)。

      エンジニアのPCから侵入
      Binanceは公式アナウンスで、初期調査の結果として、DevOpsエンジニアのノートPCが侵害された可能性があり、それによって攻撃者がサービスコンテナにアクセスし、不正な出金トランザクションを送信したと説明した(出典: 1)。*2

      ウォレットの秘密鍵の漏えいの証拠は見つかっていないとしている(出典: 1)。TRM Labsは、ホットウォレットの署名インフラの侵害が最も可能性の高い説明とし、攻撃者が自ら選んだトランザクションに署名させる能力を得たと評価している(出典: 14)。BlockaidのCEOも、暫定的な評価として署名インフラの侵害とみられ、鍵が漏えいしたとは考えていないと述べている(出典: 20)。

      EIP-7702の委任を使った流出
      TRM Labs、Blockaid、オンチェーン解析者(Xのスレッド)は、流出の準備から、流出、再度の抜き取りまでをオンチェーンの記録から追っている。EthereumのBinanceのホットウォレット(解析では「Binance 14」と呼ばれる)ではEIP-7702の委任が使われ、Ethereum以外では通常の署名済み送金で資金が移された(出典: 14, 15, 22)。

      EIP-7702は、秘密鍵で操作する通常のアドレス(EOA)がauthorizationに署名し、それを載せたトランザクション(type-4)がブロックに取り込まれると、以後そのアドレスへの呼び出しで委任先のコントラクトのコードが動く仕組み。委任は、別のauthorizationで置き換えるか解除するまで残る(出典: 14, 15)。authorizationにはアドレスの送信回数の連番(nonce)が含まれ、現在のnonceと一致した1件だけが有効になる。EIP-7702は2025年5月のPectraで導入された(出典: 14)。

      経過は次のとおり(出典: 14, 15, 22)。

      日時(UTC)	出来事
      10月28日 7時39分〜	攻撃者の操作用ウォレットがTornado Cash経由で少額を3回出金して資金を用意
      10月29日	資金を一括で抜き取るsweeperコントラクトを配置し、自分のウォレットで委任とsweepの予行を重ねる
      同日 20時05分〜	XRP Ledgerを皮切りに、Solana、Optimism、Bitcoin、Tron、Arbitrum、AvalancheなどのBinanceのウォレットから、通常の署名済み送金で攻撃者の管理するアドレスへ資金を移す
      同日 20時20分	・Bitcoinでは18,270 BTCを11トランザクションで、同一ブロック内で分割して送金
      ・Ethereumでは操作用ウォレットが、Binance 14の鍵で署名されたEIP-7702のauthorization 50件(nonceは18,914,775から18,914,824まで連続)を1つのトランザクションで送信。nonceが一致した1件が有効となり、Binance 14は操作者だけが資金を引き出せるsweeperコントラクトへ委任
      同日 20時24分	・authorizationの送信から3分24秒後、Binance 14に対してsweepを実行し、167,464 ETH、16.15億 USDT、ほか約60のトークンを1つのトランザクションで移す
      ・24秒後には別のホットウォレット(Binance 16)も署名済みの直接送金で同じ宛先へ資金を送る
      同日 20時30分〜	凍結に先んじてUSDTを分割し、約3.25億 USDTをUniswapXなどの仕組みでmarket makerに売却して約122,300 ETHに交換。1 ETHあたり約2,650ドル相当で、市場価格より10%超不利なレート
      同日 20時41分	委任が残ったBinance 14を使い、Binance 14を信頼していたBinanceのスマートウォレットから7.8億 USDCを移す
      同日 20時59分	同じスマートウォレットから4,300万 USDCを移す(合計約8.23億 USDC)
      同日 21時04分、21時44分など	Binance 14に新たに入金された資産を、追加の署名なしで繰り返し抜き取る
      同日 23時05分ごろ	AvalancheとPolygonのBinanceのウォレットから2波目の流出
      20時32分、オンチェーンの分析者が、取引の送信元アドレスの資金がTornado Cash経由で入っていると指摘した(出典: 23)。Blockaidは21時11分、20時24分ごろからBinanceのホットウォレットで大口の流出が始まったとして調査中であることを公開した。無許可の移動と整合するがBinanceは未確認で、内部の資金移動の可能性も否定できないとしていた(出典: 17)。


      不正出金の流れと凍結
      凍結と予防措置の公表組織
      TRM Labsの集計では、Tetherが21時01分、Circleが21時04分に主な受取アドレスの資産を凍結した(出典: 14)。piyokangoが公表で確認できた組織は次のとおり。

      組織	関係	公表	内容
      Circle	USDCの発行体	10月29日 21時18分	法執行機関と連携し、8億 USDC超を凍結(CEOの投稿)
      Tether	USDTの発行体	10月29日 21時25分	15.67億 USDT超を凍結(CEOの投稿。@Tetherがリポスト)
      Binance.US	Binanceとは別の独立したプラットフォーム	10月29日 21時41分	今回の事案の影響を受けていない。顧客資金とサービスは通常どおり稼働
      Kamino	DeFiの運営者	10月29日 22時03分	現時点で影響を受けていないと確認したうえで、予防措置としてSOL/BTCマーケットの借り入れを一時停止
      Ripple	RLUSDの発行体	10月29日 22時08分	・攻撃者が保有するRLUSDを凍結中と公表。額は示していない
      ・共同CEOは「approximately 200 million」と投稿(通貨の単位の記載なし)(出典: 10)
      ・TRM Labsがオンチェーンで確認したのは4,050万 RLUSD(出典: 14)
      World Liberty Financial	USD1の発行体側	10月29日 22時17分	・BitGoと協力して盗まれたWLFIとUSD1を凍結し、捜査に全面協力
      ・共同CEOはUSD1 2,700万ドルとWLFI 4,800万(約200万ドル)の凍結と投稿(出典: 11)
      Aave	DeFiの運営者	10月29日 22時44分	・予防措置として、DAO運営のV3の175リザーブ(16ネットワーク)とV4の117リザーブ(4ネットワーク)を凍結。新規の預け入れと借り入れは止まり、出金と返済は可能(詳細はガバナンスフォーラムの投稿)
      ・攻撃者の1ウォレットがV3に6,000万 USDTを預けて19,762 WETHを借り入れていた。コントラクトは影響を受けていない
      Paxos	PAXGなどの発行体	10月29日 22時56分	・攻撃者とみられるアドレスで1,906.67 PAXGを凍結
      ・自社システムへの影響はなく、準備金は保全され、償還も通常どおり
      Arbitrum DAO Security Council	Arbitrum Oneのガバナンス機関	10月30日 0時08分(措置の時刻)	・攻撃者のアドレスの8,425 ETHと74,559,805.2 ARBを緊急措置で凍結
      ・Ethereum側のinboxコントラクトを一時的にアップグレードして資金を凍結用アドレスへ移し、元の実装に戻した。資金の移動にはArbitrumDAOのガバナンス投票が必要
      ・共同CEOは約3,050万ドルと投稿(出典: 12)
      攻撃の遮断は次のように進んだ。委任が残っていたBinance 14について、Tetherは22時06分にこのアドレス自体をブラックリストに登録し、BinanceによるこのアドレスからのUSDTの送金は22時15分と23時01分に失敗した。Binanceは22時55分から23時07分に、Binance 14から自社の別のウォレット(Binance 8)へ46件のトークン送金を行った(オンチェーン解析者のスレッド。出典: 22)。30日0時10分にはBinance 14のEIP-7702認可が取り消された(オンチェーンでの観測。出典: 24)。

      報道のみで伝えられた組織もある。First DigitalのCEOは書面コメントで、盗まれたFDUSDを凍結したと述べた。market makerのWintermuteとGSRはBinanceへのエクスポージャーを開示し、純資産に占める割合はGSRが5%未満、Wintermuteが20%未満で、事業への大きな混乱は見込まないとした(出典: 21)。

      北朝鮮の組織への帰属
      TRM Labsは、オンチェーンとオフチェーンの情報に基づき、攻撃を北朝鮮の組織TraderTraitorによるものとし、high confidenceの判断としている(出典: 14)。*3

      個人の調査者もXで、Lazarus Groupの可能性が高いと投稿しているが、根拠は示していない(出典: 19)。BlockaidのCEOは、北朝鮮関連の活動に似ているが帰属は未確認と述べている(出典: 20)。Binanceは法執行機関と協力して犯人の特定を進めている(出典: 1)。

      Binance JapanとBinance THも入出庫を停止
      Binance Japanは日本時間10月30日12時22分のお知らせで、30日未明からBinanceの取引システムでセキュリティ事案が確認されたと説明した。同社も同じ取引の仕組みを使っており、取引は継続できるが、安全確認のため全暗号資産の入出庫を一時停止している。顧客資産への影響は現時点で確認されておらず、再開時期は示していない(出典: 25)。*4

      同社は0時26分(日本時間9時26分)に公式Xで、利用者に不審なURLや連絡に反応しないよう呼びかけた。お知らせでも同様に求めている(出典: 13, 25)。

      タイのBinance THを運営するGulf Binanceは、入出金を予防措置として一時停止した。専門家による詳細なセキュリティチェックのためとし、タイの顧客の資産は安全で、Binance THのコールドウォレットはBinanceのウォレットと厳密に分離され、独立した法人と独自のカストディだと説明した。他のサービスは通常どおり稼働している(出典: 26)。

