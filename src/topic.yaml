      2026-10-21
      PHPの2件の深刻な脆弱性(CVE-2026-109618、CVE-2026-109619)についてまとめてみた
      脆弱性
      2026年10月21日、PHPの開発元であるThe PHP Groupは、PHPの深刻な脆弱性2件を修正するセキュリティリリースを公開しました。ここでは関連する情報をまとめます。

      何が起きたの?
      PHPのセキュリティチームは10月20日(協定世界時)、2件の critical な脆弱性を修正するセキュリティリリースを10月21日14時(協定世界時、日本時間23時)に行うと予告した。詳細が公になった場合や実際の悪用の証拠が見られた場合は、より早くリリースする権利を留保するとしていた(出典: 1, 2)。

      この予告より前の10月20日18時26分(協定世界時、日本時間では21日3時26分)、watchTowr は X 上で、エンバーゴ下にあった PHP のリモートコード実行の脆弱性について情報が漏えいしたとし、脆弱性は実在すると確認できると投稿した。同社 CEO は、2件は当初、木曜(10月22日)の午前11時(米東部時間)に公表される予定だったと説明している。公式の予告は21日14時(協定世界時)で、CEO の述べた日時より前になる*1 (出典: 19, 25)。掲示板の Hacker News にも2件が近く開示されるとの投稿があり、後に削除された(出典: 15, 25)。2件はセキュリティ企業や研究者の間で通称「php2shell」とも呼ばれている(出典: 15, 16, 17)。

      国内では IPA と国家サイバー統括室、そして総理大臣も10月21日、23時のリリースに向けた事前準備を呼びかけた(出典: 10, 11)。


      修正版は10月21日に公開された。GitHub のアドバイザリ2件は22時34分、CVE レコードは22時48分と22時54分(いずれも日本時間)に公開されており、予告の23時より前だった(出典: 3, 4, 5, 6, 7)。

      どのような脆弱性なの?
      2件とも認証不要のリモートコード実行(RCE)につながりうる脆弱性で、深刻度は CVSS v4.0 で 9.2(Critical)。*2 公式が影響を受けるとするのは、Web リクエストを処理するすべての PHP のインストール(PHP-FPM、Apache の mod_php、php-cgi、FrankenPHP、LiteSpeed)で、リスクが最も高いのは mod_php としている。mod_php には、アプリケーションのコードが動く前に認証なしのリクエストで攻撃を起こせる、実証された攻撃があるという(出典: 3, 6, 7)。

      CVE-2026-109618(RCE via OOM corruption)
      メモリ不足(OOM)のエラー処理に起因する脆弱性。PHP はメモリ不足になると、その時点の処理を打ち切ってリクエストを中断する。この打ち切りを想定していない処理の途中で中断が起きると、リクエスト用のメモリが不正な状態のまま残り、リクエストの後片付けの処理がそのメモリを使うことがある。メモリ不足を起こす手法は複数あり、この状態を安定して引き起こして RCE につなげられるとしている(出典: 4, 6)。*3

      確認された影響は、Web ワーカーの権限での認証不要の RCE。実行環境ごとの状況は次のとおり(出典: 4)。

      mod_php: 既定の入力とメモリの制限、通常の prefork 構成で、アプリケーションのコードが動く前に起きる HTTP 経由の RCE を検証済み
      PHP-FPM: ソース解析上は影響を受けうるが、完全な攻撃は実証されていない
      FrankenPHP: ソース解析上、mod_php と同じく、アプリケーションに依存しない攻撃を受ける可能性が高い
      LiteSpeed(LSAPI): PHP-FPM に倣う構造で、アプリケーション次第の攻撃の可能性が高いが未検証
      CVE-2026-109619(RCE via stale global state)
      リクエストをまたいで残る状態に起因する脆弱性。PHP のワーカーはエラーやセッションなどの状態を保持し続けており、その一部はリクエストのメモリを指している。リクエストの終了時にこの状態がリセットされないまま(またはリセット後に再び設定されて)メモリが解放されると、同じワーカーが処理する次のリクエストで、初期化の前に動く一部の処理がこの古い状態を使うことがある(解放後使用)。これが RCE につながりうる(出典: 5, 7)。

      確認された影響は、認証不要の解放後使用、メモリの開示、Web ワーカーの権限での RCE。RCE が確認された経路は次の2つ(出典: 5)。

      PHP 8.5 で致命的エラー時のバックトレース(fatal_error_backtraces)を有効にした場合の経路: mod_php で確認
      セッションのアップロード進捗の経路: mod_php と PHP-FPM で検証(PHP-FPM はアプリケーション側に条件に合う処理があることが前提)
      脆弱性の発見と報告
      CVE レコードは、報告者として Wiz と Calif.io を2件ともに挙げ、OpenAI を CVE-2026-109619 の報告者、CVE-2026-109618 の発見者としている(出典: 6, 7)。OpenAI は、Calif が AI モデルを使って重大な脆弱性1件を見つけ、Wiz が2件を独立に発見・報告したとし、自社が PHP の維持者や各社との調整にあたったとしている(出典: 24)。

      Wiz は10月21日に自社の調査結果を公開し、PHP のチーム、Calif.io、OpenAI と、発見、調整、修正の検証にあたったとしている。調査では最先端の AI モデルを使い、脆弱性の発見や攻撃コードの開発、修正の検証に役立てたという(出典: 20)。

      同社によると、WordPress、Drupal、Joomla の検証時点の最新のコンテナイメージで、認証なしのリモートコード実行を実証した。リモートコード実行に至らなくても、パスワードやトークン、API キーなどの機密情報を、プロセスのメモリから認証なしで読み出せることも示したとしている(出典: 20)。

      影響を受けるバージョンは?
      CVE レコードと GitHub のアドバイザリが影響を受けるバージョンとして挙げているのは、8.2 から 8.5 の各系列の修正版未満(出典: 4, 5, 6, 7)。*4

      系列	影響を受ける範囲	修正版
      8.5	8.5.12 未満	8.5.12
      8.4	8.4.27 未満	8.4.27
      8.3	8.3.36 未満	8.3.36
      8.2	8.2.35 未満	8.2.35
      PHP プロジェクトは 8.1 以前の更新を行っていない。深刻度を踏まえ、PHP セキュリティチームは 7.4、8.0、8.1 向けに最小限のソースのバックポートを提供した。ソースからビルドする利用者や、LTS ベンダーを使えない利用者向けとしている。Linux ディストリビューションと LTS ベンダーには、パッチが事前に提供された(出典: 3)。

      Wiz は、PHP 5.4 以降のほぼすべてのバージョンが、今回の脆弱性の少なくとも1件の影響を受けるとしている(出典: 20)。

      修正版と対処は?
      アドバイザリは全ての PHP 利用者に直ちに修正版へ更新するよう促している(出典: 3)。

      Linux ディストリビューションと LTS ベンダーのパッケージの更新を確認するよう案内している。8.1 以前は、一部のディストリビューションと LTS ベンダーがバックポートを提供しているため、ベンダーに確認するか、サポート中のバージョンへ移行するよう求めている(出典: 3)。

      ボランティア運営の Remi リポジトリについては、同日は更新がないとして、ディストリビューションのパッケージかソースからのビルドへ切り替えるよう求めている(出典: 3, 8)。Remi リポジトリは22日、8.2.35、8.3.36、8.4.27、8.5.12 の RPM を公開した(Remi のブログ)。

      Debian と Ubuntu 向けに PHP を配布しているリポジトリ deb.sury.org のメンテナーは、同リポジトリの issue で、修正をリポジトリにある全ての PHP のバージョンに、サポート終了版のブランチ向けのバックポートも含めて提供する見込みとしている。サポート中の全ての Debian と Ubuntu のリリースが対象で、amd64 向けを先に出す予定とした。arm 系はビルドに時間がかかり、24日13時18分(日本時間)、メンテナーはほぼ完了したとして、暫定的に用意していた追加のリポジトリを撤去した。26日13時21分(日本時間)には、ビルドの待ちはないとしている。

      IPA は10月22日の注意喚起で、修正対応が難しい場合について、更新や移行が済むまでは暫定対策やアクセス制限を検討し、有効な暫定対策が難しい場合は、外部からのアクセスの遮断やサービスの一時停止が必要か判断するよう求めている(出典: 34)。

      PHP プロジェクトは10月23日、セッションのアップロード進捗の機能に関する別の脆弱性 CVE-2026-115560 について、次の定例のバグ修正リリースまで session.upload_progress.enabled=0 を設定するよう呼びかけた。CVE-2026-109619 の緩和策として挙げていた設定と同じで、適用して維持していれば追加の対応は不要としている。設定でセッションのシリアライズの方式を php_binary か php_serialize にしたうえで実行時に php に切り替え、さらにアップロード進捗の機能が有効のまま、という設定とアプリケーションのコードのまれな組み合わせの場合に限って起きる、実際には起きにくい経路として、10月21日の修正版には含まれず、次の定例リリースで修正してアドバイザリを出すとしている(出典: 56, 57)。

