        2026年7月30日 続報反映:乗っ取られた4アカウントの1つが米Modal Labs(顧客アカウント、Modal自体は非侵害)と報道で判明したこと、Artifactoryを開発するJFrogによるゼロデイ修正・関連CVE8件の公表を追記
        2026年7月29日 AM 続報を本文に統合し反映(OpenAI公式7月28日追記、Hugging Face技術タイムライン7月27日)
        2026年7月29日 AM 新規作成
