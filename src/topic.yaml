      [2] 2023年2月28日 CISA「CISA Red Team Shares Key Findings to Improve Monitoring and Hardening of Networks」(AA23-059A)
      CISAが出典として挙げた参照資料
      [3] 2021年6月17日 SpecterOps「Certified Pre-Owned」(ESC1呼称の出所)
      報道
      [4] 2026年8月25日 CyberScoop「Water sector passes, government sector fails attempts to spot and halt simulated CISA attack」
      (日付は公開元のものを記載しているため、現地時間等でずれている可能性があります。)

      更新履歴
      2026年9月4日 新規作成
