      Xでフォロー
      SpaceX（スペースX）は日本時間2026年10月2日、バンデンバーグ宇宙軍基地から「Falcon 9（ファルコン9）」ロケットを打ち上げ、小型衛星の相乗り（ライドシェア）ミッション「Transporter-18（トランスポーター18）」を実施しました。130のペイロードを搭載したFalcon 9は予定の軌道に到達し、衛星や軌道間輸送機などを分離しました。

      打ち上げに関する情報は以下の通りです。

      打ち上げ情報：Falcon 9（Transporter-18）
      ・ロケット：Falcon 9 Block 5
      ・打ち上げ日時：日本時間 2026年10月2日 3時32分
      ・発射場：ヴァンデンバーグ宇宙軍基地 SLC-4E（アメリカ）
      ・ペイロード：小型衛星など（合計130）

      Transporter-18は、SpaceXが提供する小型衛星の相乗り輸送プログラム「SmallSat Rideshare Program」によるミッションで、Transporterとしては18回目にあたります。SpaceXによると、今回のフライトにはキューブサット、マイクロサット、ホステッドペイロードのほか、再突入カプセルを備えた宇宙機2機と軌道間輸送機（OTV）4機を含む130のペイロードが搭載されました。

      衛星や軌道間輸送機などは、打ち上げの約54分後から約11分間かけて順番に分離されました。なお、130のペイロードのうち41は軌道間輸送機4機に搭載されており、後日分離される予定です。

      GoogleのAI用チップ搭載衛星や衛星サービス機も搭載
      今回のTransporter-18には、Googleの研究計画「Project Suncatcher（プロジェクト・サンキャッチャー）」の試作衛星「Project Suncatcher M1」が搭載されました。Project Suncatcherは、衛星群を使って宇宙で大規模なAI処理を行えるか探る研究計画です。

      衛星事業者Planetとの協力で開発された試作衛星には、Googleの機械学習向け半導体「TPU（Tensor Processing Unit）」が搭載されています。打ち上げ時の振動や加速度、軌道上の放射線や温度環境がTPUの動作に与える影響などを調べます。Googleは2027年に2機の衛星を打ち上げ、衛星間のレーザー通信を試験する計画です。

      アメリカのStarfish Spaceは、衛星サービス機「Otter」の初号機を打ち上げました。Otterは、運用中の衛星の寿命延長や、運用を終えた衛星の廃棄を目的とした宇宙機です。初号機はNASA向けの「SSPICY」ミッションを実施する予定です。

      このほか、宇宙での医薬品製造を手がけるアメリカのVarda Space Industriesの再突入カプセル「W-8」「W-9」や、Planet Labsのハイパースペクトル衛星「Tanager-2」、フィンランドのICEYEのSAR（合成開口レーダー）衛星、イタリアの地球観測プログラム「IRIDE」の衛星など、各国の多様な衛星が相乗りしています。

      

