      *2:ESC1は、SpecterOpsが体系化したADCS(Active Directory証明書サービス)の設定不備分類の一つを指す呼称。CISAは本アドバイザリで、申請者指定サブジェクト設定(CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT)が有効で、かつ低権限ユーザーが証明書を要求できるテンプレートとして説明している(出典: 1, 3)。

