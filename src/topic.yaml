         国内で相次ぐ不正アクセスに対する注意喚起についてまとめてみた
          脆弱性 不正アクセス 情報漏えい
          2026年10月7日から9日にかけて、個人情報保護委員会、JPCERT/CC、国家サイバー統括室、IPAなどの各機関が、国内組織で相次ぐ不正アクセスによる個人情報の漏えいを受けた注意喚起を公表しました。ここでは関連する情報をまとめます。

          BIツールや従業員向けシステムも被害に
          JPCERT/CCは10月8日に公開した注意喚起で、「2026年9月前後」に国内組織で不正アクセスによる個人情報等の漏えい被害が相次いでいるとした。複数の製品やサービスで被害が発生している中、「技術的な情報の共有が不足しており、把握している情報は限定的かつ断片的」とも記している。同注意喚起は、普段から断続的、散発的に発生しているランサムウェア攻撃等とは別に、大量の個人情報等の漏えいにつながっている「特に増加している恐れのある攻撃類型」を取り上げるもの。(出典: 7)

          被害に遭ったのは一般利用者向けのアプリに限らない。BIツールや従業員向け管理システムなど、管理、運用側で不特定多数の利用者からのアクセスを想定していないシステムでも、内部に保存していた情報が漏えいしたケースがある。(出典: 7)

          国家サイバー統括室は10月9日、大量の個人情報を取り扱う事業者等の情報システムが不正アクセスにより侵入され、個人情報を含むデータが窃取される「事案を複数確認」しているとした。(出典: 9) IPAは同日、「現段階では、特定のプロダクトやサービスの脆弱性を狙った攻撃とは断定されておらず」、公表事例の傾向から外部公開しているアプリケーションやサービスの侵害、アカウントの侵害が起点となっていることがうかがえるとした。(出典: 13) 金融庁は、運転免許証等の本人確認書類の画像情報を含む顧客情報等が漏洩するサイバーインシデントが発生しているとしている。(出典: 14)

          JPCERT/CCが示した4つの攻撃類型
          JPCERT/CCは注意喚起の中で、寄せられた情報などに基づく攻撃手法と痕跡を4つのケースとして示した。同注意喚起は「すべての事案で同一の攻撃手法が使用されていることを示すものではありません」と限定しており、今後の状況を踏まえて情報を追加する可能性があるとしている。(出典: 7)

          ケースA
          さまざまなソフトウェアの既知の脆弱性を探索し攻撃試行するもの。一つの共通するソフトウェアの脆弱性を悪用しているのではなく、標的ごとに既知の脆弱性の有無をスキャンして悪用を試行したり、脆弱性ではないものの機器の管理不備等を悪用した攻撃(環境設定ファイルやバックアップファイルの窃取など)を試みたりしている可能性がある。

          ケースB
          API経由での不正な操作。アプリの管理用APIへの不正なリクエストによって情報の不正な書き換え等が発生しているものがあり、JPCERT/CCは次のような手口の複数の報告を受けている。

          (a)一般公開しているスマートフォンアプリを解析し、APIのエンドポイントやキーを特定する
          (b)本来画面操作では実行できない内部APIに対する攻撃。具体的には、ユーザー権限の変更、不正なアカウントの作成、ヘッダーの有無の切り替えや不正な形式の認証トークンの付与による応答の違いの確認、NoSQLインジェクションによるブラインド探索を通じたアカウント情報の特定
          (c)他のシステムの侵害で窃取したAPIキーを使用する
          ケースC
          MetabaseのSQLインジェクションの脆弱性(CVE-2026-72898)。この脆弱性もAPIへの不正なリクエストを通じて悪用される。(出典: 7) Metabaseは8月6日に公表。Metabaseによるとこの脆弱性を悪用したゼロデイ攻撃が確認されている。JPCERT/CCは8月14日に注意喚起を公表している。(出典: 1)

          ケースD
          10月9日に追加。公開Webサーバーからアクセス可能なアプリケーションサーバー上にWARファイルが設置される事案を確認している。WARファイルに含まれるJSPファイルは簡易Webシェルとして動作し、特定のクエリパラメーターを取得してシェルコマンドとして実行する機能を持つ。9月ごろには、掲載された不審なアクセス元からWebシェルへのGETおよびPOSTリクエストでの繰り返しアクセスが確認されている。




          個人情報保護委員会は10月7日に改訂したWARNINGで、漏えい等報告を受けた事案を分析して問題点を九つの事例に類型化した。事例9「APIが悪用される事例」は、APIの設計、設定不備により、ログイン後のパラメータの書き換えで他のユーザー情報を取得できる状態となっていたもの。(出典: 5)

          JPCERT/CCが注意喚起の参考情報に挙げた、セキュリティ企業3社の専門家が共同でまとめた資料(以下、専門家の共同資料)は、事案対応やログ分析から得られた情報として、特定の脆弱性だけを探すのではなく、サイトやAPIの不備を広く探る動きが見えてきているとしている。スマートフォンアプリの解析で取り出したAPIキーを使い、正規のアクセスに見える形でAPIを呼び出すケースがあり、狙われている問題として必要以上の情報を返すAPI、過剰な権限を持つAPI、会員向け機能に匿名ユーザーでもアクセスできてしまう問題などを挙げる。一部は管理画面の弱いパスワードを使った攻撃や既知の脆弱性の悪用も確認しているという。*1 (出典: 15)

          別のセキュリティ企業は10月9日、専門家の共同資料が公開した2件のIPアドレスを起点に、自社が観測した通信(9月18日から10月8日)を調査した結果(以下、観測レポート)を公表した。同一とみられる攻撃者が約40分間で326のIPアドレスを使い分け、これらのIPアドレスから約40分間に1,200件を超えるアクセスが行われる攻撃を複数回確認したとしている。IPアドレスが異なってもリクエストの中で同一の識別子が使い回されていたことから、同一の攻撃者によるものと判断したという。保存されているログの範囲はサービスや環境によって異なり、観測期間全体のデータを網羅したものではなく、特に9月18日から28日は一部の環境のデータに限られるとしている。(出典: 16)

          観測レポートが攻撃の流れの一例として示すのは次の5段階。(出典: 16)

          SQLインジェクションでログイン認証を回避できないか、情報を窃取できないかを探索
          回避できないと分かると、攻撃者が事前に作成していたとみられるアカウントでログイン
          ログイン後の機能で、改めてSQLインジェクションが可能かを探索
          ポイント制度のあるサイトでは、他の利用者のポイントを窃取できないかを探索
          一通り試し終えると執拗には攻撃せずに引き上げる。別の日に同じサイトを攻撃する動きは確認されていない
          1つのIPアドレスあたりのアクセス数も少ないため、特定のIPアドレスからのアクセス数やツール特有のパターンに頼った監視だけでは見逃すおそれがあるとしている。(出典: 16)

          政府機関等の動き
          10月上旬、デジタル大臣、官房長官、関係閣僚が会見で相次ぐ流出に言及し、10月8日には首相の国会答弁と関係省庁会議があった。個人情報保護委員会が7日、JPCERT/CCと警察庁が8日、国家サイバー統括室、総務省、経済産業省、IPA、金融庁が9日に、それぞれ注意喚起を公表している。

          日付	主体	動き
          10月2日	デジタル大臣	会見で漏えい等の件数に言及(出典: 2)
          10月6日	デジタル大臣	会見で国民に3つの対策を呼びかけ(出典: 3)
          同日	官房長官	会見で「大変深刻に受け止めている」と述べ、手口や傾向の分析を通じた被害の全体像の把握に努めているとした。被害を受けた場合の所管省庁や警察への通報、相談を呼びかけ(出典: 18, 19)
          10月7日	個人情報保護委員会	第371回委員会で注意喚起とWARNING改訂を議題とし、同日公表(出典: 4, 5, 6)
          10月8日	警察庁長官	定例会見で、現時点で事案の背景や相互の関連性は明らかではないとしたうえで、捜査を推進し実態解明を進める必要があると述べた。金融機関などでの本人確認の徹底が重要だと指摘(出典: 21, 22)
          同日	首相	衆院本会議の代表質問への答弁で、国家サイバー統括室を中心に情報を整理、分析し、幅広い事業者に注意喚起を行う方針を示した(出典: 17, 23)
          同日	政府	全府省庁を集めた関係省庁会議を開催。被害状況や攻撃手法の情報を国家サイバー統括室に集約し、事業者への注意喚起を出す方針(出典: 11, 24, 25)
          同日	JPCERT/CC、警察庁	注意喚起を公表(出典: 7, 8)
          10月9日	自由民主党	午前に開いた国家サイバーセキュリティ戦略本部の会合で、政府から現状の説明を受け、侵入後に大量流出の前に検知して被害を抑える手法の共有などを要請(出典: 28, 29)
          同日	総務大臣	閣議後会見で、所管の事業者と地方公共団体を対象に同日注意喚起を行うと説明(出典: 11)
          同日	経済産業大臣	閣議後会見で、所管の約1000の業界団体を通じて注意喚起を行うと説明(出典: 26)
          同日	金融担当大臣	閣議後会見で、本人確認はICチップ情報の読み取りで行うなど適切に実施する必要があると述べた(出典: 27)
          同日	国家サイバー統括室、総務省、経済産業省、IPA、金融庁	注意喚起を公表(出典: 9, 10, 12, 13, 14)
          同日	個人情報保護委員会	注意喚起の掲載ページに解説動画を追加(出典: 4)
          デジタル大臣は10月2日の会見で、個人情報取扱事業者等での、不正アクセスによる攻撃を含む、不正の目的をもって行われたおそれによる漏えい等の件数について、令和6年度は7,604件、令和7年度は3,822件と説明した。このことから「必ずしも増加傾向にあるわけではない」と考えているとしたうえで、件数自体は多数みられており、今後の動向には注意が必要だとした。(出典: 2)

          運転免許証の画像が流出した事案を受けて、複数の県の公安委員会が運転免許証の再交付に応じている。住所変更や紛失などの場合に限られる再交付を、情報が流出した可能性がある人を対象に認める運用で、愛知県は10月1日、新潟県は10月2日に始めた。再交付では顔写真と免許証番号を変更できる。(出典: 20, 30)

          各機関の注意喚起
          各機関が公表した注意喚起や依頼の宛先と、求めた内容を整理する。(出典: 3, 4, 5, 7, 8, 9, 10, 12, 13, 14)

          日付	機関	宛先	求めた内容
          10月6日	デジタル大臣(記者会見)	国民	パスワードの使い回しをやめる、多要素認証の利用、不審なメールやSMSへの注意
          10月7日	個人情報保護委員会	個人情報取扱事業者	別紙に示した技術的安全管理措置を踏まえた取り扱い、不要な個人データの消去、WARNING改訂版の参照
          10月8日	JPCERT/CC(9日に更新)	国内組織	攻撃手法と痕跡に基づく点検、API経由のアクセスへの対策、具体的な情報の提供
          10月8日	警察庁	個人、企業や団体、本人確認を行う事業者	基本的なセキュリティ対策の再確認、本人確認の徹底
          10月9日	国家サイバー統括室	大量の個人情報や機微な情報を扱う事業者等、経営層	ウェブシステムの管理、サプライチェーン、データ管理の対策の検討、被害組織による技術的な情報の共有
          10月9日	総務省	所管事業者と関係団体、事業者	国家サイバー統括室と同内容の注意喚起、経営層のリーダーシップによる対策の強化
          10月9日	経済産業省	関係各位(情報提供の依頼は所管業界の事業者)	国家サイバー統括室、JPCERT/CC、個人情報保護委員会の注意喚起の参照、サプライチェーン全体での対策、被害発生時の情報提供
          10月9日	IPA	経営者	外部公開アプリケーション等の点検、対策の見直し
          10月9日	金融庁	金融機関等	サイバーセキュリティ対策の点検、非対面の本人確認の徹底
          個人情報保護委員会の注意喚起は、2026年9月16日の第369回委員会で決議した個人情報保護法ガイドライン別添(安全管理措置)の見直し予定の内容を先取りして、別紙で技術的安全管理措置を示したもの。見直しの内容の確定は2027年4月を予定している。(出典: 4)

          金融庁は、2027年4月1日施行の犯罪収益移転防止法施行規則の改正で画像送信を受ける方法が廃止され、ICチップ情報の読取に原則一本化されることについて、施行日を待たず可及的速やかに対応するよう求めた。(出典: 14)

          国家サイバー統括室は、経営層に対し、サイバー攻撃の手法がAIの悪用を含めて高度化、巧妙化しているとして、対策を経営課題と位置づけるよう求めている。*2 (出典: 9) 経済産業省は、被害発生時に提供された情報を事業者の同意なく公表しないとしている。(出典: 12)

          対策項目ごとに見た各機関の記載
          各機関の文書が挙げた対策を項目ごとに整理し次の表にまとめた。総務省、経済産業省、金融庁は国家サイバー統括室などの文書を参照させる形をとっており、表ではそれぞれの文書自体に記載がある項目に○を付けている。各組織における項目詳細は出典先を参照のこと。(出典: 4, 5, 7, 8, 9, 10, 12, 13, 14) *3

