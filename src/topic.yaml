      ナクソス・ジャパンは10月8日16時30分現在のお知らせで、「ナクソス・ミュージック・ライブラリー」と公式サイトにアクセスできない状態が続いているとし、代替環境での再開準備を進めているとした(出典: 111)。10月9日の第2報では、日本語版の復帰まで「1～2週間程度」を見込むとした(出典: 112)。ナクソス・ミュージック・ライブラリーを利用者に提供している堺市立図書館や国立音楽大学附属図書館などは、同ライブラリーの障害により利用できないと公表している(出典: 113, 114)。

