          漏えいした情報の悪用を防ぐ	○	○	○	○	○			○
          委託先を含めて管理する	○			○	○	○	○	○
          経営層が関与する	○			○	○	○	○	○
          被害や攻撃に関する情報を提供、共有する		○		○		○		
          各組織発出内容を横断的にまとめた推奨策は以下の通り。

          推奨策(1) 直近1カ月のログから点検を始める
          IPAは「速やかに行うべき点検」として、外部公開しているアプリケーションと利用している外部サービスのログを挙げる。(出典: 13)

          直近1カ月、その後3カ月と段階的に対象範囲を広げてログを確認する。異常の見分け方はエラーの出力量や平時との差異など(IPA、外部公開しているアプリケーションについて)(出典: 13)
          ログイン失敗の量のほか、ログイン元IPアドレスやログイン時間等を平時と比較し、作ったはずのないアカウントや、無効化されているはずのアカウントの有効化がないかを確認する(IPA、利用している外部サービスについて)(出典: 13)
          不審な通信や大量のアクセスの痕跡がないか、アクセスログ等を点検、分析する(国家サイバー統括室、推奨)(出典: 9)
          ログを定期的に分析し、不正アクセスの発生や兆候を早期に検知する(個人情報保護委員会の別紙、手法の例示)(出典: 4)
          専門家の共同資料は、直近1か月を目安としたアクセスログの点検で調べる動きとして、次などを挙げる。(出典: 15)

          同じIPアドレスからのAPIへの大量アクセス
          403、404、503などのエラー応答の急増
          一般利用者に許していない管理機能の利用
          データベースの高負荷やセッションの大量消費が、アクセスの増加などと同時に起きていないか
          ログイン試行の増加
          JPCERT/CCは、ケースAからDそれぞれに不審な送信元IPアドレスを掲載し、ケースBとCにはUser-Agentの例も載せている。10月9日にはケースAとBのIPアドレスの追加とケースDの追記があり、侵害調査への活用を呼びかけている。10月9日の更新時点で掲載されているものは次のとおり。ケースBとCのIPアドレスには「調査時点では正規利用されている可能性もあります」との注記が付く。(出典: 7)

          ケース	不審な送信元IPアドレス	悪用、観測の時期
          A	20.210.128[.]125	10月7日ごろ
          B	3.112.252[.]14、54.95.112[.]6、69.10.51[.]162、172.86.91[.]7、210.149.87[.]120	9月ごろ
          B	136.117.40[.]140、136.85.58[.]5	8月28日ごろ(10月9日追記分)
          B	31.76.91[.]2、141.11.187[.]186、207.241.172[.]54	10月9日追記分
          C	213.163.202[.]171、221.216.140[.]49、221.216.140[.]129	8月上旬から9月上旬
          D	124.133.237[.]18	9月ごろ
          User-Agentの例は次のとおり。(出典: 7)

          ケースB
          curl/7.88.1
          python-requests/2.34.2
