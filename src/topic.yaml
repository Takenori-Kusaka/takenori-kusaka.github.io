      2026年ノーベル化学賞について分かりやすく解説！『不斉有機合成における非線形効果と自己触媒作用の発見』
      2026.10.09





      #化学 #論文・論文解説 #生物・動物 #ノーベル賞 #彩恵りりの科学ニュース解説！ #有機化学
      2026年ノーベル化学賞サムネ
      (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 画像引用元)

      

      みなさんこんにちは！サイエンス妖精の彩恵りりだよ！

      今回はみんな大注目！2026年ノーベル化学賞の解説だよ！

      まず、今回の受賞者と授賞理由は以下の通りだよ！

      

      2026年10月7日

      スウェーデン王立科学アカデミーは、2025年のノーベル化学賞を以下の者に授与することを決定した。

      

      アンリ・B・カガン (Henri B. Kagan)
      パリ第11大学、フランス共和国

      硤合憲三 (Kenso Soai)
      東京理科大学、日本国

      「不斉ふせい有機合成における非線形効果と自己触媒作用の発見」に対して。

      

      彼らは化学に鏡像を選ばせた
      アミノ酸など、いくつかの分子は、互いに鏡像関係にある2種類の異性体として存在する。しかし、生物はこれらの鏡像のうち1つしか持っていない。このような化学的な非対称性がどのようにして生じたのかは、化学者にとって長らく謎だった。アンリ・B・カガンと硤合憲三は、この謎の解決策を見出した功績により、2026年のノーベル化学賞を授与された。

      

      

      Henri B. Kagan
      (Illustration: Niklas Elmehed / Credit: Nobel Prize Outreach / 画像引用元)

      Henri Boris Kagan (アンリ・ボリス・カガン)
      フランス共和国、ブーローニュ=ビヤンクール出身
      1930年12月15日生まれ (95歳)
      パリ第11大学 (フランス共和国) 所属
      賞への貢献度: 1/2

      

      硤合憲三
      (Illustration: Niklas Elmehed / Credit: Nobel Prize Outreach / 画像引用元)

      硤合 憲三 (そあい けんそう)
      日本国、広島県出身
      1950年5月3日生まれ (76歳)
      東京理科大学 (日本国) 所属
      賞への貢献度: 1/2

      

      

      CONTENTS

      鏡映しの片方だけを得る方法はノーベル賞級
      なぜ生命では、ほぼ片方の分子しか見られない？
      カガンさんが発見した「非線形効果」とは何か
      反応の名前にもなった硤合さんの「正の非線形効果を持つ不斉自己触媒作用」とは
      生命のホモキラリティーの起源の解明ではないが、重要なヒント
      硤合反応のような反応の応用はこれから
      鏡映しの片方だけを得る方法はノーベル賞級
      キラリティーとは何か
      分子の形を見てみると、どのように動かしてもぴったり重ならない関係の分子があるのよ。まるで右手と左手がぴったりと重ならないようなもので、この鏡映しの関係にある分子のことをキラリティーと呼ぶのよ。そしてどちらか片方のキラルな分子に偏っていることをホモキラリティーと呼ぶんだけど、生命はホモキラリティーの例の1つなのよね。 (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 日本語訳は筆者 (彩恵りり) による / 画像引用元)

      

      私たちの両手を見てみると、右手の形と左手の形はよく似ているよね？　でも、右手をどのように動かしても、左手とぴったり重ねることはできないよね？　これは、右手と左手が鏡像、つまりは鏡映しの関係にあることを反映しているのよ。

      

      実はこの鏡映しの関係は、分子の世界にもあるのよね。これは「キラリティー (対掌性たいしょうせい)」と、ずばり掌=手のひらが含まれる単語で表されるのよ。キラリティーな関係にある分子は、原子の種類や数や構造など、他の性質は全て一緒なんだけど、全体の形は鏡映しの関係にあり、決して同じような見え方をすることがないのね。

      

      とはいえ、分子が肉眼で見えない私たちにとっては、これを意識する場面はあまりないのよね。キラリティーな性質を持つ分子を「キラルな分子」と呼ぶんだけど、キラルな分子はお互いの形が鏡映しであること以外は、化学組成、融点や沸点、溶解度、密度、熱伝導率など、ほぼ全ての性質が一緒だからね。

      

      ただ、キラルな分子には無視できない重要な違いもあるのよ。1つは結晶構造とそれに伴う光学特性なんだけど、今回は割愛して大丈夫なので深くは触れないよ。もっと重要なのは化学反応で、特に生命が分子を利用する生化学反応において、分子のキラリティーの性質が重要な違いを示すのよ。

      

      生体内には、身体を作ったり化学反応を調整するタンパク質や酵素、遺伝情報を保持・伝達するのに不可欠なDNAやRNAなどがあるけど、これらを作る糖やアミノ酸は、やはりキラルな分子であり、全く同じ化学組成の分子でも、鏡映しの関係にある分子が存在することになるのよ。

      

      化学の世界では、キラルな分子を区別するために右手型とか左手型、あるいはアルファベットで表現をするのよね。んで生物の体内を調べてみると、糖に関してはほぼ右手型だけが、アミノ酸に関してはほぼ左手型だけが見つかるのよね。全くゼロというわけではないけど、ほぼ片方しかないと言っていいくらいの偏りなのよ。

      

      では、自然界は最初から片方の分子の形しか作らないのかというと、全然そんなことは無いのよ。何の工夫もしないまま、普通に有機分子を化学合成してみると、両方の形が同じ量だけできちゃうのよね。これは実験室の人工環境だけでなく、生命が介入しない形での自然界の化学反応でも同じことが起きるのよ。

      

      一方で、生命が介入する化学反応では、片方の形の分子しか利用せず、片方の形の分子しか作らない、ということが観察されるのよね。このように、キラルな分子の片方に偏っているのを「ホモキラリティー」と呼ぶのよ。生命が利用する有機分子のほぼ全ては片方に偏っていることから、生命はホモキラリティーと呼ばれるのよね。

      

      この、有機分子は工夫しないと両方の形ができてしまうという性質は、特に医薬品業界では難題になってくるのよね。ヒトもキラルな分子のうちの片方しか利用できないので、医薬品の中に両方の形が混ざっていたとしても、そのうちの片方しか薬として効果を発揮しないのよね。

      

      むしろ、薬として効果を発揮しない方がマシまであるのよ。例えば1960年代初頭に世界中で問題となった睡眠薬「サリドマイド」の薬害は、サリドマイドの分子の片方は催眠作用を持つのに対し、もう片方は胎児に対する催奇性を持っていることが問題だったのよね。

      

      一応サリドマイドは、たとえ片方だけ投与しても体内でもう片方の分子へと変化してしまうという、キラルの重要性を説明する上では例外的な性質があることには注意しないといけないよ。ただそれでも非常に有名な例であり、有機化学、特に医薬品におけるキラリティーの区別の重要性に、しばしば引用される例となっているのよね。

      

      少し前まで科学者は、キラルな分子の片方だけを効率的に合成するには、細菌などの生命に作ってもらうしかなかったのよね。しかし、生命を全く使わず、人工的にキラルな分子の片方だけを効率的に合成する「不斉ふせい反応 (不斉合成反応)」という手段が次々と見つかり、キラルな分子の片方だけを自由に作り出すことが可能になったのよ。

      

      不斉反応は有機化学における重要性と、方法を確立する難易度の高さから、何か新しい発見があると注目されるのよね。不斉反応に直接関わるものだけでも、今回を含めて3つのノーベル化学賞が授与されていることを見れば、どれだけ重要で難易度が高いのか、ちょっと分かるかな？

      

      不斉反応に関連したノーベル化学賞
      年代	受賞者	授賞理由
      2002年	ウィリアム・K・ノールズ
      野依良治	不斉触媒を用いた水素化反応に関する研究
      K・バリー・シャープレス	不斉触媒を用いた酸化反応に対する研究
      2021年	ベンジャミン・リスト
      デイヴィッド・M・C・マクミラン	不斉有機触媒の開発
      2026年	アンリ・B・カガン
      硤合憲三	不斉有機合成における非線形効果と自己触媒作用の発見
      なぜ生命では、ほぼ片方の分子しか見られない？
      有機分子にはキラリティーがあるということは、19世紀に複数の科学者が指摘したのよ。特に重要なのはルイ・パスツールが1857年に指摘したもので、細菌は酒石酸という有機物の内、ある片方の種類しか利用しないという観察結果から、生命は有機分子の片方の形しか利用しないのではないかという理解が得られたのよ。

      

      19世紀末から20世紀初頭には、このようなキラリティーに関する最初期の研究が進み、不斉反応と見なされるものも報告されたのよね。特に重要視され、最初の不斉反応とも言われるのが、1904年にヴィリー・マルクヴァルトが見出した有機合成反応になるのよ。

      

      不斉反応
      キラルな分子が触媒となると、その形に対応したキラルな分子を多く生み出す傾向にあるのよね。これを不斉反応と呼ぶのよ。 (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 日本語訳は筆者 (彩恵りり) による / 画像引用元)

      

      マルクヴァルトが見つけた反応が重視されるのは、反応に「触媒」が関与しているからなのよね。触媒とは、自分自身は変化しないけど、化学反応の速度を速める物質のことを指す用語よ。マルクヴァルトが見出した反応では、金属原子 (金属イオン) に、キラルな分子の片方がくっついた形でできた触媒が、重要な役割を果たすのよ。

      

      マルクヴァルトは、このキラルな分子がくっついた触媒は、別の有機分子を合成する時、片方の形状を多く合成する性質を持つことに気付いたのよ。この偏りはわずかではあるんだけど、それでも生命を使わない形で、キラルな分子の片方を多く合成できた例として、歴史的なマイルストーンとして重要視されているのよ。

      

      1953年にはサー・フレデリック・チャールズ・フランクが、生命のホモキラリティーの起源について、物理学の知見から興味深い提言をしたのよね。今日では「フランクモデル」と呼ばれるこの提言は、自然界のほぼ偏っていない状態から、どのようにホモキラリティーが生まれるのを考察した理論モデルになるのよ。

      

      不斉触媒と不斉反応が存在する。キラルな分子の片方を多く作る化学反応が存在する。
      阻害剤が存在する。キラルな分子の片方を多く作る一方、もう片方が作られるのを抑える化学反応がある。
      自己触媒作用が存在する。化学反応で作られた分子自身が、その化学反応の触媒となる。
      

      フランクモデルの3つの条件のうち、最初の不斉触媒と不斉反応については、マルクヴァルトが見出したのが最初の例になるね。ただしこれは、キラルな分子の片方を多く作るには作るけど、その偏りはとても小さなもの。キラルの重要性が分かるにつれて、科学者はほぼ100%に偏った不斉反応が欲しくなったのよね。

      

      ただ、ちょっとした偏りならともかく、完全に偏っている反応となるとかなりの難題になってしまうのよ。有機化学における重要な反応でそれが見つかったのは、20世紀も後半になってからなのよね。その功績が認められたのが、先ほど挙げた2001年と2021年のノーベル化学賞というわけ。

      

      さらに、2番目や3番目の条件を満たすのはもっと大変だったのよ。3番目の自己触媒作用だけでみればいくらでも例があるんだけど、それはキラルの片方だけを生み出すような反応ではないのよね。特に、2番目と3番目を組み合わせた「不斉自己触媒作用」については、完全に前人未到の領域だったのよ。

      

      今回ノーベル化学賞を受賞したアンリ・B・カガンさんと硤合そあい憲三けんそうさんは、この前人未踏だった領域に切り込んだという功績が評価されたのよ。ここはノーベル財団の公式資料でも「生命の誕生以来、キラルではない分子の組み合わせから片方のキラルに偏った状態を生み出すことに成功した初めての事例」と紹介されているレベルなのよね！

      

      ただ、ここはノーベル財団の公式資料でも明記されていることなんだけど、カガンさんや硤合さんの研究は生命のホモキラリティーの起源に対する答えではない、という点に注意しないといけないのよ。これは後で詳しく説明するけど、カガンさんや硤合さんの研究はあくまでも「考えられる解決策の1つを提示した」というレベルなのよね。

      

      もちろん、ノーベル化学賞になるレベルだからスゴい研究には違いないよ。過去の地球で起きた、生命のホモキラリティーの起源となる化学反応を考察する上で、根本的な理解を深めるのに繋がるかもしれないからね。この研究を紹介する際、誇大広告になってしまうことに注意を促している、という感じの理解で良いと思うのよ。

      

      カガンさんが発見した「非線形効果」とは何か
      1人目のノーベル化学賞受賞者であるアンリ・B・カガンさんは、パリ第11大学に勤務しながら、不斉反応の改良に取り組んでいたのよね。この不斉反応の分野でしばしば使われているのは、マルクヴァルトが1904年に見出したもの同じ、金属原子とキラルな分子の片方をくっつけた、左右の区別がある触媒を使う反応になるのよ。

      

      このキラリティーが偏った触媒を使って反応を進めると、こんな傾向が見えてくるのよ。例えば、左手型の触媒が右手側の触媒より多い場合、生成物も左手型の分子が多く生成されるのよ。これは触媒のキラリティーの割合と、生成物のキラリティーの割合に関係性があることを示唆しているよね。

      

      多くの化学者は、この関係は線形関係であると考えていたのよ。先ほどの例で言うなら、左手型の触媒の割合と、左手型の生成物の割合は、どちらも単純な比例関係であると考えたわけ。なので例えば、純粋な左手型の生成物を得たいなら、非常に純度の高い左手型の触媒を用意してやればいいと、触媒の純度を高める研究を行ったのよ。

      

      しかし1960年代末より、この線形関係に疑問符が付くような反応がいくつか見つかったのよね。特に1976年にハンス・ワインバーグさんとベン・フェリンガさんが行った研究では、触媒にくっ付いているキラルな分子の組み合わせが、単純な線形関係ではない反応を生み出すのではないかという示唆を与えたのよ。

      

      カガンが発見した非線形効果
      アンリ・B・カガンさんは、これまで考えられてきた単純な比例関係ではなく、キラルな分子の片方に偏るような反応の進み方があるのを発見したのよ。これを非線形効果と呼ぶのよね。 (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 日本語訳は筆者 (彩恵りり) による / 画像引用元)

      

      このような状況の中でカガンさん達の研究チームは、1986年に金属原子にくっつくキラルな分子に注目し、研究を行ったのよね。カギとなるのは、金属原子にくっ付く分子の数。もしも金属原子にくっつく分子が1つなら、触媒は左手型か右手型の2種類しかないよね。では、金属原子にくっつく分子が2つならどうなるだろう？

      

      金属原子にくっ付く分子が2つの場合、「右手型が2個くっついたもの (MLRLR)」「左手型が2個くっついたもの (MLSLS)」に加え、「右手型と左手型が1個ずつくっついたもの (MLRLS)」が生まれるよね？　同じものが2個くっついたものは「ホモキラル錯体」、違うものが1個ずつくっついたものは「ヘテロキラル錯体」と呼ばれるよ。

      

      ホモキラル錯体とヘテロキラル錯体の触媒としての働き (触媒活性) を調べてみると、両者は異なる働きをすることもあると分かったのよ。ホモキラル錯体よりもヘテロキラル錯体の方が触媒としてよく働く場合もあれば、逆にヘテロキラル錯体よりもホモキラル錯体の方が触媒としてよく働く場合もあるわけ。

      

      そして、ホモキラル錯体はほぼ片方の分子しか生み出さないのに対し、ヘテロキラル錯体はキラリティーが偏っていないので両方の分子を同じ割合で生み出すのよね。ってことは、両方を等しく生み出すヘテロキラル錯体の働き方次第で、生成物のキラリティーの偏りが触媒のそれを上回ることもあるわけよ。

      

      もしもヘテロキラル錯体の方が良く働くなら、ホモキラル錯体の割合から予想されるよりも生成物のキラリティーの偏りが低くなるはず。逆ならば予想よりも生成物のキラリティーの偏りが大きくなるはず。カガンさんはいくつかの実験でこれを見出し、これは後に「非線形効果」と名付けられたのよ！

      

      非線形効果
      触媒中のキラルな分子の割合と、生成物中のキラルな分子の割合は線形関係、つまりは単純な比例関係であると思われていたのよ。ところがアンリ・B・カガンさんの発見は、必ずしもそうではないことを見出したのよ。線形関係からズレるから非線形効果と呼ぶのよ。 (Credit: C. Puchot, O. Samuel, E. Dunach, S. Zhao, C. Agami & H. B. Kagan / 引用元: Journal American Chemical Society (1986) 108 (9): 2353–2357. / 日本語訳は筆者 (彩恵りり) による)

      

      カガンさん達は実際に1986年時点で、非線形効果を示す3の反応を示したのよね。まず、スルフィドの不斉酸化とL-プロリン触媒のヘイオース・パリッシュ反応という2つの反応では、生成物のキラリティーの偏りが低くなる「負の非線形効果」が起こることを示したのよ。

      

      一方でシャープレス不斉エポキシ化という反応では、生成物のキラリティーの偏りが高くなる「正の非線形効果」が起こることも見つかったのよね。正負両方の非線形効果の例を見出したことで、非線形効果と呼ばれる作用の存在を示し、どのようにしてこれが起こるのかの説明ができるようになったのよ！

      

      カガンさんや他の化学者はその後、分子が2個ではなく3個や4個の例も見つけたり、あるいは「リザーバ効果」と呼ばれる便利な性質や、非常に例外的ながら「超正の非線形効果 (Hyperpositive non-linear effect)」と呼ばれる極端な例まで見つけたのよね。

      

      この非線形効果が威力を発揮した例の1つは、メルク社が開発した「L-699392」と呼ばれる医薬品なのよね。これはロイコトリエン受容体拮抗薬 (体内のアレルギー反応を抑え、喘息による咳の発作などを起こりにくくする薬) として強力に作用することが知られているのよ。

      

      このL-699392を合成する際の反応の1つで非線形効果が強力に効果を発揮し、キラリティーの偏りが70%くらいの触媒を使っても、生成物のキラリティーの偏りは97.5%に達するのよ！　純度が低めの触媒から高純度な分子を得られることは、化学工業において非常にインパクトの高いものになるのよね。

      

      反応の名前にもなった硤合さんの「正の非線形効果を持つ不斉自己触媒作用」とは
      ここで話をちょっと元に戻すよ。化学反応における触媒とは、なにも生成物と違う分子である必要はないのよね。一部の反応では、生成物自身が触媒として働くという「自己触媒作用 (自触媒作用)」があるのよ。この自己触媒効果が起きる反応を「自己触媒反応」と呼ぶのよ。

      

      自己触媒作用そのものはたくさん例があるけど、これがキラルの分子の片方に偏っている例、つまり「不斉自己触媒作用」と呼べるようなものは、後で説明するように硤合さんが実例を見つけるまでは無かったのよ。ただ、硤合さんより以前にも、それに近い答えを見出した人がいるのよね。

      

      例えば1988年の小国信樹さん達の研究チームによる正の非線形効果の反応に関する報告や、1989年のアルバート・H・アルバーツさんとハンス・ワインバーグさんによる不斉自己触媒作用と大枠は似ている反応の報告により、ワインバーグさんは、小国さんが見つけた反応の応用で不斉自己触媒作用が見つかるのではないかと予想したのよ。

      

      硤合反応 硤合憲三さんが発見した硤合反応は、キラリティーがほとんど偏っていない状態から100%近くまで偏らせる反応なのよね。これは史上初の正の非線形効果を持つ不斉自己触媒作用の例になるのよ。 (Credit: The Royal Swedish Academy of Sciences / Illustration: Johan Jarnestad / 日本語訳は筆者 (彩恵りり) による / 画像引用元)
      

      そんな状況の中で、2人目のノーベル化学賞受賞者である硤合憲三さんは、最初の重要なステップとなる反応を見つけたのよ。1990年に硤合さんは他の人たちと協力し、キラルな分子の構造を持つある種のアルコール分子を含んだ触媒を使って反応を進めたところ、全く同じ構造を持つ分子が生成することを見出したのよね。

      

      硤合さん達は、この反応では不完全ながらも、触媒のキラリティーと生成物のキラリティーが一致すること、つまり不完全ながらも不斉自己触媒作用にかなり近い反応が起きていることを見出したのよね。この成果を足掛かりに硤合さん達は、不斉自己触媒作用を示し、さらに正の非線形効果を持つ例を探したのよ。

      

      1995年、まさにそのような例が見つかったのよ。「5-ピリミジルアルカノール」というキラルな分子は、ピリミジン-5-カルバルデヒドにジイソプロピル亜鉛をくっつける反応を促進する触媒になるのよね。そして、この反応では5-ピリミジルアルカノール、つまり触媒自身も生成されるのよね。

      

      反応のスタートとして、5-ピリミジルアルカノールの右手型と左手型の割合を、完全な半々から5%だけ偏った状態である52.5:47.5の比率からスタートしたのよ。すると生成物は77.5：22.5の比率と、大幅に偏ったのよね！　この反応は最終的に95.0：5.0の比率、つまり片方が90%多い状態で頭打ちになるまで純度を高めることができたのよ。

      

      この反応は、史上初の正の非線形効果を持つ不斉自己触媒作用の例であり、こんにちでは「硤合反応 (Soai反応)」と呼ばれているのよ！　化学反応に人の名前が付くというのは、それだけ化学の分野でこの反応が重要視されていることの表れなのよ！

      

      ただ、硤合反応そのものは確かにものすごい発見で、フランクさんが提唱したフランクモデルの未解決のピースを埋めるものではあったんだけど、片方のキラルな分子にほぼ100%偏っているとまでは言えないのよね。これは生命のホモキラリティーと比べればまだまだ純度が足らないのよね。

      

      硤合反応の発見から8年後の2003年、正の非線形効果を持つ不斉自己触媒作用としては最も極端な例を見つけたのよ。この時に見つけた反応では、ほぼ完全な半々な状態からスタートし、かなり高純度な片方のキラルな分子を得ることに成功したのよ！

      

      2003年に発見された反応では、初期状態での差が200万分の1だけという、ものすごく半々に近い状態からスタートしたんだけど、たった3回で99.75%以上まで純度を高めることに成功したのよ。キラルな分子同士のほんのわずかな濃度差を増幅させ、最終的には濃度差を63万倍にまで高める極端な反応なのよね！

      

      生命のホモキラリティーの起源の解明ではないが、重要なヒント
      再度注意するんだけど、カガンさんが発見した非線形効果や、硤合さんが発見した不斉自己触媒作用は、生命がなぜ片方のキラルな分子しか使わないのかという「生命のホモキラリティーの起源」を考察する上で重要な発見ではあるんだけど、その受け止め方に注意しないといけないのよね。

      

      確かにノーベル財団の公式資料では「生命の誕生以来、キラルではない分子の組み合わせから片方のキラルに偏った状態を生み出すことに成功した初めての事例」という紹介の仕方をしていて、カガンさんや硤合さんが発見した化学反応がタダものではないことを示しているのは確かよ。

      

      ただ、これまでに見出された硤合反応のような正の非線形効果を持つ不斉自己触媒作用は、あくまでも人工的な反応なのよね。生命の生体内で起こる反応とはかけ離れているし、何よりアミノ酸や糖を作る反応ではないのよね。アミノ酸や糖における、正の非線形効果を持つ不斉自己触媒作用を持つ反応は未発見なのよ。

      

      また、生命のホモキラリティーの起源が、必ずしも硤合反応のような正の非線形効果を持つ不斉自己触媒作用であると証明されたわけでもないのよね。私たちが気づいていないだけで、他の理由でホモキラリティーが生じた可能性は否定されていないことにも注意なのよ。ノーベル財団も「答えではない」と言ってるのよね。

      

      とはいえ、キラリティーな性質を持つ物質が天然に豊富にあることは、硤合反応のような反応が生命のホモキラリティーの起源に関与している可能性を期待させるのも事実なのよね。例えば有機分子に限らず、天然の無機鉱物にもキラリティーな性質があるので、無機物が不斉反応の触媒になった可能性があるからね。

      

      また、マーチソン隕石のような太陽系初期の情報を保持している物質を分析すると、生命が生まれる前から、アミノ酸にわずかなキラリティーの偏りがあることが見つかっているのよね。硤合反応のような反応が、このわずかな偏りを増幅させ、生命のホモキラリティーの起源になる可能性は否定されないのよ。

      

      なので現在では、硤合反応のような正の非線形効果を持つ不斉自己触媒作用は、生命のホモキラリティーの起源に関する重要なモデルとなっているのよね。現時点では“起源を解明した”と言ったら言い過ぎなんだけど、起源を考える上での重要なカギとなっているのは事実なのよ。

      

      硤合反応のような反応の応用はこれから
      もちろん、仮に正の非線形効果を持つ不斉自己触媒作用が生命のホモキラリティーの起源ではなかったとしても、この発見は色褪せないのよね。むしろ生命のホモキラリティーの起源の答えが全然出ていない以上、具体的な応用を検討する方がずっと重要なのよね。

      

      先ほどのL-699392は非線形効果を応用した例だけど、不斉自己触媒作用に関する応用例も既にあるのよ。例えば「エファビレンツ (Efavirenz)」という薬は、AIDS (エイズ) の予防に用いられる抗レトロウイルス薬なんだけど、これもキラリティーを持つ分子なのよね。

      

      2011年に発表された研究では、不斉自己触媒作用を使って、エファビレンツの合成効率を改善したというものがあるのよ！　これはエファビレンツ自体ではなく、エファビレンツを合成する途中のキラリティーを持つ分子の合成効率を、不斉自己触媒作用を使って改善したという報告に当たるのよ。

      

      一方で、硤合反応のような正の非線形効果を持つ不斉自己触媒作用を使うようなものになってくると、まだちょっと大きな応用例を提示できないのよね。現在は、正の非線形効果や不斉自己触媒作用に関する、理論的にまだ理解や説明されていない謎の解決を進める作業の段階にあるのよ。

      

      特に、スコット・デンマークさん達やオリバー・トラップさん達の研究チームは、硤合反応のような反応を理論的に説明をするモデルを提唱しているのよ。興味深いことに、カガンさんやフランクさんが提唱した機構に対し、デンマークさん達のモデルは一致するのに対し、トラップさん達のモデルは一致しないという違いも見られるのよ。

      

      いずれにしても、硤合反応のような反応の理解を深めることは、今後の具体的な応用例に生かす幅も広げるし、もしかすると生命のホモキラリティーの起源という大きな謎を解決するための、何か重要なヒントが隠されているかもしれないのよね。

      

      そういう意味では、私が思うに今回のノーベル化学賞は、硤合反応がいかに重要な発見であるかを示すと同時に、これからの発展可能性が大いに期待されているものだと考えるのよ。

