      さくらインターネットと各社の対応——CVE-2026-99999 の告知に書かれたこと
      停止範囲は冒頭の表のとおりで、再開はいずれも未定です。ほかの告知の内容は次のとおりです。

      対象	告知の内容	確認の方法
      さくらのクラウド全体	ホストメンテナンスを含む対応をする可能性があり、実施時は個別に案内	さくらの告知
      専用サーバ PHY など OS を利用者が持つもの	OS やカーネルの版・構成によって影響を受けうる。OS ベンダーの情報を見て更新するよう案内	さくらの告知
      会社の告知は「影響の有無および影響範囲の確認を進めて」いるとし、レンタルサーバの告知は停止を「影響調査および必要な対応のため」とします。新規だけを止めた技術的な理由は書かれておらず、当サイトも推測しません。

      ・既存の契約はそのまま動くと告知されている。解約や移行を急ぐ根拠は告知には無い
      ・ホストメンテナンスの個別案内が届くよう、連絡先メールを確かめる
      ・専用サーバ PHY で仮想マシンを動かしているなら自分がホストの立場。次の節の修正版へ
      ・レンタルサーバの OS は FreeBSD で（8月の記事で確認）、利用者はカーネルを更新できない

