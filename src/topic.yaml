      NASA（アメリカ航空宇宙局）は2026年9月24日付で、アメリカのSpaceX（スペースX）社が運用する「Crew Dragon（クルードラゴン）」宇宙船によるISS（国際宇宙ステーション）への有人宇宙飛行ミッション「Crew-14（クルー14）」に割り当てられた4名の宇宙飛行士を発表しました。

      このうち1名はJAXA（宇宙航空研究開発機構）の諏訪理宇宙飛行士で、他の3名とともにISSで長期滞在を行います。諏訪宇宙飛行士にとって初の宇宙飛行となります。

      諏訪宇宙飛行士ら3か国の4名がISS長期滞在へ
      Crew-14のクルーは、コマンダーを務めるNASAのKayla Barron宇宙飛行士、パイロットを務めるNASAのChris Birch宇宙飛行士、ミッションスペシャリストを務めるJAXAの諏訪理宇宙飛行士およびRoscosmos（ロスコスモス）のArutyun Kiviryan宇宙飛行士です。

      有人宇宙飛行ミッション「Crew-14」のクルー。左から：RoscosmosのArutyun Kiviryan宇宙飛行士、NASAのChris Birch宇宙飛行士、NASAのKayla Barron宇宙飛行士、JAXAの諏訪理宇宙飛行士（Credit: SpaceX）
      【▲ 有人宇宙飛行ミッション「Crew-14」のクルー。左から：RoscosmosのArutyun Kiviryan宇宙飛行士、NASAのChris Birch宇宙飛行士、NASAのKayla Barron宇宙飛行士、JAXAの諏訪理宇宙飛行士（Credit: SpaceX）】
      諏訪宇宙飛行士は米田あゆ宇宙飛行士とともに、2023年にJAXAの宇宙飛行士候補者として選抜。基礎訓練を経た2024年10月に、宇宙飛行士として認定されました。2026年1月にはJAXAがISS長期滞在搭乗員に指名したことを発表しており、諏訪宇宙飛行士はミッションに向けて訓練を重ねていました。

      JAXA諏訪理宇宙飛行士が初の宇宙飛行へ　2027年頃のISS長期滞在搭乗員に指名（2026年1月11日）
      NASAのBarron宇宙飛行士はアメリカ海軍出身で、今回が2回目の宇宙飛行です。前回はNASA「Crew-3」ミッションのミッションスペシャリストとしてCrew Dragonに搭乗し、2021年11月～2022年5月にかけてISSで長期滞在を行いました。

      米欧の宇宙飛行士4名を乗せたクルードラゴン「エンデュランス」地球へ帰還（2022年5月12日）
      他の2名はいずれも今回が初の宇宙飛行です。NASAのBirch宇宙飛行士はカリフォルニア大学リバーサイド校などで教壇に立つかたわら、自転車競技のアメリカ代表としても活躍した経歴を持ち、2021年に宇宙飛行士として選抜されました。RoscosmosのKiviryan宇宙飛行士はロケット工学のエンジニアで、2021年に宇宙飛行士として選抜されました。

      Crew-14の打ち上げは2027年春以降
      NASAによると、Crew-14のCrew Dragon宇宙船は2027年春以降に打ち上げられる予定です。

      なお、Crew-14に先立って実施される次の有人宇宙飛行ミッション「Crew-13」の打ち上げは、アメリカ東部夏時間2026年10月1日11時10分（日本時間翌2日0時10分）に予定されています。

      NASA有人ミッション「Crew-13」は2026年10月初旬打ち上げへ　宇宙船の不具合対策で先送り（2026年9月20日）
      

