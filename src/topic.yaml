      CVE-2026-99999（通称 PwnEscape）は、Linux カーネルの IPv4 処理でチェックサムの位置情報を確かめずに使い、ホストのネットワークヘッダを書き換えてしまう欠陥です。ゲストが細工したパケットを送るとホストのメモリが漏れ、条件がそろえばホストでコードを実行できると報告されました。カーネルの CNA は CVSS 3.1 で 9.3 を付けています。10月16日にさくらインターネットがサービスごとに新規の受付を止め、ほかの事業者もホストのメンテナンスを告知しました。修正版の一覧と、各社の告知、自分の環境で確かめる手順をまとめます。

