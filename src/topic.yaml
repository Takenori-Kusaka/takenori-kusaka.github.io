        入館証お渡し
        持ち物検査を受けたあと、館内で体験展示などに利用する入館証（※2）を受け取ります。入館証は館内で必要になるので、なくさないようにしてください。

        ※1事前にチケットを分配すれば、それぞれのスマートフォンにQRチケットを表示することもできます。

        ※23歳以上の未就学児の方には、入館証の代わりとなる「体験カード」をお渡しします。

