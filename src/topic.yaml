        AIペネトレーションテストツール「ARTEX」についてまとめてみた
        AI ペネトレーション
        2026年10月2日、韓国のセキュリティ企業の研究者が、韓国国内の複数の対象への攻撃で使われたウェブサーバーの一部のHTMLから「ARTEX」の名を含む文字列が確認されたとSNSに投稿しました。ARTEXはGitHubで公開されていたAIペネトレーションテストツールです。ここでは関連する情報をまとめます。

        ARTEXとは
        ARTEXは、開発者がGitHubで公開していたオープンソースのAIペネトレーションテストツール。READMEは「AI 自主渗透测试系统」と称し、LLMとマルチエージェントで動く自律型のペネトレーションテストシステムと説明していた(出典: 3)。構成はGoのバックエンド(Next.jsのフロントエンドを内蔵した単一バイナリ)とPostgreSQLで、利用者が目標と許可範囲を与えると、実際のレッドチームのように自ら計画を立て、子タスクを割り当てて実行すると開発者は説明していた(出典: 1, 3)。

        設計上の特徴として、開発者は次の点を挙げていた(出典: 1, 3)。

        資産グラフと探索グラフ: 全タスクで共有する資産と、タスクごとの探索の進み具合を2つのグラフで管理する
        planner と worker: planner が次に実行する作業(意図)を生成し、worker が意図を1件ずつ実行して結果を書き戻す
        通信の記録: 通信を記録型のプロキシ経由にし、エージェントが記録を検索して問題を探せるようにする
        承認ゲート: ツールの呼び出しを規則に基づいて許可、拒否、確認のいずれかにする
        人の介入: 実行中のタスクに人が対話で介入できる
        利用するLLMは、AnthropicとOpenAI、およびそれらの互換インターフェースに対応し、プロバイダーやモデル、接続先は画面で設定できるとしていた(出典: 1, 3)。

        ARTEXは、百度安全应急响应中心(BSRC)が立ち上げ、複数のセキュリティ対応センターが協力した「Agent+」攻防能力チャレンジで優勝したと発表されている。大会は8月5日にオンライン予選を開始し、150余チームが参加登録した。9月3日に成都で開かれた決勝は8チームで争われ、ARTEXが優勝した(出典: 6)。



        ツールの処理の流れ
        2か月で18版の更新
        開発者は2026年7月26日にGitHubへ初回コミットを入れ、同日v0.1.0を公開した(出典: 2, 5)。翌27日にはGitHub上の別のリポジトリのIssueに自薦の投稿を行っている(出典: 1)。GitHubのリリースは、10月6日の時点で9月24日のv0.3.14までの18版だった(出典: 5)。その後、10月7日付のコミットにv0.3.15のタグが付けられている(出典: 16)。

        承認ゲートと通信の記録に関わる変更として、8月23日のv0.3.3で、規則に該当しない場合にモデルが許可、確認、拒否を判定する仕組みが加わった。9月17日のv0.3.12では、通信を記録するプロキシの既定の待受がローカルホストのみに変わった(出典: 4)。

        開発者が課していた利用制限
        READMEの「ライセンスと免責事項」(许可与免责声明)の節は、ARTEXの用途を「個人の学習、コード研究、ローカルの技術検証」に限り、許可の有無や自己資産かどうかを問わず、ウェブサイトやオンラインサービス、ネットワーク接続システムへのスキャン、探査、攻撃を禁じていた。実際のペネトレーションテストや本番環境での使用も認めていなかった(出典: 3)。

        使用に伴う法的責任は使用者が負い、作者と貢献者は「現状のまま(AS IS)」で提供するとして損害の責任を負わないとしていた。READMEはこれらを、ライセンスとは別の作者による追加の取り決めと声明と位置づけていた(出典: 3)。

        この節の文面は9月18日に整備され、同日にAGPL-3.0の採用を示すコミットが入った(出典: 2)。翌19日のv0.3.13では、利用制限に関わる次の変更が加わった(出典: 4, 5)。

        ログイン前に利用上の注意と免責事項のダイアログを表示し、同意のチェックがなければログインできない
        政府系(.gov、.gov.cn)と教育機関系(.edu、.edu.cn)のサイトを対象から外す遮断規則を既定で組み込む
        タスク単位の遮断と許可の規則を追加し、遮断の規則を許可の規則より先に判定する
        金融機関への攻撃との関係
        新韓銀行が国会に提出した資料では、攻撃者のIPが最初に流入したのは9月28日18時4分と推定され、攻撃は30日0時15分まで続いたとされる。国会議員の事務所が入手した資料では、KB国民銀行への攻撃は9月27日23時19分から29日18時まで続いたとされる(出典: 9)。

        韓国の金融機関で相次いだ不正アクセスをめぐり、ARTEXの名が公に挙がったのは10月2日。韓国のセキュリティ企業の研究者がLinkedInに投稿し、韓国国内の複数の対象への攻撃で使われたウェブサーバー(C2)の一部のHTMLに「ARTEX — 自主渗透测试控制台」という文字列が確認されたとした。研究者は、ARTEXが運用されたか、関連する環境が活用された可能性を示す核心的な根拠とみることができると述べている*1。(出典: 7)

        READMEは公開のデモサイトを案内していて(出典: 3)、この文字列はそのデモサイトのページの題名と同じだった。



        ARTEXのデモサイト画面

        金融保安院長は10月4日、金融業界の緊急点検会議の後に記者団へ語り、攻撃に使われたIPについて「銀行は同一だが、貯蓄銀行は異なる」と説明した(出典: 12)。4つの銀行ではほぼ同一のIPが、2つの貯蓄銀行では互いに類似したIPが確認され、2つのグループの間でIPに差がある(出典: 11)。院長はさらに「IPにARTEXの痕跡があった」と述べた。一方で、手口からAIを活用したと見ているものの、「エージェントを直接見たわけではないので確定はできない」とも述べている*2。(出典: 11)

        CrowdStrikeは10月7日、攻撃者が管理するインフラの公開ディレクトリからClaude Codeのセッション履歴やARTEXの設定ファイルなどが見つかったとするレポートを公表した。同社は、これらのファイルは9月下旬から10月上旬にかけて韓国の金融機関を狙った活動を示しており、対象は報道された組織と重なっているとしている(出典: 15)。

        同社によれば、攻撃者のインフラは2台のサーバーで構成され、香港にあるIPアドレスが主たるインフラ、別のIPアドレスでARTEXが動いていた。ARTEXは主たるバックエンドに1つのLLMを使い、攻撃者はこれを補う形で、追加のClaude Codeのセッションに別の2つのLLMを使っていたという(出典: 15)。

        同社はこの活動を特定の攻撃者には帰属させていない。攻撃者は中国語話者で金銭目的の可能性が高いと中程度の確度で評価しており、根拠は中国で開発されたARTEXの使用と中国語のプロンプトとしている*3。(出典: 15)


        piyolog.hatenadiary.jp


        インターネット上で観測された関連ホスト
        インターネット上のARTEXに関連するホストについては、次の観測が公表されている。

        韓国のセキュリティ企業オアシスセキュリティの観測によれば、2026年9月23日から10月3日に収集したデータで、インターネットに露出したARTEX関連のインフラのうち、同じサーバーの重複を除いた固有IPは359件。所在は14の国と地域にわたり、米国が236件、中国が53件、香港が39件の順に多く、韓国は4件(出典: 10, 13)。露出しているサービスがすべて悪性のインフラとは限らず、関連する痕跡が見つかったことだけでは金融機関への攻撃に使われたと断定はできないとされている*4。(出典: 10)

        Team Cymru Researchの観測によれば、ARTEXは52ホストで稼働している。いずれもLLM APIの中継サーバーとして設置されたホスト。うち40ホストは米国の隣接する2つの/24に並び、2ホストでは別の攻撃用ツールや偵察用ツールも動いている*5。(出典: 8)

        開発者はクローズドソース化を表明
        10月7日の時点で、ARTEXのGitHubリポジトリは公開されていた(出典: 3)。開発者はGitHubのプロフィールに10月8日付の声明「ARTEX 安全声明」を掲載し、次の3点を述べている(出典: 14)。

        攻撃は作者と無関係であり、ARTEXは学習と研究を目的に、企業や組織が許可を得た資産の範囲でセキュリティリスクをテストできるよう設計した
        悪用は意図に反しており、無許可や違法な使用の責任は負わず、強く非難する
        悪用の現実を踏まえ、プロジェクトを今後更新せず、クローズドソースにする。以後は版の公開も保守も行わない*6
        10月9日の時点で、リポジトリ、README、CHANGELOG、リリース一覧、デモサイトはいずれも閲覧できない。

