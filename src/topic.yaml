        *2:日本経済新聞はモーダルラボズのアカウントが攻撃通信の中継とデータ保存の両方に使われたと報じているが、OpenAI原文は4アカウントのうち1件を外部中継・ステージング用途、別の1件をデータ保管用途に区分しており、Modal Labsがどちらに対応するかは判然としない。

