        受付は先着順となりますので、体験を希望される方はお早めにご予約ください。

        ワークショップには花札をテーマにした「つくろう」「あそぼう」の2種類があります。

        ちょっと、花札をつくろう
        ちょっと、花札であそぼう
        館内２か所のインフォメーションカウンターで予約を受け付けています。
        ご予約方法について
        館内の移動はエレベーターで
        館内の移動はエレベーターで
        館内はエスカレーターや階段での移動のほか、エレベーターでの移動が可能です。ベビーカーや車椅子でお越しの際はエレベーターをご利用ください。

