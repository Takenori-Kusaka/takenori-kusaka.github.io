      層の分け方は当サイトの整理。欠陥の場所: CVE-2026-99999 の CVE レコード（2026-10-16 取得）
      30秒でわかる

      ・欠陥は KVM ではなくホストの IPv4 処理。ゲストが送ったフレームのチェックサム情報を、ホストが断片化のときに検証せず使う
      ・上流の修正版は 7.2.11 / 6.18.57 / 6.12.113 / 6.6.159 / 6.1.190 / 5.15.223 / 5.10.272（10月15日公開）。2.6.27 からのコードが対象
      ・ゲストを更新してもホストは直らない。クラウド・VPS の利用者が待つのは事業者のホストメンテナンス
      ・10月18日時点で Ubuntu は修正待ち。Hostinger は CVE を名指しし、VPS を再起動しながら修正中。エックスサーバー VPS の全ホストの停止メンテナンスは、告知に理由が無い
      まずやること（3つ）

      そのカーネルを誰が更新するかを確かめる。仮想マシンを動かすホストが自分のものか、クラウド・VPS 事業者のものか
      自分で更新する OS は、配布元のセキュリティ情報に従って修正版のカーネルに上げ、再起動する（版番号の読み方は下の確認コマンドの節）
      クラウド・VPS の利用者は、ゲストを更新してもホスト側の修正が終わったとは判断しない。事業者のホストメンテナンスの告知を確かめ、再起動のあとにサービスが自動で上がるかを見ておく
      さくらインターネットの措置はサービスで違います。

      サービス	止めたもの（既存の契約・リソースは通常どおり稼働）
      さくらのクラウド	プロジェクトの新規作成。新規プロジェクトが要る専用サーバ PHY・高火力 PHY の申し込みも
      さくらの VPS	全リージョンの新規申し込み、スケールアップ、持ち込み ISO のインストール、クラウドへの移行
      レンタルサーバ・マネージドサーバ	新規申し込み（メール専用を含む全プランとマネージドサーバ S/M/L）
      OSS の脆弱性を追う当サイトの全体像は サプライチェーン攻撃とは｜手口・防御ツール比較・npm 12の新機構まで実践解説 にあります。さくらの8月の事案は さくらインターネット不正アクセスとは｜第三報の951と136万・2023年4月からの期間・自分の確認手順 で扱った別の出来事です。カーネルのネットワーク処理の欠陥としては、7月の Fraggap解説｜LinuxカーネルIPv6のOOB書き込みでroot昇格するCVE-2026-53362 が近い型です。

