        ワークショップ会場へ移動
        ご予約の集合時間になりましたら、ワークショップの部屋へお越しください。
        ワークショップの部屋は「ちょっと、花札をつくろう」「ちょっと、花札であそぼう」どちらも第3展示棟2階にあります。なお、2階への移動はカフェ内の階段もしくはエレベーターをご利用ください。




        16:45
        ワークショップを体験する
        第3展示棟2階
        「ちょっと、花札をつくろう」では花札づくりが体験できます。つくった花札はご自宅に持ち帰ることができます。

        ワークショップを体験する
