      はじめに
      Claude Opus 5 は、2026年7月に公開された Anthropic の Opus ティア最新モデルです。複雑なエージェントコーディングとエンタープライズ業務向けに設計されていて、Anthropic は公式のプロンプトエンジニアリングガイド「Prompting Claude Opus 5」を公開しています。この記事では、そのガイドの内容を、推奨プロンプトの原文つきで整理します。

      先に結論を言ってしまうと、Opus 5 のプロンプティングの主役は「何を足すか」ではなく「何を引くか」です。既存の Opus 4.8 向けプロンプトはそのままでもよく動きます。ただ、Opus 5 は頼まれなくても自己検証し、自分のミスを自分で直すモデルなので、過去のモデルのために足していた「検証して」「ダブルチェックして」といった指示が、むしろ過剰動作とトークン浪費の原因になります。一方で、応答が長め・実況が多め・サブエージェント委譲に積極的という新しいクセもあり、そこはプロンプトで明示的に調整します。

      この記事では、公式ガイドが挙げる挙動別のパターンを1つずつ、推奨スニペットの原文と日本語解説つきで見ていきます。あわせて、ご要望の Opus 4.8 や他モデルとのコスト・性能比較も「なぜこのモデルのプロンプトを磨く価値があるのか」という文脈でまとめました。スニペットはすべて公式ガイドからの逐語引用なので、そのままコピーして使えます。

      前提：Opus 5 はどんなモデルか（コスト・性能比較）💰
      プロンプトの話に入る前に、対象モデルの立ち位置を押さえておきます。プロンプトを磨く投資に見合うモデルなのか、という話でもあります。

      モデル	入力（per 1M）	出力（per 1M）	SWE-bench Verified*	SWE-bench Pro*
      Fable 5	$10	$50	95.0	80.3（公称・論争あり）
      Opus 5	$5	$25	96.0	79.2
      Opus 4.8	$5	$25	88.6	69.2
      Sonnet 5	（導入
      2）	（導入
      10）	—	63.2
      GPT-5.6 Sol	$5	$30	88.7（GPT-5.5）	58.6（GPT-5.5）
      Gemini 3.1 Pro	$2	$12	—	54.2
      （*第三者集計。ベンダー公称値の寄せ集めで、同一環境での再実行ではありません）

      ポイントは2つです。Opus 5 は Opus 4.8 と同じ 
      25 のまま、SWE-bench Verified で 88.6 → 96.0 と大きく伸び、第三者集計では倍額の Fable 5（95.0）すら上回っています。公式主張でも「CursorBench で Fable 5 と 0.5% 差を半額」「OSWorld 2.0 で Fable 超えを約1/3コスト」。つまり、フロンティア級の知能が同じ請求額で手に入るようになったわけで、その性能を引き出すプロンプト調整のリターンも過去モデルより大きい、というのがこの記事の前提です。

      コーディングの得意領域も明確です。複数ファイルの機能実装、大規模リファクタ、エンドツーエンドの機能開発といった難しいタスクで最も強く、スタブやプレースホルダーを残さず完遂します。公式が明言する使い方のコツは、「完全なタスク仕様を最初に渡して、あとは任せる」。細かく刻んで指示するより、ゴールと制約をまとめて渡す方が性能が出ます。

      全体マップ：足す指示と、引く指示 🗺️
      公式ガイドのパターンを「引き算」と「調整（足し算）」に分類すると、全体像がつかみやすくなります。


      この図のポイントは、左の「引き算」がすべて過去のモデルの弱点を補うために足していた指示だという点です。Opus 5 はその弱点自体が解消されているので、補助輪が抵抗になります。右の「調整」は Opus 5 の新しいデフォルト挙動で、良し悪しではなく製品の要件に合わせてプロンプトで方向づけするものです。順番に見ていきます。

      まず引き算：検証と再確認の指示を外す ✂️
      いちばん効果が大きく、いちばん簡単なのがこれです。

      Opus 5 は、頼まれなくても自分の作業を検証します。 プロンプトに「非自明なタスクには最後に検証ステップを入れて」「サブエージェントを使って検証して」のような明示的な検証指示が残っていると、モデル自身の検証と重なって過剰検証になります。公式は「これらの指示を削除すること。品質を落とさずに無駄なトークンを減らせる」と明言しています。ハーネス側に組み込んだ検証ステップの足場（scaffolding）も同様です。

      自己修正も同じです。 Opus 5 は自分のミスをよく見つけてよく直すので、「答えをダブルチェックして」「返答前に再検証して」といった指示は、モデル自身の挙動と複合してコストだけが増えます。これも削除対象です。

      なお、修正するときに「先ほどの発言を訂正します」と実況しがちな面はあり、ユーザー向け製品では気になることがあります。意味のある訂正だけ口に出させるスニペットが用意されています。

      Only correct an earlier statement when the error would change the user's code,
      conclusions, or decisions. State corrections plainly and briefly, then continue
      the task. For slips that change nothing for the user, make the fix and move on
      without noting it.
      以前の発言を訂正するのは、その誤りがユーザーのコード、結論、または判断に影響を与える場合に
      限ります。訂正は簡潔かつ明確に述べ、その後作業を続行してください。
      ユーザーにとって何の影響もない言い間違いについては、修正を加え、特に言及することなく作業を
      進めてください。
      （ユーザーのコード・結論・判断が変わる誤りのときだけ訂正を述べる。訂正は簡潔に述べて作業を続ける。ユーザーに影響しない些細なミスは、直すだけで言及しない。）

      応答の長さ：effort では短くならない 📏
      Opus 5 のユーザー向け応答は、過去の Opus よりデフォルトで長めです。ここで大事な公式の注意があります。effort パラメータが制御するのは「考える量」であって「話す量」ではないということです。effort を下げれば思考トークンは減りますが、目に見える応答が確実に短くなるわけではありません。長さはプロンプトで明示的に指定します。

      短い簡潔さ指示で効きます。ユーザー向けのマルチターン製品の例です。

      Keep responses focused, brief, and concise. Keep disclaimers and caveats short,
      and spend most of the response on the main answer. When asked to explain
      something, give a high-level summary unless an in-depth explanation is
      specifically requested.
      回答は的を絞り、簡潔かつ要点を絞って記述してください。免責事項や注意点は短くまとめ、
      回答の大部分を本題の回答に充ててください。何かを説明するよう求められた場合は、
      特に詳細な説明が求められていない限り、大まかな概要を述べてください。
      （応答は焦点を絞り簡潔に。免責や但し書きは短く、応答の大半を本題に使う。説明を求められたら、詳細説明が明示的に要求されない限り高レベルの要約を返す。）

      長いシステムプロンプトでは、この指示に加えて末尾に短いリマインダーを置くのが公式の推奨です。

      <tone_preference>
      Keep outputs reasonably concise.
      </tone_preference>
      <tone_preference>
      出力は適度に簡潔に保つようにしてください。
      </tone_preference>
      会話の応答とは別に、ディスクに書き出すファイル（レポート・Markdown文書・要約）も長くなりがちです。Claude が文書を書く製品では、長さの基準を明示します。

      Match the length of written documents to what the task needs: cover the
      substance, but do not pad with filler sections, redundant summaries, or
      boilerplate.
      作成する文書は、課題の要件に合わせて適切な長さに調整してください。
      内容を網羅しつつ、無駄な部分や冗長な要約、定型文などで文章を水増ししないようにしてください。
      （文書の長さはタスクに必要な分に合わせる。中身は網羅しつつ、埋め草のセクション・冗長な要約・定型文で水増ししない。）

      進捗ナレーション：頻度と形を指定する 📢
      Opus 5 はエージェント作業中によく実況します。何をしようとしているかを宣言し、エージェントセッションでの1メッセージあたりの出力も過去モデルより長めです。これは放置するか調整するかを製品ごとに決める話で、減らしたい場合は「いつ・どんな形で」を describing します。

      Before your first tool call, say in one sentence what you're about to do. While
      working, give a brief update only when you find something important or change
      direction. When you finish, lead with the outcome: your first sentence should
      answer "what happened" or "what did you find," with supporting detail after it
      for readers who want it.
      初めてツールの使用を依頼する前に、これから何をするのかを1文で簡潔に伝えてください。
      作業中は、重要な発見があった場合や方向性を変える場合にのみ、簡潔な進捗報告を行ってください。
      作業終了時には、結果を最初に述べてください。
      最初の文で「何が起きたか」または「何が見つかったか」に答え、その後に、
      詳細を知りたい読者のために補足情報を続けてください。
      （最初のツール呼び出しの前に、これから何をするかを一文で。作業中は重要な発見か方針転換のときだけ簡潔に更新。完了時は結果を先頭に——最初の一文が「何が起きたか/何が見つかったか」に答え、詳細はその後に。）

      逆に増やしたい・スタイルを変えたい場合も同じレバーで、望む更新の形を明示して例を示します。ここで公式が添えている原則が実践的です。「やってほしいコミュニケーションスタイルの positive example の方が、『するな』という指示より効く」。禁止リストを積むより、お手本を1つ見せる方が確実です。

      タスクスコープ：広げさせない柵を立てる 🚧
      Opus 5 は、頼まれていないステップを足したり、「このタスクはこうあるべき」という自分の判断でスコープを変えたりすることがあります。良く言えば気が利く、悪く言えばお節介です。狭いタスクでは明示的に柵を立てます。

      Deliver what was asked, at the scope intended. Make routine judgment calls
      yourself, and check in only when different readings of the request would lead
      to materially different work. If the request seems mistaken or a better
      approach exists, say so in a sentence and continue with the task as asked
      rather than quietly narrowing, widening, or transforming it. Finish the whole
      task, and stop short of actions that are clearly beyond what was asked.
      依頼された内容を、想定された範囲内で成果物として納品してください。
      日常的な判断は自身で行い、依頼内容の解釈の違いによって作業内容が実質的に異なる結果となる
      場合にのみ、確認を求めてください。
      依頼内容が誤っていると思われる場合や、より良いアプローチが存在する場合は、一言その旨を伝え、
      依頼された通りに作業を進めてください。
      黙って依頼の範囲を狭めたり、広げたり、変更したりすることは避けてください。
      タスク全体を完了させ、依頼の範囲を明らかに超える行動は控えてください。
      （頼まれたことを、意図されたスコープで納品する。日常的な判断は自分で行い、解釈の違いで成果が大きく変わるときだけ確認する。依頼が誤っている・より良い方法があると思うなら一文で伝えたうえで、黙って狭めたり広げたり変形したりせず、頼まれたとおりに続ける。タスク全体を完遂し、明らかに依頼を超える行動は控える。）

      このスニペットの妙は、「勝手にやるな」と「いちいち聞くな」を両立させている点です。ルーチンの判断は任せ、材料が分かれるときだけ確認し、異見は一文で述べて作業は止めない。エージェント製品の指示文としてそのまま使える完成度だと思います。

      サブエージェント委譲：条件と上限を決める 🤝
      Opus 5 は過去モデルよりサブエージェントへの委譲に積極的です。本当に独立した大きな作業なら委譲は効きますが、小さなタスクに使うとコストと時間が倍々で増えます。ハーネスがサブエージェントに対応しているなら、委譲してよい条件を明示するか、起動数に決定論的な上限を設けます。

      Delegate to a subagent only for large tasks that are genuinely independent and
      parallelizable, such as a wide multi-file investigation. Do not delegate work
      you can finish yourself in a handful of tool calls, and do not use subagents to
      verify or double-check your own work. If one subagent can complete the task,
      use one rather than several, and keep spawn counts low.
      サブエージェントへの委任は、大規模なマルチファイル調査など、真に独立しており、
      並列処理が可能な大規模なタスクに限定してください。
      ツール呼び出しを数回行うだけで自分で完了できる作業を委任したり、
      サブエージェントを使って自身の作業を検証・再確認したりしないでください。
      1つのサブエージェントでタスクを完了できる場合は、複数ではなく1つを使用し、
      生成数を最小限に抑えてください。
      （委譲は、広範囲のマルチファイル調査のような、真に独立で並列化できる大きなタスクに限る。数回のツール呼び出しで自分で終わる仕事は委譲しない。自分の作業の検証・ダブルチェック目的でサブエージェントを使わない。1体で済むなら複数使わず、起動数は少なく保つ。）

      「検証目的の委譲禁止」が入っているのがポイントで、前述の過剰検証対策と一貫しています。なお、マルチエージェント協調自体は Opus 5 の強化点です。writer-verifier パターンが有効に機能し、エージェント同士が互いの作業を上書きする事故も少ない、と公式が述べています。「協調は上手いが、起動判断は製品側で制御する」という関係です。


      思考OFFで動かす場合の注意 ⚠️
      Opus 5 は思考（thinking）がデフォルトONで、OFFにできるのは effort high 以下のときだけです（xhigh / max で OFF を指定すると 400 エラー）。そして公式の第一推奨は明確で、OFFにするのではなく、思考ONのまま低 effort でコストを制御すること。多くのタスクで、同等コストなら「thinking ON ＋ low effort」の方が「thinking OFF」より良い結果になります。

      それでも OFF で動かす統合では、可視出力に2種類のアーティファクトが出ることがあります。

      ツール呼び出しがテキストに漏れる: 構造化された tool_use ブロックの代わりに、ツール呼び出しを本文に書いてしまう。ターンは正常終了しますが呼び出しは実行されず、漏れたテキストが会話履歴に残って後続ターンにも影響します。検索などツール多用のワークロードで起きやすい現象です。
      内部XMLタグが漏れる: <thinking> などの内部タグが可視応答に混ざる。ここで重要な注意があり、システムプロンプトに「考えるな」「推論するな」系のルールがあるとタグ漏れがむしろ増えるので、削除してください。
      どうしても OFF が必要な統合向けに、両方を一度に緩和するスニペットが示されています。

      When you use a tool, you may say a brief sentence first. If no tool can express
      what the user asked for, say so instead of guessing. Do not include internal or
      system XML tags in your response.
      ツールを使用する際は、まず短い文章を述べてください。
      ユーザーの要望を表現できるツールがない場合は、推測せずにその旨を伝えてください。
      応答には、内部タグやシステムXMLタグを含めないでください。
      （ツールを使うときは、先に短い一文を言ってよい。ユーザーの依頼を表現できるツールがなければ、推測せずその旨を言う。内部・システム用のXMLタグを応答に含めない。）

      面白いのは最後の一文の設計で、公式によると「thinking タグ」を名指しで禁止するより、この一般形の方が効くそうです。具体名を出すとかえって意識してしまう、というのは人間にも覚えがある話です。

      コードレビューは「全部報告 → 別パスで絞る」🔍
      Opus 5 のコードレビューは精度・再現率とも高く、1パスあたりの実バグ検出率が高いうえに追加の指摘も大半が本物（偽陽性が少ない）です。しかも低 effort でも精度が保たれるので、「コミット時に低 effort の速いパス、リリース前に高 effort の徹底パス」という2段構成が組めます。

      プロンプト側の注意は1つです。レビュープロンプトに「重大な問題だけ報告して」「保守的に」と書いてあると、Opus 5 はその指示に文字通り従って報告を減らします。調査はちゃんとしているのに、報告段階で自己検閲してしまう形です。公式の推奨は、まず全部報告させて、フィルタリングは別パスで行うこと。検出と選別を分業させると、検出力を殺さずに最終出力を絞れます。


      effort とビジョン：持ち越し設定を再検証する 🎚️
      プロンプトそのものではありませんが、公式ガイドが「持ち越しの見直し」を求めている項目が2つあります。

      effort のスイープをやり直す。 Opus 5 は low / medium の品質が大幅に向上していて、品質が保てる場面では low/medium を「トークンコストと応答時間の主たる制御」として惜しみなく使うのが公式推奨です。既定の high から evals に基づいて上下させ、要求の厳しいコーディング・エージェント作業だけ xhigh へ。前のモデルから effort の既定値を持ち越しているなら、自分の評価セットでスイープを再実行してください。

      ビジョンの回避策を再検証する。 チャート・文書・図の理解や UI 再現が強化されたので、旧モデル向けにプロンプトへ足していたビジョンの回避策は不要になっている可能性があります。また、ビジョン性能を引き出すレバーとしては、思考を深くするより「反復的に分析・クロップ・視覚検証できるツールを与える」方が費用対効果が高い、というのが公式の助言です。Office 系（複雑な複数シートのスプレッドシート・スライド作成）では、従うべきスタイルやテンプレートを明示的に渡します。

      まとめ：移行チェックリスト ✅
      公式ガイドの内容を、Opus 4.8 からの移行チェックリストとして1枚にまとめます。

      #	やること	種別
      1	「検証して」「サブエージェントで検証」を削除する	✂️ 引き算
      2	「ダブルチェック」「再確認してから」を削除する	✂️ 引き算
      3	「考えるな・推論するな」系ルールを削除する（タグ漏れが増える）	✂️ 引き算
      4	旧モデル向けビジョン回避策を再検証して不要なら削除する	✂️ 引き算
      5	応答の長さ・成果物の長さをプロンプトで明示する（effort では短くならない）	🎛️ 調整
      6	進捗ナレーションの頻度と形を指定する（positive example が効く）	🎛️ 調整
      7	狭いタスクにはスコープの柵を立てる	🎛️ 調整
      8	サブエージェント委譲の条件と上限を決める	🎛️ 調整
      9	思考OFF運用なら「ON＋低 effort」への切り替えを検討する	🎛️ 調整
      10	レビューは「全部報告→別パスで絞る」に変える	🎛️ 調整
      11	effort のスイープを自分の evals でやり直す	📏 計測
      この記事でいちばん重要なのは、「Opus 5 のプロンプト改善は、書き足すことより、前のモデルのために書いた補助輪を外すことから始まる」という一点です。同じ 
      25 で Fable 5 級の性能が出るモデルになった今、その性能を素直に出させる邪魔をしているのは、往々にして自分の古いプロンプトです。まずはお使いのシステムプロンプトを開いて、「検証」「ダブルチェック」で検索するところから始めてみてください。消すだけでトークンが減って品質は変わらない、という一番おいしい改善が、たぶん最初に見つかります。

