      賞金約9,750万円、Apex世界大会でUNLIMITが日本チーム初優勝。結成1年未満の3人が快挙！

      篠原修司

      ITジャーナリスト
      7/12(日) 12:23
      優勝を喜ぶ『UNLIMIT（アンリミット）』のメンバーたち。YouTubeより筆者キャプチャ
      　7月11日（現地時間）、フランス・パリで開催されたオンラインゲーム『Apex Legends（エーペックス・レジェンズ）』の世界大会「ALGS Year 6 Split 1 Playoffs」で、日本のプロチーム『UNLIMIT（アンリミット）』が優勝しました。

      　MVPにも同チームのPeace（ピース）選手が選出され、日本勢として史上初の世界大会優勝です。優勝賞金は60万ドル（約9,750万円）です。

      　しかも決勝の最終局面で残ったのは、UNLIMITと同じ日本の『ZETA DIVISION（ゼータ・ディビジョン）』でした。日本人チーム同士の一騎打ちを制しての世界一です。

      　この記事では、ゲームを知らない人に向けて、Apex Legendsとはどんなゲームなのか、UNLIMITがどんなチームで、選手たちがどんな歩みを経て優勝までたどり着いたのかを解説します。

      Apex Legendsってどんなゲーム？
      　Apex Legendsは、2019年にサービス開始された基本プレイ無料のPC向けシューティングゲームです。3人1組のチームが最大20組、合計で60人が同じ戦場に参加し、最後まで生き残った1チームが勝者となる「バトルロイヤル」形式を採用しています。

      　その世界一を決める公式大会が「ALGS（Apex Legends Global Series）」です。今大会は世界最大級のeスポーツイベント「Esports World Cup 2026」のひとつとしてパリで開かれ、賞金総額は200万ドル（約3億2,500万円）、優勝チームには60万ドルが贈られます。

      　決勝は「ポーランドルール」という独特のマッチポイント形式で勝者が決まります。このルールでは、まず各チームは試合を重ねて合計50ポイントに到達しなければいけません。到達することで初めて「優勝できる状態」となり、そこから1位を取ることで優勝が決定します。

      　つまり、どれだけポイントを取っても1位にならない限り優勝ができません。これまではスコアポイント方式だったため、獲得したポイントの合計が一番多いチームが優勝という実力が反映されやすいルールでしたが、最後の試合の途中の段階でもう優勝チームが分かってしまうという大会としては盛り上がりに欠ける部分もありました。

      　一方でポーランドルールでは複数のチームが優勝に王手をかけた状態で試合が続き、そのなかで「最後まで生き残っていたチームが勝者」というバトルロイヤル形式としてはとても分かりやすいかたちで優勝チームが決まるため、初採用された2019年以降、このルールが使われ続けています。

      決勝は10試合目、日本チーム同士の一騎打ちで決着！

      　今回の大会の決勝では、最終的に全20チーム中11チームが王手をかけた状態になる大混戦となり、10試合目でついに決着しました。

      　その最終局面で撃ち合ったのが、UNLIMITとZETA DIVISIONです。両チームともマッチポイントに到達しており、この時点でどちらが勝っても日本チームの世界一が決まる状況でした。

      　そしてその1対1を制したのが、UNLIMITです。

      　内容も、その実力が現れたものでした。UNLIMITは決勝戦で合計3回も試合1位を獲得し、46キルは出場チーム中トップ。2位のTeam Visionに6ポイント差をつけての優勝です。敗れたZETA DIVISIONも5位に入っており、日本勢の強さを世界に示す大会となりました。

      　ちなみにUNLIMITは、決勝進出をかけて戦うグループステージを獲得ポイント順でボーダーぎりぎりの14位で通過しています。じつは決勝で敗れたZETA DIVISIONは、グループステージで他のライバルチームを倒してポイントを取らせないことでその通過を手助けしていました。


      　そしてその2チームが最後に決勝でぶつかり、UNLIMITが優勝するという劇的な結末となりました。

      　記事には載せませんが、ZETA DIVISIONのYukaF選手が涙する様子が画面に映し出されたときは、いち視聴者として心にくるものがありました。

      全員が集まって1年未満のチーム『UNLIMIT』
      　優勝したUNLIMITは、東京・渋谷の株式会社FT UNLIMITが運営するeスポーツチームです。2025年6月に前身の『GHS Professional』からチーム名を変更し、現在の体制になりました。

      　所属する選手は3人とも日本出身で、全員が21歳以下です。その3人がそろったのは2025年8月と、じつは結成から1年経っていません。

      勝利者インタビューに答えるチームの司令塔、Xtsuvi（ツビ）選手。YouTubeより筆者キャプチャ
      　Xtsuvi（ツビ）選手は2005年生まれの21歳。試合中にどこへ移動し、いつ戦うかを決める司令塔となる「IGL」という役割です。バトルロイヤルゲームは撃ち合いの強さだけでなく、20チームがひしめく戦場でどのポジションを取るかが勝敗を分けるため、IGLはチームの頭脳と言える存在です。

      　2025年2月に前身チームの若手部門『GHS BoooM』に加入し、同年6月のチーム名変更を経てUNLIMITの主力となりました。プロ入りからわずか1年半でチームを世界一へと導いたことになります。

      観客席からの声援に応えるYulariman（ゆらりまん）選手。YouTubeより筆者キャプチャ
      　Yulariman（ゆらりまん）選手は2007年生まれの19歳で、チーム随一の火力を誇るエースです。もともとは配信活動をしていた一般のプレイヤーで、ランキング上位の実力を買われて2024年5月、17歳でGHS BoooMに加入しました。

      　そしてその年の11月には国内ランキングの最上位帯で日本1位を記録。2025年5月の世界大会では1試合14キルという世界記録タイを叩き出し、一躍その名を知られるようになりました。競技を始めてからわずか2年での世界一です。

      MVPに選ばれたPeace選手は複数チームを渡り歩いた苦労人
      MVPの盾を掲げ、感極まった表情で喜ぶPeace（ピース）選手。YouTubeより筆者キャプチャ
      　そして今大会のMVPに選ばれたPeace（ピース）選手は、2005年生まれの21歳。3人の中で最も競技歴が長く、そして最も居場所に恵まれなかった選手です。

      　プロデビューは2023年8月、『Soleil Gaming』への加入でした。しかし翌2024年4月にはチームは解散し、Peace選手も退団となります。同年7月に『KINOTROPE gaming』へ加入するも、ここでもわずか3ヶ月ほどでチームごと解散。デビューから約1年で、2度も所属先を失うこととなりました。

      　居場所を失ったPeace選手は、元チームメイトとともに『LFT_ARMY』という名前の無所属チームで戦うことを選びました。LFTとは競技シーンの用語で「所属チームを探している」という意味で、新しい所属先を探しながら戦いを続けていたわけです。

      　その思いが叶い2025年3月に『TIE』へ加入しますが、同年7月には契約満了で退団。ところがそれから約3週間後、ここでUNLIMITがPeace選手を獲得します。

      　キーボードとマウスを使う唯一の選手として、コントローラーの2人を支える役割がかみ合い、加入直後のリーグ戦でいきなり地域総合1位を獲得。そして加入から1年足らずで迎えた今大会で、世界一と大会MVPを同時に手にしました。

      　しかし、Apex Legendsのシーズンはまだまだ続きます。次のラスベガスでの世界大会を経て、年明けには年間王者を決めるチャンピオンシップが3年連続で札幌で開かれる予定です。

      　「ALGS Year 6 Split 1 Playoffs」を優勝したUNLIMITには、すでに出場権が与えられています。そして惜しくも敗れたZETA DIVISIONも、成績を考えると出場の可能性が高いでしょう。

      　つまり今年は、日本が世界一のチームを抱えた状態で世界の強豪たちを迎えるという、Apex Legends史上で日本にとってこれ以上ない舞台ができあがっています。

      　これまで日本のチームは、世界に「挑む側」でした。しかし次に札幌のステージに立つとき、UNLIMITは世界中から挑まれて「迎え撃つ側」です。PCのFPSタイトルにおいて、日本が初めて経験する景色が半年後に待っています。

      UNLIMITの3名。左からPeace選手、Xtsuvi選手、Yulariman選手。YouTubeより筆者キャプチャ

