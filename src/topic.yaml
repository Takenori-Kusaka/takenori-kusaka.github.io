          ケースC
          python-requests/2.33.1
          Metabase-GHSA-vwf4/2.0
          観測レポートも、観測したUser-AgentとJA4 fingerprintの例を掲載している。いずれも正規の利用者が使っている可能性があるとして、ログ調査の手がかりとして使い、遮断等の判断は前後の通信内容とあわせて行うよう求めている。ログ調査の観点としては、通常と異なるHTTPレスポンスコードの偏りとレスポンスサイズの違いを挙げる。なお、以下のUser-Agentに含まれるURLは、リンクにならないよう「hxxps」「[.]」に置き換えて記載した。(出典: 16)

