        npm代替を目指すセキュリティファーストなパッケージマネージャ「vlt」バージョン1.0に到達。npmのミラーレジストリ、プライベートレジストリも提供開始
        2026年8月6日

        npmに代わる新しいJavaScriptのパッケージシステム「vlt」（vōlt：ボールト）を開発しているvlt technologyは、npm互換のパッケージマネージャ「vlt」がバージョン1.0に到達したことを発表しました。

        あわせてnpmのミラーレジストリおよびプライベートレジストリソフトウェア「vsr」の有料ホスティングサービスも提供が開始されました。

        fig
        下記はvltファウンダーのDarcy Clarke氏のポストです。


        Node.jsが開拓したJavaScriptパッケージマネージャ
        JavaScriptのパッケージマネージャは、サーバサイドJavaScriptを開拓したNode.jsに対応するJavaScriptアプリケーションやモジュールをパッケージングし、再利用可能にする目的で登場しました。

        代表的なパッケージマネージャおよびパッケージレジストリがnpmであり、他にもYarnやpnpm、JSRなどがあります。

        これらパッケージマネージャはそれぞれに特徴を備えていますが、vltはnpmをそのまま置き換えられる互換性を保ちつつ、セキュリティファーストとしてJavaScipttサプライチェーンの安全性を実現することに力点が置かれたソフトウェアおよびサービスです。

        vltはnpmをそのまま置き換えて高速に
        vltはnpmと同じコマンド体系を備えているため、既存のツールチェーンなどでもnpmをvltに置き換えてそのまま使えるようになっています。

        また、デフォルトでnpmレジストリのミラーであるvltレジストリを参照します（npmレジストリを参照するように切り替えも可能）。

        vltレジストリもnpmレジストリと同じAPI体系を保った後方互換性を備えているため、npmやyarn、deno、bunなどからもnpmレジストリの代わりにvltレジストリを利用可能です。

        その上で利用者に近いエッジロケーションからパッケージを配布する仕組みなどによって、クリーンインストールの時間を比較するとnpmレジストリより38％速くなっているとのことです。

        セキュリティファーストかつ高度なフィルタリングや検索が可能
        vltレジストリではセキュリティファーストを実現するため、オープンソースの脆弱性データベースであるOSVなどを参照して不正なmanifestやマルウェアなど、現時点で27万5000以上のパッケージを排除。そもそもマルウェアを含まない安全なJavaScriptレジストリの提供を目指しています。

        さらにvltおよびvltレジストリではパッケージ同士の関係をグラフ構造として扱えるようになっており、「ローカルに存在するすべてのプロジェクトで使われている依存を検索したい」「特定の依存を持つパッケージを除外したい」「特定のバージョン範囲にマッチする依存だけ見たい」といった高度な検索やフィルタリング を行うための仕組みを備えています。

        その依存関係やバージョン、セキュリティの状態などを示すために、パッケージごとに「グラフネイティブ疑似セレクタ」が設定されています。

        無料でプライベートレジストリも設定可能
        vltは2GBまでのプライベートレジストリも無料で利用可能となっており、それ以上の容量は有料で設定可能です。